  function renderFormularios() {
    const totalForms = FORMULARIOS.length;
    const activos = FORMULARIOS.filter(f => normalizar(f.estado) === 'activo').length;
    const inactivos = totalForms - activos;
    const procesadas = FORMULARIOS.reduce((s,f) => s + Number(f.resumen?.procesadas || 0) + Number(f.resumen?.duplicadas || 0), 0);
    const advertencias = FORMULARIOS.reduce((s,f) => s + Number(f.resumen?.advertencias || 0), 0);
    const revisiones = FORMULARIOS.reduce((s,f) => s + Number(f.resumen?.revision || 0), 0);

    texto('fActivos', activos);
    texto('fArchivosActivos', CAPACIDAD_FORMULARIOS.archivosRespuestaActivos || 0);
    texto('fTriggers', `${CAPACIDAD_FORMULARIOS.activadoresUtilizados || 0} / ${CAPACIDAD_FORMULARIOS.limiteTecnico || 20}`);
    texto('fDisponibles', CAPACIDAD_FORMULARIOS.activadoresDisponibles ?? 20);
    texto('fFormsPorTrigger', Number(CAPACIDAD_FORMULARIOS.formulariosPorActivador || 0).toFixed(1));
    texto('fProcesadas', procesadas);
    texto('fAdvertencias', advertencias);
    texto('fRevision', revisiones);

    const elContTodos = document.getElementById('contFiltroForm_todos');
    const elContActivos = document.getElementById('contFiltroForm_activos');
    const elContInactivos = document.getElementById('contFiltroForm_inactivos');
    if (elContTodos) elContTodos.textContent = totalForms;
    if (elContActivos) elContActivos.textContent = activos;
    if (elContInactivos) elContInactivos.textContent = inactivos;

    const alerta = document.getElementById('alertaCapacidadFormularios');
    if (alerta) { alerta.hidden = !CAPACIDAD_FORMULARIOS.alerta; alerta.textContent = CAPACIDAD_FORMULARIOS.alerta || ''; }
    const tbody = document.getElementById('tablaFormularios');
    if (!tbody) return;

    if (!FORMULARIOS.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Todavía no hay formularios de inscripción vinculados.</td></tr>';
      return;
    }

    // Filtrado por estado (Todos / Activos / Inactivos)
    let lista = FORMULARIOS;
    if (FILTRO_ESTADO_FORMULARIOS === 'activos') {
      lista = lista.filter(f => normalizar(f.estado) === 'activo');
    } else if (FILTRO_ESTADO_FORMULARIOS === 'inactivos') {
      lista = lista.filter(f => normalizar(f.estado) !== 'activo');
    }

    // Filtrado por buscador en tiempo real
    const query = normalizar(document.getElementById('inputBuscarFormularios')?.value || '');
    if (query) {
      lista = lista.filter(f => {
        const act = normalizar(f.actividad || '');
        const idA = normalizar(f.idActividad || '');
        const arch = normalizar(f.archivo || '');
        const hoja = normalizar(f.hoja || '');
        return act.includes(query) || idA.includes(query) || arch.includes(query) || hoja.includes(query);
      });
    }

    if (!lista.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty-state">No se encontraron formularios que coincidan con la búsqueda o filtro seleccionado.</td></tr>';
      return;
    }

    tbody.innerHTML = lista.map(f => {
      const r = f.resumen || {};
      const detalles = (r.detallesRevision || []).map(x => `Fila ${esc(x.fila || '—')}: ${esc(x.detalle)}`);
      if (Number(r.pendientes || 0)) detalles.unshift(`${esc(r.pendientes)} respuesta(s) pendiente(s) de recuperar.`);
      const detalle = detalles.join('<br>') || '—';
      const activo = normalizar(f.estado) === 'activo';
      const automatizacion = f.activador || {estado: activo ? 'Sin diagnóstico' : 'No requerido', operativo: !activo};
      return `<tr>
        <td><strong>${esc(f.actividad)}</strong><br><span class="muted">${esc(f.idActividad)}</span></td>
        <td>${esc(f.archivo)}<br><span class="muted">${esc(f.hoja)}</span></td>
        <td><span class="badge ${activo ? 'success' : ''}">${esc(f.estado)}</span></td>
        <td><span class="badge">${esc(automatizacion.estado)}</span></td>
        <td>${esc(r.total || 0)}</td>
        <td>${esc((r.procesadas || 0) + (r.duplicadas || 0))}</td>
        <td>${esc(r.advertencias || 0)}</td>
        <td>${esc(r.revision || 0)}</td>
        <td>${detalle}</td>
        <td>
          <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
            <button class="btn secondary compact" type="button" data-id="${esc(f.idConfig)}" onclick="repararYRecuperarFormularioWeb(this.dataset.id)" title="Reprocesar e inscribir todas las respuestas de la planilla">⚡ Reprocesar</button>
            <button class="btn secondary compact" type="button" data-id="${esc(f.idConfig)}" onclick="cargarCasosRevision(this.dataset.id)" ${(r.revision || 0) ? '' : 'disabled'}>Casos (${esc(r.revision || 0)})</button>
            <button class="btn secondary compact" type="button" data-id="${esc(f.idConfig)}" data-activo="${activo ? '0' : '1'}" onclick="cambiarEstadoFormularioWeb(this.dataset.id,this.dataset.activo)">${activo ? 'Desactivar' : 'Activar'}</button>
            <button class="btn secondary compact danger" type="button" data-id="${esc(f.idConfig)}" data-nombre="${esc(f.actividad)}" onclick="eliminarFormularioWeb(this.dataset.id,this.dataset.nombre)" title="Eliminar vinculación duplicada o no deseada">✕ Desvincular</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  function filasReporteAsistenciasFiltradas_() {

      ['Estado selección', 'ESTADO_SELECCION'],
      ['Confirmación', 'CONFIRMA_PARTICIPACION'],

      ['Sesiones totales', 'SESIONES_TOTALES'],
      ['Detalle sesiones asistidas', 'SESIONES_DETALLE_TEXTO']

    const detalleCampos = ['ID_ACTIVIDAD','NOMBRE_ACTIVIDAD','ANO','ESCUELA_LINEA','AREA_TEMATICA','INSTITUCION_ASOCIADA','MODALIDAD','ESTADO_ACTIVIDAD','CUPOS','INSCRIPCIONES','SELECCIONADAS','ASISTENTES'];

  function filaPareceDatosImportacion_(fila) {
    if (!Array.isArray(fila) || !fila.length) return false;
    const celdas = fila.map(v => String(v || '').trim()).filter(Boolean);
    if (!celdas.length) return false;
    const tieneCorreo = celdas.some(c => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c));
    const tieneRut = celdas.some(c => /^\d{1,2}\.?\d{3}\.?\d{3}-?[\dkK]$/i.test(c) || /^\d{7,8}-[\dkK]$/i.test(c.split(/\s+/)[0]));
    const tienePalabrasEncabezado = celdas.some(c => {
      const h = normalizar(c).replace(/^\d+[\.\)\-\s¿¡]+/, '').trim();
      return /^(marca temporal|timestamp|nombre completo|nombres y apellidos|nombre|nombres|apellidos|rut|run|correo|correo electronico|email|telefono|celular|comuna)$/.test(h);
    });
    return (tieneCorreo || tieneRut) && !tienePalabrasEncabezado;
  }

  function autogenerarEncabezadosDesdeFilaDatos_(fila, ancho) {
    const encabezados = [];
    let yaAsignoNombre = false;
    for (let i = 0; i < ancho; i++) {
      const val = String(fila[i] ?? '').trim();
      if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}/.test(val)) {
        encabezados.push('Marca temporal');
      } else if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
        encabezados.push('Correo electrónico');
      } else if (/^\d{1,2}\.?\d{3}\.?\d{3}-?[\dkK]$/i.test(val) || /^\d{7,8}-[\dkK]$/i.test(val.split(/\s+/)[0])) {
        encabezados.push('RUT');
      } else if (/^\+?56\s*9[\d\s\/\-]{7,}$/.test(val) || /^9\s*\d[\d\s\/\-]{6,}$/.test(val)) {
        encabezados.push('Teléfono de contacto');
      } else if (!yaAsignoNombre && val.length >= 5 && /[a-zA-ZáéíóúñÁÉÍÓÚÑ]+\s+[a-zA-ZáéíóúñÁÉÍÓÚÑ]+/.test(val) && !/\d/.test(val)) {
        encabezados.push('Nombre completo');
        yaAsignoNombre = true;
      } else {
        encabezados.push(`Columna ${i + 1}`);
      }
    }
    return encabezados;
  }

  function leerTablaImportacion() {
    const textoPegado = document.getElementById('importTexto')?.value || '';
    if (!textoPegado.trim()) return notificar('Pegue primero una tabla con encabezados.', true);
    const matriz = parsearTablaPegada_(textoPegado);
    if (!matriz.length) return notificar('No se detectaron filas válidas en el texto pegado.', true);
    const ancho = Math.max(...matriz.map(fila => fila.length));
    const primeraFilaEsDatos = filaPareceDatosImportacion_(matriz[0]);
    if (!primeraFilaEsDatos && matriz.length < 2) {
      return notificar('La tabla debe incluir encabezados y al menos una fila de datos.', true);
    }
    if (primeraFilaEsDatos) {
      IMPORTACION.encabezados = autogenerarEncabezadosDesdeFilaDatos_(matriz[0], ancho);
      IMPORTACION.filas = matriz
        .filter(fila => fila.some(valor => String(valor || '').trim()))
        .map(fila => IMPORTACION.encabezados.map((_, indice) => fila[indice] ?? ''));
    } else {
      IMPORTACION.encabezados = matriz[0].map((valor, indice) => String(valor || `Columna ${indice + 1}`).trim());
      while (IMPORTACION.encabezados.length < ancho) IMPORTACION.encabezados.push(`Columna ${IMPORTACION.encabezados.length + 1}`);
      IMPORTACION.filas = matriz.slice(1)
        .filter(fila => fila.some(valor => String(valor || '').trim()))
        .map(fila => IMPORTACION.encabezados.map((_, indice) => fila[indice] ?? ''));
    }
    if (IMPORTACION.filas.length > 250) {
      IMPORTACION.filas = IMPORTACION.filas.slice(0, 250);
      notificar('Se cargaron las primeras 250 filas. El resto debe importarse en un segundo lote.', true);
    }
    renderMapeoImportacion_();
    const panel = document.getElementById('panelMapeoImportacion');
    panel.hidden = false;
    panel.scrollIntoView({behavior:'smooth', block:'start'});
    if (IMPORTACION.autoListo && document.getElementById('importActividad')?.value) {
      analizarImportacionPegada();
    }
  }

  function parsearTablaPegada_(textoPegado) {
    const texto = String(textoPegado).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    let delimitador = '\t';
    if (!texto.includes('\t')) {
      const primeraLinea = texto.split('\n').find(linea => linea.trim()) || '';
      const candidatos = [';', ','];
      delimitador = candidatos.sort((a, b) => primeraLinea.split(b).length - primeraLinea.split(a).length)[0];
    }
    const filas = [];
    let fila = [], celda = '', entreComillas = false;
    for (let i = 0; i < texto.length; i++) {
      const caracter = texto[i];
      if (caracter === '"') {
        if (entreComillas && texto[i + 1] === '"') { celda += '"'; i++; }
        else entreComillas = !entreComillas;
      } else if (caracter === delimitador && !entreComillas) {
        fila.push(celda.trim()); celda = '';
      } else if (caracter === '\n' && !entreComillas) {
        fila.push(celda.trim());
        if (fila.some(valor => valor !== '')) filas.push(fila);
        fila = []; celda = '';
      } else {
        celda += caracter;
      }
    }
    fila.push(celda.trim());
    if (fila.some(valor => valor !== '')) filas.push(fila);
    return filas;
  }

  function sugerirCampoImportacion_(encabezado) {
    const hOriginal = normalizar(encabezado);
    const h = hOriginal.replace(/^\d+[\.\)\-\s¿¡]+/, '').trim();
    const esNombreNegocio = /emprendimiento|empresa|fantasia|marca|negocio|proyecto|agrupacion|organizacion|institucion|red social|instagram|facebook|actividad|taller|curso/.test(h);
    if (!esNombreNegocio && /nombre completo|nombres y apellidos|nombre y apellido|nombre y apellidos|nombres y apellido|nombre del postulante|nombre del participante|nombre del emprendedor|nombre de la emprendedora|tu nombre completo|su nombre completo/.test(h)) return 'NOMBRE_COMPLETO';
    if (!esNombreNegocio && (/^nombre$|^nombres$|^tu nombre$|^su nombre$|^1 nombre$|^nombre postulante$|^nombre participante$/.test(h))) return 'NOMBRES';
    if (!esNombreNegocio && /apellido/.test(h)) return 'APELLIDOS';
    if (/tipo.*document|usted cuenta con/.test(h)) return 'TIPO_DOCUMENTO';
    if (/pasaporte|dni|numero.*document|cedula/.test(h)) return 'NUMERO_DOCUMENTO';
    if (!/empresa|emprendimiento/.test(h) && (/(^|\s|\.)(rut|run)(\s|$)/.test(h) || /^rut/.test(h))) return 'RUT';
    if (/correo|email|e-mail|mail/.test(h)) return 'CORREO';
    if (/telefono|celular|fono|whatsapp|movil|contacto/.test(h)) return 'TELEFONO';
    if (/comuna/.test(h)) return 'COMUNA';
    if (/genero|sexo/.test(h)) return 'GENERO';
    if (/fecha.*nac|nacimiento|f\.?\s*nac/.test(h)) return 'FECHA_NACIMIENTO';
    if (/nacionalidad/.test(h)) return 'NACIONALIDAD';
    if (/pmjh|jefas de hogar/.test(h)) return 'PARTICIPA_PMJH';
    if (/fecha.*inscrip|marca temporal|timestamp|fecha registro/.test(h)) return 'FECHA_INSCRIPCION';
    if (/confirm/.test(h)) return 'CONFIRMA_PARTICIPACION';
    if (/sesiones.*asist|clases.*asist/.test(h)) return 'SESIONES_ASISTIDAS';
    if (/sesiones.*total|clases.*total/.test(h)) return 'SESIONES_TOTALES';
    if (/certific/.test(h)) return 'CERTIFICADO';
    if (/observ|coment/.test(h)) return 'OBSERVACIONES';
    return '';
  }

  function renderMapeoImportacion_() {
    const sugerencias = {};
    IMPORTACION.encabezados.forEach((encabezado, indice) => {
      const campo = sugerirCampoImportacion_(encabezado);
      if (campo && sugerencias[campo] === undefined) sugerencias[campo] = indice;
    });
    if (sugerencias.NOMBRE_COMPLETO === undefined && sugerencias.NOMBRES !== undefined && sugerencias.APELLIDOS === undefined) {
      sugerencias.NOMBRE_COMPLETO = sugerencias.NOMBRES;
      delete sugerencias.NOMBRES;
    }
    IMPORTACION.mapeo = sugerencias;
    const tieneNombre = sugerencias.NOMBRE_COMPLETO !== undefined || sugerencias.NOMBRES !== undefined;
    const tieneDoc = sugerencias.RUT !== undefined || sugerencias.NUMERO_DOCUMENTO !== undefined;
    IMPORTACION.autoListo = tieneNombre && tieneDoc;

    const nombresCampos = Object.keys(sugerencias).map(c => {
      const found = CAMPOS_IMPORTACION.find(x => x[0] === c);
      return found ? found[1] : c;
    });
    const elAuto = document.getElementById('resumenMapeoAuto');
    const elManual = document.getElementById('contenedorMapeoManual');
    if (elAuto && elManual) {
      if (IMPORTACION.autoListo) {
        elAuto.hidden = false;
        elAuto.textContent = `✅ Formato reconocido automáticamente (${nombresCampos.join(', ')}).`;
        elManual.hidden = true;
      } else {
        elAuto.hidden = true;
        elManual.hidden = false;
      }
    }

    texto('importColumnasDetectadas', `${IMPORTACION.encabezados.length} columna(s) y ${IMPORTACION.filas.length} fila(s) detectadas.`);
    const opciones = '<option value="-1">No utilizar</option>' + IMPORTACION.encabezados
      .map((encabezado, indice) => `<option value="${indice}">${esc(encabezado)}</option>`).join('');
    document.getElementById('mapeoImportacion').innerHTML = CAMPOS_IMPORTACION.map(([campo, etiqueta]) => `<div class="field">
      <label>${esc(etiqueta)}</label>
      <select id="map_${campo}">${opciones}</select>
    </div>`).join('');
    CAMPOS_IMPORTACION.forEach(([campo]) => {
      const selector = document.getElementById(`map_${campo}`);
      selector.value = String(sugerencias[campo] ?? -1);
      selector.addEventListener('change', () => {
        IMPORTACION.analisis = null;
        document.getElementById('btnConfirmarImportacion').disabled = true;
      });
    });
    document.getElementById('resumenImportacion').hidden = true;
    document.getElementById('btnConfirmarImportacion').disabled = true;
    document.getElementById('tablaVistaPreviaImportacion').innerHTML = '<tr><td colspan="5" class="empty-state">Relacione las columnas y analice el listado.</td></tr>';
  }

  function construirPayloadImportacion_() {
    const mapeo = {};
    CAMPOS_IMPORTACION.forEach(([campo]) => {
      mapeo[campo] = Number(document.getElementById(`map_${campo}`)?.value ?? -1);
    });
    if (mapeo.NOMBRE_COMPLETO < 0 && mapeo.NOMBRES < 0) {
      throw new Error('Debe relacionar Nombre completo o las columnas Nombres y Apellidos.');
    }
    if (mapeo.RUT < 0 && mapeo.NUMERO_DOCUMENTO < 0) throw new Error('Debe relacionar RUT u Otro documento.');
    return {
      idActividad: document.getElementById('importActividad')?.value || '',
      encabezados: IMPORTACION.encabezados,
      filas: IMPORTACION.filas,
      mapeo,
      valoresGenerales: {
        TIPO_DOCUMENTO: document.getElementById('importTipoDocumento')?.value || 'RUT',
        SESIONES_TOTALES: document.getElementById('importSesionesTotales')?.value || '1',
        SESIONES_ASISTIDAS: document.getElementById('importSesionesAsistidas')?.value || '0',
        CONFIRMA_PARTICIPACION: document.getElementById('importConfirma')?.value || 'No informado',
        CERTIFICADO: document.getElementById('importCertificado')?.value || 'No informado',
        finalizarResultado: document.getElementById('importFinalizar')?.value || 'false'
      }
    };
  }

  function procesarLoteBaseMadreWeb(limite, continuar, acumulado) {
    const idConfig = IMPORTACION.baseMadre?.idConfig || '';
    if (!idConfig) return notificar('Vincule primero la base madre.', true);
    acumulado = acumulado || {procesadas:0, creadas:0, actualizadas:0, intereses:0};
    mostrarCarga(true, continuar
      ? `Procesando base madre… ${acumulado.procesadas} respuesta(s) completada(s)`
      : 'Procesando lote de prueba de la base madre…');
    google.script.run
      .withSuccessHandler(resultado => {
        const r = resultado.resultado || {};
        acumulado.procesadas += Number(r.resueltas || 0);
        acumulado.creadas += Number(r.personasCreadas || 0);
        acumulado.actualizadas += Number(r.personasActualizadas || 0);
        acumulado.intereses += Number(r.interesesGuardados || 0);
        texto('estadoBaseMadre', `${resultado.mensaje} Acumulado: ${acumulado.procesadas} respuestas, ${acumulado.creadas} personas creadas, ${acumulado.actualizadas} actualizadas y ${acumulado.intereses} intereses nuevos.`);
        if (continuar && Number(r.restantes || 0) > 0 && Number(r.resueltas || 0) > 0) {
          setTimeout(() => procesarLoteBaseMadreWeb(500, true, acumulado), 150);
          return;
        }
        mostrarCarga(false);
        if (continuar && Number(r.restantes || 0) > 0) {
          notificar('El proceso se detuvo porque el último lote no pudo resolver registros. Revise DETALLE_PROCESO antes de retomarlo.', true);
        } else {
          notificar(continuar
            ? `Migración completada: ${acumulado.procesadas} respuestas procesadas y ${acumulado.intereses} intereses incorporados.`
            : resultado.mensaje,
          Number(r.revision || 0) > 0);
        }
      })
      .withFailureHandler(error => { mostrarCarga(false); notificar(error.message || String(error), true); })
      .procesarLoteBaseMadreDesdeWeb({idConfig, limite:Number(limite || 100)});
  }

  /* ==========================================================================
     MÓDULO CALENDARIO DE CAPACITACIONES
     ========================================================================== */
  let CAL_FECHA_ACTUAL = new Date();
  let CAL_MODO = 'mes';
  let MAPA_CALENDARIO_EVENTOS = {};

  function cambiarModoCalendario(modo) {
    CAL_MODO = modo;
    const btnMes = document.getElementById('btnCalModoMes');
    const btnLista = document.getElementById('btnCalModoLista');
    const conMes = document.getElementById('contenedorCalendarioMes');
    const conLista = document.getElementById('contenedorCalendarioLista');

      if (btnMes) btnMes.className = 'btn compact';

    } else {
      if (btnMes) btnMes.className = 'btn secondary compact';
      if (btnLista) btnLista.className = 'btn compact';

    }
    renderCalendario();

  function cambiarMesCalendario(delta) {
    CAL_FECHA_ACTUAL = new Date(CAL_FECHA_ACTUAL.getFullYear(), CAL_FECHA_ACTUAL.getMonth() + delta, 1);
    renderCalendario();
  }

  function irAHoyCalendario() {
    CAL_FECHA_ACTUAL = new Date();
    renderCalendario();
  }

  function parsearFechaActividad(strFecha) {
    if (!strFecha) return null;
    const texto = String(strFecha).trim();
    let m = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    m = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
    const d = new Date(texto);
    return Number.isNaN(d.getTime()) ? null : d;
  }

  function formatoClaveFecha(fecha) {
    const y = fecha.getFullYear();
    const m = String(fecha.getMonth() + 1).padStart(2, '0');
    const d = String(fecha.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
  }

  function renderCalendario() {
    const anio = CAL_FECHA_ACTUAL.getFullYear();
    const mes = CAL_FECHA_ACTUAL.getMonth();
    const nombresMeses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];

    const elTitulo = document.getElementById('calTituloMes');
    if (elTitulo) elTitulo.textContent = `${nombresMeses[mes]} ${anio}`;

    const escuelaFiltro = document.getElementById('filtroCalEscuela')?.value || '';
    const estadoFiltro = document.getElementById('filtroCalEstado')?.value || '';
    const modalidadFiltro = document.getElementById('filtroCalModalidad')?.value || '';
    const q = normalizar(document.getElementById('buscarCalTexto')?.value || '');

    const todas = DB.actividades || [];
    const filtradas = todas.filter(a => {
      if (esActividadArchivada_(a) && estadoFiltro !== 'Cerrada') return false;
      if (escuelaFiltro && a.ESCUELA_LINEA !== escuelaFiltro) return false;
      if (estadoFiltro && a.ESTADO_ACTIVIDAD !== estadoFiltro) return false;
      if (modalidadFiltro && a.MODALIDAD !== modalidadFiltro) return false;
      if (q && !normalizar([a.NOMBRE_ACTIVIDAD, a.ID_ACTIVIDAD, a.AREA_TEMATICA, a.PROGRAMA, a.INSTITUCION_ASOCIADA].join(' ')).includes(q)) return false;
      return true;
    });

    // Calcular KPIs
    const hoy = new Date();
    hoy.setHours(0,0,0,0);
    const dentroDe30Dias = new Date(hoy.getTime() + 30 * 24 * 60 * 60 * 1000);

    let countProximas = 0;
    let countInscripcion = 0;
    let countEnEjecucion = 0;
    let countTotalMes = 0;

    filtradas.forEach(a => {
      const fInicio = parsearFechaActividad(a.FECHA_INICIO);
      const fTermino = parsearFechaActividad(a.FECHA_TERMINO) || fInicio;

      if (fInicio && fInicio >= hoy && fInicio <= dentroDe30Dias) countProximas++;
      if (a.ESTADO_ACTIVIDAD === 'Inscripción abierta' || a.ESTADO_ACTIVIDAD === 'Difusión') countInscripcion++;
      if (a.ESTADO_ACTIVIDAD === 'En ejecución') countEnEjecucion++;

      if (fInicio) {
        if ((fInicio.getFullYear() === anio && fInicio.getMonth() === mes) ||
            (fTermino && fTermino.getFullYear() === anio && fTermino.getMonth() === mes)) {
          countTotalMes++;
        }
      }
    });

    texto('calKpiProximas', countProximas);
    texto('calKpiInscripcion', countInscripcion);
    texto('calKpiEnEjecucion', countEnEjecucion);
    texto('calKpiTotalMes', countTotalMes);

    if (CAL_MODO === 'mes') {
      renderCalendarioMes(filtradas, anio, mes);
    } else {
      renderCalendarioLista(filtradas);
    }
  }

  function renderCalendarioMes(actividades, anio, mes) {
    const grid = document.getElementById('gridCalendarioDias');
    if (!grid) return;

    const primerDiaMes = new Date(anio, mes, 1);
    const ultimoDiaMes = new Date(anio, mes + 1, 0);
    const totalDiasMes = ultimoDiaMes.getDate();

    // 0 = Lunes, 6 = Domingo
    let primerDiaSemana = (primerDiaMes.getDay() + 6) % 7;
    const diasMesAnterior = new Date(anio, mes, 0).getDate();

    // Mapear actividades por clave YYYY-MM-DD considerando detalle de sesiones
    const mapaActividadesPorDia = {};
    actividades.forEach(a => {
      let sesiones = [];
      if (a.DETALLE_SESIONES) {
        try {
          sesiones = typeof a.DETALLE_SESIONES === 'string' ? JSON.parse(a.DETALLE_SESIONES) : a.DETALLE_SESIONES;
        } catch (e) { sesiones = []; }
      }

      if (Array.isArray(sesiones) && sesiones.length > 0) {
        sesiones.forEach(s => {
          if (s.fecha) {
            const clave = s.fecha;
            if (!mapaActividadesPorDia[clave]) mapaActividadesPorDia[clave] = [];
            mapaActividadesPorDia[clave].push({
              actividad: a,
              numeroSesion: s.numero,
              totalSesiones: sesiones.length,
              horaInicio: s.horaInicio || '',
              horaFin: s.horaFin || '',
              fecha: s.fecha
            });
          }
        });
      } else {
        const fInicio = parsearFechaActividad(a.FECHA_INICIO);
        if (fInicio) {
          const clave = formatoClaveFecha(fInicio);
          if (!mapaActividadesPorDia[clave]) mapaActividadesPorDia[clave] = [];
          mapaActividadesPorDia[clave].push({
            actividad: a,
            numeroSesion: null,
            totalSesiones: a.SESIONES_TOTALES || 1,
            horaInicio: a.HORARIO ? (a.HORARIO.match(/\b\d{1,2}:\d{2}\b/) ? a.HORARIO.match(/\b\d{1,2}:\d{2}\b/)[0] : '') : '',
            horaFin: '',
            fecha: clave
          });
        }
      }
    });

    MAPA_CALENDARIO_EVENTOS = mapaActividadesPorDia;
    const hoyClave = formatoClaveFecha(new Date());
    let html = '';

    // Días del mes anterior
    for (let i = primerDiaSemana - 1; i >= 0; i--) {
      const numDia = diasMesAnterior - i;
      const fechaObj = new Date(anio, mes - 1, numDia);
      const clave = formatoClaveFecha(fechaObj);
      const evts = mapaActividadesPorDia[clave] || [];
      html += generarCeldaDiaCalendario(numDia, clave, evts, true, clave === hoyClave);
    }

    // Días del mes actual
    for (let d = 1; d <= totalDiasMes; d++) {
      const fechaObj = new Date(anio, mes, d);
      const clave = formatoClaveFecha(fechaObj);
      const evts = mapaActividadesPorDia[clave] || [];
      html += generarCeldaDiaCalendario(d, clave, evts, false, clave === hoyClave);
    }

    // Días del mes siguiente para completar la cuadrícula (múltiplo de 7)
    const celdasGeneradas = primerDiaSemana + totalDiasMes;
    const celdasRestantes = (7 - (celdasGeneradas % 7)) % 7;
    for (let s = 1; s <= celdasRestantes; s++) {
      const fechaObj = new Date(anio, mes + 1, s);
      const clave = formatoClaveFecha(fechaObj);
      const evts = mapaActividadesPorDia[clave] || [];
      html += generarCeldaDiaCalendario(s, clave, evts, true, clave === hoyClave);
    }

    grid.innerHTML = html;
  }

  function generarCeldaDiaCalendario(numDia, claveFecha, eventos, esOtroMes, esHoy) {
    const clases = ['cal-day-cell'];
    if (esOtroMes) clases.push('cal-day-other-month');
    if (esHoy) clases.push('cal-day-today');

    // Ordenar eventos por hora de inicio
    const ordenados = [...eventos].sort((x, y) => (x.horaInicio || '99:99').localeCompare(y.horaInicio || '99:99'));

    let chipsHtml = '';
    const maxVisibles = 3;
    const visibles = ordenados.slice(0, maxVisibles);
    const extras = ordenados.length - maxVisibles;

    visibles.forEach(item => {
      const a = item.actividad || item;
      let claseEscuela = 'chip-empleo';
      if (a.ESCUELA_LINEA === 'Emprendimiento') claseEscuela = 'chip-emprendimiento';
      else if (a.ESCUELA_LINEA === 'Transversal') claseEscuela = 'chip-transversal';

      const horaBadge = item.horaInicio ? `<span class="cal-chip-time">${esc(item.horaInicio)}</span>` : '';
      const sesionBadge = item.numeroSesion ? `<span style="opacity:0.85;font-size:10px;margin-left:3px">(S${item.numeroSesion}/${item.totalSesiones})</span>` : '';

      chipsHtml += `
        <div class="cal-event-chip ${claseEscuela}" onclick="event.stopPropagation(); abrirDetalleActividadCalendario('${esc(a.ID_ACTIVIDAD)}')" title="${esc(a.NOMBRE_ACTIVIDAD)}${item.numeroSesion ? ' - Sesión ' + item.numeroSesion + '/' + item.totalSesiones : ''} (${esc(a.ESTADO_ACTIVIDAD || 'Planificada')})">
          <div style="display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">
            ${horaBadge}
            <strong style="overflow:hidden;text-overflow:ellipsis">${esc(a.NOMBRE_ACTIVIDAD)}</strong>
            ${sesionBadge}
          </div>
          <small>${esc(a.ESTADO_ACTIVIDAD || 'Planificada')} · ${esc(a.MODALIDAD || 'Presencial')}${item.horaFin ? ' · hasta ' + esc(item.horaFin) : ''}</small>
        </div>
      `;
    });

    if (extras > 0) {
      chipsHtml += `<button type="button" class="cal-more-btn" onclick="event.stopPropagation(); abrirModalDiaCalendario('${claveFecha}')" title="Ver todas las ${eventos.length} actividades de este día">+${extras} más</button>`;
    }

    const clickCelda = eventos.length > 0 ? `onclick="abrirModalDiaCalendario('${claveFecha}')"` : '';

    return `
      <div class="${clases.join(' ')}" data-fecha="${claveFecha}" ${clickCelda}>
        <div class="cal-day-header">
          <span class="cal-day-num">${numDia}</span>
        </div>
        <div class="cal-events-list">
          ${chipsHtml}
        </div>
      </div>
    `;
  }

  function renderCalendarioLista(actividades) {
    const contenedor = document.getElementById('listaCalendarioProximas');
    if (!contenedor) return;

    if (!actividades.length) {
      contenedor.innerHTML = '<div class="empty-state" style="grid-column:1/-1">No hay capacitaciones que coincidan con los filtros seleccionados.</div>';
      return;
    }

    const hoy = new Date();
    hoy.setHours(0,0,0,0);

    // Ordenar cronológicamente por fecha de inicio
    const ordenadas = [...actividades].sort((a, b) => {
      const fA = parsearFechaActividad(a.FECHA_INICIO)?.getTime() || 0;
      const fB = parsearFechaActividad(b.FECHA_INICIO)?.getTime() || 0;
      return fA - fB;
    });

    contenedor.innerHTML = ordenadas.map(a => {
      const fInicio = parsearFechaActividad(a.FECHA_INICIO);
      const fTermino = parsearFechaActividad(a.FECHA_TERMINO);

      let badgeCountdown = '';
      if (fInicio) {
        const diffDias = Math.ceil((fInicio.getTime() - hoy.getTime()) / (1000 * 60 * 60 * 24));
        if (diffDias === 0) {
          badgeCountdown = '<span class="cal-countdown-badge countdown-hoy">🔥 Inicia hoy</span>';
        } else if (diffDias > 0 && diffDias <= 7) {
          badgeCountdown = `<span class="cal-countdown-badge countdown-pronto">⏳ Inicia en ${diffDias} ${diffDias === 1 ? 'día' : 'días'}</span>`;
        } else if (diffDias > 7) {
          badgeCountdown = `<span class="cal-countdown-badge countdown-futuro">📅 Inicia en ${diffDias} días</span>`;
        } else if (fTermino && fTermino >= hoy) {
          badgeCountdown = '<span class="cal-countdown-badge countdown-curso">⚡ En curso</span>';
        } else {
          badgeCountdown = '<span class="cal-countdown-badge countdown-futuro">Concluida</span>';
        }
      } else {
        badgeCountdown = '<span class="cal-countdown-badge countdown-futuro">Por programar</span>';
      }

      let claseBorde = 'border-empleo';
      if (a.ESCUELA_LINEA === 'Emprendimiento') claseBorde = 'border-emprendimiento';
      else if (a.ESCUELA_LINEA === 'Transversal') claseBorde = 'border-transversal';

      return `
        <div class="cal-list-card ${claseBorde}">
          <div>
            <div class="cal-list-card-head">
              <h4>${esc(a.NOMBRE_ACTIVIDAD)}</h4>
              ${badgeCountdown}
            </div>
            <div class="cal-list-meta" style="margin-top:10px">
              <div class="cal-list-meta-row">
                <span>Escuela:</span>
                <strong>${esc(a.ESCUELA_LINEA || 'General')}</strong>
                ${a.AREA_TEMATICA ? `<span style="color:var(--borde)">|</span> <span>${esc(a.AREA_TEMATICA)}</span>` : ''}
              </div>
              <div class="cal-list-meta-row">
                <span>Fechas:</span>
                <strong>${esc(fechaActividadVisible(a.FECHA_INICIO) || 'Por definir')} ${a.FECHA_TERMINO ? 'al ' + esc(fechaActividadVisible(a.FECHA_TERMINO)) : ''}</strong>
              </div>
              ${a.HORARIO ? `<div class="cal-list-meta-row"><span>Horario:</span> <strong>${esc(a.HORARIO)}</strong></div>` : ''}
              <div class="cal-list-meta-row">
                <span>Modalidad:</span>
                <strong>${esc(a.MODALIDAD || 'Presencial')}</strong>
                <span style="color:var(--borde)">|</span>
                <span>Estado:</span>
                <span class="badge ${a.ESTADO_ACTIVIDAD === 'En ejecución' ? 'success' : (a.ESTADO_ACTIVIDAD === 'Inscripción abierta' ? 'info' : 'neutral')}">${esc(a.ESTADO_ACTIVIDAD || 'Planificada')}</span>
              </div>
              ${a.CUPOS ? `<div class="cal-list-meta-row"><span>Cupos:</span> <strong>${esc(a.CUPOS)}</strong></div>` : ''}
            </div>
          </div>
          <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;">
            <button class="btn secondary compact" type="button" onclick="abrirEnGoogleCalendarActividad('${esc(a.ID_ACTIVIDAD)}')" style="border-color:#0284c7;color:#0369a1;background:#f0f9ff;display:inline-flex;align-items:center;">📅 Google Calendar ↗</button>
            <button class="btn secondary compact" type="button" onclick="abrirDetalleActividadCalendario('${esc(a.ID_ACTIVIDAD)}')">Ver detalle</button>
            <button class="btn compact" type="button" onclick="irAGestionDesdeCalendario('${esc(a.ID_ACTIVIDAD)}')">Participantes</button>
          </div>
        </div>
      `;
    }).join('');
  }

  /* =========================================================================
   * INTEGRACIÓN CON GOOGLE CALENDAR Y PENALIZACIÓN POR INASISTENCIA CONFIRMADA
   * ========================================================================= */
  function compararParticipantesConPenalizacion_(a, b) {
    const penA = Number(a.CANTIDAD_INASISTENCIAS_CONFIRMADAS || 0);
    const penB = Number(b.CANTIDAD_INASISTENCIAS_CONFIRMADAS || 0);
    if ((penA > 0) !== (penB > 0)) {
      return penA > 0 ? 1 : -1;
    }
    if (penA !== penB) {
      return penA - penB;
    }
    return String(a.NOMBRE_COMPLETO || '').localeCompare(String(b.NOMBRE_COMPLETO || ''), 'es', { sensitivity: 'base' });
  }

  function enriquecerPenalizacionesParticipantesLocal_(listaParticipantes, idActividadActual) {
    if (!Array.isArray(listaParticipantes) || !listaParticipantes.length) return;
    const idActActualStr = String(idActividadActual || '').trim();
    const hoyStr = new Date().toISOString().slice(0, 10);

    listaParticipantes.forEach(p => {
      if (p.CANTIDAD_INASISTENCIAS_CONFIRMADAS !== undefined) return;
      const idPer = String(p.ID_PERSONA || '').trim();
      if (!idPer || typeof SIGC_INDEX === 'undefined' || !SIGC_INDEX.participacionesPorPersona) {
        p.CANTIDAD_INASISTENCIAS_CONFIRMADAS = 0;
        p.PENALIZADO_INASISTENCIA = false;
        p.DETALLE_INASISTENCIAS_CONFIRMADAS = '';
        p.PENALIZACION_RECTIFICADA = false;
        p.DETALLE_RECTIFICACION = '';
        return;
      }
      const hist = SIGC_INDEX.participacionesPorPersona.get(idPer) || [];
      const eventos = [];
      hist.forEach((otra, idxOrden) => {
        const idActOtra = String(otra.ID_ACTIVIDAD || '').trim();
        if (!idActOtra || idActOtra === idActActualStr) return;
        if (normalizar(otra.REGISTRO_ACTIVO || 'sí') === 'no') return;

        const actObj = (SIGC_INDEX.actividadesPorId && SIGC_INDEX.actividadesPorId.get(idActOtra)) || {};
        const estAct = normalizar(actObj.ESTADO_ACTIVIDAD || '');
        const fIni = String(actObj.FECHA_INICIO || actObj.FECHA_TERMINO || otra.FECHA_INSCRIPCION || '').slice(0, 10);
        const fRef = String(actObj.FECHA_TERMINO || actObj.FECHA_INICIO || '').slice(0, 10);
        const resFin = normalizar(otra.RESULTADO_FINAL || '');
        const resAsis = normalizar(otra.RESULTADO_ASISTENCIA || '');
        const conf = normalizar(otra.CONFIRMA_PARTICIPACION || '');
        const confirmoSi = conf === 'si' || conf === 'sí' || conf.includes('confirm');
        const asistidas = Number(otra.SESIONES_ASISTIDAS || 0);
        const totales = Number(otra.SESIONES_TOTALES || actObj.SESIONES_TOTALES || 1);

        const yaOcurrio = estAct === 'ejecutada' || estAct === 'cerrada' ||
          resFin === 'no participo' || resFin === 'desaprobado' ||
          (fRef && fRef < hoyStr);

        const esFalta = confirmoSi && asistidas === 0 && yaOcurrio;
        const esRectificacion =
          resFin === 'aprobado' ||
          resFin === 'participo' ||
          resAsis === 'cumple' ||
          (asistidas > 0 && resFin !== 'desaprobado' && resFin !== 'no participo' && ((asistidas / Math.max(1, totales)) >= 0.75 || totales <= 1));

        if (!esFalta && !esRectificacion) return;

        const etq = actObj.NOMBRE_ACTIVIDAD ? (idActOtra + ' (' + actObj.NOMBRE_ACTIVIDAD + ')') : idActOtra;
        const numId = Number(idActOtra.replace(/\D/g, '')) || 0;
        eventos.push({
          etiqueta: etq,
          tipo: esRectificacion ? 'RECTIFICACION' : 'FALTA',
          fechaOrden: fIni || '0000-00-00',
          numId: numId,
          idxOrden: idxOrden
        });
      });

      eventos.sort((a, b) => {
        if (a.fechaOrden !== b.fechaOrden) return a.fechaOrden.localeCompare(b.fechaOrden);
        if (a.numId !== b.numId) return a.numId - b.numId;
        if (a.tipo !== b.tipo) return a.tipo === 'FALTA' ? -1 : 1;
        return a.idxOrden - b.idxOrden;
      });

      let faltasActivas = [];
      let todasLasFaltasPrevias = [];
      let ultimaRectificacion = '';

      eventos.forEach(ev => {
        if (ev.tipo === 'FALTA') {
          if (!faltasActivas.includes(ev.etiqueta)) faltasActivas.push(ev.etiqueta);
          if (!todasLasFaltasPrevias.includes(ev.etiqueta)) todasLasFaltasPrevias.push(ev.etiqueta);
        } else if (ev.tipo === 'RECTIFICACION') {
          if (faltasActivas.length > 0) {
            faltasActivas = [];
            ultimaRectificacion = ev.etiqueta;
          }
        }
      });

      p.CANTIDAD_INASISTENCIAS_CONFIRMADAS = faltasActivas.length;
      p.PENALIZADO_INASISTENCIA = faltasActivas.length > 0;
      p.DETALLE_INASISTENCIAS_CONFIRMADAS = faltasActivas.join(' · ');
      p.PENALIZACION_RECTIFICADA = faltasActivas.length === 0 && Boolean(ultimaRectificacion) && todasLasFaltasPrevias.length > 0;
      p.DETALLE_RECTIFICACION = p.PENALIZACION_RECTIFICADA
        ? `Rectificó asistiendo regularmente en ${ultimaRectificacion} (falta previa subsanada: ${todasLasFaltasPrevias.join(' · ')})`
        : '';
    });
  }

  function formatearFechaHoraGCal_(fechaStr, horaStr, horaDefecto) {
    const fLimpia = fechaInput(fechaStr);
    if (!fLimpia) return '';
    const ymd = fLimpia.replace(/-/g, '');
    const h = String(horaStr || horaDefecto || '').trim();
    const m = h.match(/^(\d{1,2}):(\d{2})/);
    if (m) {
      return ymd + 'T' + String(m[1]).padStart(2, '0') + String(m[2]).padStart(2, '0') + '00';
    }
    return ymd;
  }

  function obtenerSesionesActividadGCal_(act) {
    if (!act) return [];
    let sesiones = [];
    if (act.DETALLE_SESIONES) {
      try {
        sesiones = typeof act.DETALLE_SESIONES === 'string' ? JSON.parse(act.DETALLE_SESIONES) : act.DETALLE_SESIONES;
      } catch (e) { sesiones = []; }
    }
    if (Array.isArray(sesiones) && sesiones.length > 0) {
      return sesiones.filter(Boolean).map((s, idx) => ({
        numero: s.numero || (idx + 1),
        fecha: fechaInput(s.fecha || s.FECHA),
        horaInicio: s.horaInicio || s.HORA_INICIO || '',
        horaFin: s.horaFin || s.HORA_FIN || ''
      })).filter(s => Boolean(s.fecha));
    }

    const fIni = fechaInput(act.FECHA_INICIO);
    const fFin = fechaInput(act.FECHA_TERMINO);
    const matchHoras = String(act.HORARIO || '').match(/(\d{1,2}:\d{2}).*?(\d{1,2}:\d{2})/);
    const hIni = matchHoras ? matchHoras[1] : '10:00';
    const hFin = matchHoras ? matchHoras[2] : '12:00';

    if (fIni) {
      const lista = [{
        numero: 1,
        fecha: fIni,
        horaInicio: hIni,
        horaFin: hFin
      }];
      if (fFin && fFin !== fIni) {
        lista.push({
          numero: 2,
          fecha: fFin,
          horaInicio: hIni,
          horaFin: hFin
        });
      }
      return lista;
    }

    return [];
  }

  function calcularRRuleGoogleCalendar_(sesiones) {
    if (!Array.isArray(sesiones) || sesiones.length <= 1) return '';
    try {
      const diasMap = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
      const byDaySet = new Set();
      sesiones.forEach(s => {
        if (s && s.fecha) {
          const d = new Date(s.fecha + 'T12:00:00');
          if (!isNaN(d.getTime())) {
            byDaySet.add(diasMap[d.getDay()]);
          }
        }
      });

      const ultimaSesion = sesiones[sesiones.length - 1];
      const fUlt = ultimaSesion && ultimaSesion.fecha ? String(ultimaSesion.fecha).replace(/-/g, '') : '';
      const untilDate = fUlt ? (fUlt + 'T235959Z') : '';
      const byDayStr = Array.from(byDaySet).join(',');

      if (byDayStr && untilDate) {
        return `RRULE:FREQ=WEEKLY;BYDAY=${byDayStr};UNTIL=${untilDate}`;
      } else if (untilDate) {
        return `RRULE:FREQ=WEEKLY;UNTIL=${untilDate}`;
      }
      return `RRULE:COUNT=${sesiones.length}`;
    } catch (e) {
      return '';
    }
  }

  function construirUrlGoogleCalendar_(act, sesionEspecifica) {
    if (!act) return '';
    const sesiones = obtenerSesionesActividadGCal_(act);
    const sesion = sesionEspecifica || (sesiones.length > 0 ? sesiones[0] : null);
    let datesParam = '';

    if (sesion && sesion.fecha) {
      const matchHoras = String(act.HORARIO || '').match(/(\d{1,2}:\d{2}).*?(\d{1,2}:\d{2})/);
      const hDefIni = matchHoras ? matchHoras[1] : '10:00';
      const hDefFin = matchHoras ? matchHoras[2] : '12:00';
      const ini = formatearFechaHoraGCal_(sesion.fecha, sesion.horaInicio || hDefIni, '10:00');
      const fin = formatearFechaHoraGCal_(sesion.fecha, sesion.horaFin || hDefFin, '12:00');
      if (ini && fin) datesParam = ini + '/' + fin;
    }

    if (!datesParam && act.FECHA_INICIO) {
      // Extraer horas desde act.HORARIO si existen (ej: "10:00 a 12:00")
      const matchHoras = String(act.HORARIO || '').match(/(\d{1,2}:\d{2}).*?(\d{1,2}:\d{2})/);
      const hIni = matchHoras ? matchHoras[1] : '10:00';
      const hFin = matchHoras ? matchHoras[2] : '12:00';
      const ini = formatearFechaHoraGCal_(act.FECHA_INICIO, hIni, '10:00');
      const fin = formatearFechaHoraGCal_(act.FECHA_TERMINO || act.FECHA_INICIO, hFin, '12:00');
      if (ini && fin) datesParam = ini + '/' + fin;
    }

    const sufijoSesion = sesionEspecifica
      ? ` (Sesión ${sesionEspecifica.numero || 1})`
      : (sesiones.length > 1 ? ` (${sesiones.length} sesiones)` : '');
    const titulo = `[${act.ID_ACTIVIDAD || 'CAP'}] ${act.NOMBRE_ACTIVIDAD || 'Capacitación'}${sufijoSesion}`;
    const ubicacion = [act.MODALIDAD || 'Presencial', act.INSTITUCION_ASOCIADA].filter(Boolean).join(' · ');

    let resumenSesiones = '';
    if (sesiones.length > 0) {
      resumenSesiones = '\n🗓️ Cronograma de sesiones:\n' + sesiones.map(s =>
        `  • Sesión ${s.numero}: ${fechaActividadVisible(s.fecha)} (${s.horaInicio || '10:00'} a ${s.horaFin || '12:00'})`
      ).join('\n');
    }

    const detalles = [
      `📌 Código Actividad: ${act.ID_ACTIVIDAD || 'En asignación'}`,
      `🏫 Escuela / Línea: ${act.ESCUELA_LINEA || 'General'}${act.AREA_TEMATICA ? ' — ' + act.AREA_TEMATICA : ''}`,
      `👤 Responsable / Relator: ${act.RESPONSABLE || 'Equipo Capacitación DIDEL'}`,
      `👥 Cupos: ${act.CUPOS || 'Sin límite'}`,
      `⏰ Horario: ${act.HORARIO || 'Según programación'}`,
      act.LINK_INSCRIPCION ? `🔗 Enlace: ${act.LINK_INSCRIPCION}` : '',
      resumenSesiones,
      act.OBSERVACIONES ? `\n📝 Observaciones: ${act.OBSERVACIONES}` : '',
      '\nMunicipalidad de Santiago · Subdirección de Desarrollo Económico Local (DIDEL)'
    ].filter(Boolean).join('\n');

    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: titulo,
      details: detalles,
      location: ubicacion,
      ctz: 'America/Santiago'
    });
    if (datesParam) params.set('dates', datesParam);

    if (!sesionEspecifica && sesiones.length > 1) {
      const rrule = calcularRRuleGoogleCalendar_(sesiones);
      if (rrule) params.set('recur', rrule);
    }

    return 'https://calendar.google.com/calendar/render?' + params.toString();
  }

  function abrirEnGoogleCalendarObjetoActividad_(act, sesionOpcional) {
    if (!act) return notificar('No se encontró la actividad seleccionada.', true);
    const sesiones = obtenerSesionesActividadGCal_(act);
    if (!sesionOpcional && sesiones.length > 1) {
      abrirModalAgendarSesionesMultiplesGCal(act, sesiones);
      return;
    }

    const url = construirUrlGoogleCalendar_(act, sesionOpcional);
    if (!url) {
      return notificar('No fue posible generar el enlace de Google Calendar.', true);
    }
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => document.body.removeChild(a), 300);
  }

  function exportarCalendarioGoogleIcs(marcarAgendadas) {

    if (!actividades.length) {
      return notificar('No hay actividades vigentes para exportar a Google Calendar.', true);
    }
    if (marcarAgendadas) {

  function generarYDescargarIcsActividades_(actividades, nombreArchivo) {
    function escIcs(str) {
      const bs = String.fromCharCode(92);
      return String(str || '')
        .split(bs).join(bs + bs)
        .split(';').join(bs + ';')
        .split(',').join(bs + ',')
        .replace(/\r?\n/g, bs + 'n');
    }

    const stamp = new Date().toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    const lineas = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-/' + '/Municipalidad de Santiago DIDEL/' + '/SIGC Capacitaciones/' + '/ES',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'X-WR-CALNAME:Capacitaciones DIDEL - Municipalidad de Santiago',
      'X-WR-TIMEZONE:America/Santiago'
    ];

    let totalEventos = 0;

    actividades.forEach(act => {
      const sesiones = obtenerSesionesActividadGCal_(act);

      const ubicacion = [act.MODALIDAD || 'Presencial', act.INSTITUCION_ASOCIADA].filter(Boolean).join(' · ');
      const descBase = [
        'Código: ' + (act.ID_ACTIVIDAD || ''),
        'Escuela: ' + (act.ESCUELA_LINEA || 'General') + (act.AREA_TEMATICA ? ' - ' + act.AREA_TEMATICA : ''),
        'Responsable: ' + (act.RESPONSABLE || 'DIDEL'),
        'Cupos: ' + (act.CUPOS || 'Sin límite'),
        'Horario: ' + (act.HORARIO || 'Según programación'),
        act.OBSERVACIONES ? ('Obs: ' + act.OBSERVACIONES) : ''
      ].filter(Boolean).join('\n');

      if (Array.isArray(sesiones) && sesiones.length > 0) {
        sesiones.forEach(s => {
          if (!s || !s.fecha) return;
          const dtStart = formatearFechaHoraGCal_(s.fecha, s.horaInicio || '10:00', '10:00');
          const dtEnd = formatearFechaHoraGCal_(s.fecha, s.horaFin || '12:00', '12:00');
          if (!dtStart || !dtEnd) return;
          const uid = 'SIGC-' + act.ID_ACTIVIDAD + '-S' + (s.numero || 1) + '@munistgo.cl';
          const summary = '[' + act.ID_ACTIVIDAD + '] ' + act.NOMBRE_ACTIVIDAD + ' (Sesión ' + (s.numero || 1) + '/' + sesiones.length + ')';
          lineas.push(
            'BEGIN:VEVENT',
            'UID:' + uid,
            'DTSTAMP:' + stamp,
            'DTSTART;TZID=America/Santiago:' + dtStart,
            'DTEND;TZID=America/Santiago:' + dtEnd,
            'SUMMARY:' + escIcs(summary),
            'DESCRIPTION:' + escIcs(descBase),
            'LOCATION:' + escIcs(ubicacion),
            'END:VEVENT'
          );
          totalEventos++;
        });
      } else if (act.FECHA_INICIO) {
        const matchHoras = String(act.HORARIO || '').match(/(\d{1,2}:\d{2}).*?(\d{1,2}:\d{2})/);
        const hIni = matchHoras ? matchHoras[1] : '10:00';
        const hFin = matchHoras ? matchHoras[2] : '12:00';
        const dtStart = formatearFechaHoraGCal_(act.FECHA_INICIO, hIni, '10:00');
        const dtEnd = formatearFechaHoraGCal_(act.FECHA_TERMINO || act.FECHA_INICIO, hFin, '12:00');
        if (!dtStart || !dtEnd) return;
        const uid = 'SIGC-' + act.ID_ACTIVIDAD + '-GENERAL@munistgo.cl';
        const summary = '[' + act.ID_ACTIVIDAD + '] ' + act.NOMBRE_ACTIVIDAD;
        lineas.push(
          'BEGIN:VEVENT',
          'UID:' + uid,
          'DTSTAMP:' + stamp,
          'DTSTART;TZID=America/Santiago:' + dtStart,
          'DTEND;TZID=America/Santiago:' + dtEnd,
          'SUMMARY:' + escIcs(summary),
          'DESCRIPTION:' + escIcs(descBase),
          'LOCATION:' + escIcs(ubicacion),
          'END:VEVENT'
        );
        totalEventos++;
      }
    });

    lineas.push('END:VCALENDAR');

    if (totalEventos === 0) {
      return notificar('Las actividades seleccionadas aún no tienen fechas de inicio configuradas.', true);
    }

    const blob = new Blob([lineas.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = nombreArchivo || 'Calendario_Capacitaciones_DIDEL.ics';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
    notificar('Se descargó el calendario (.ics) con ' + totalEventos + ' sesión(es) listo para importar en Google Calendar.');
  }

    const idStr = String(idActividad || '').trim();

    const nuevoEstado = estadoForzado !== undefined ? Boolean(estadoForzado) : true;
    const marca = JSON.stringify(['AGENDADO-' + new Date().toISOString().slice(0, 16).replace('T', ' ')]);

    if (act) {
      act.GOOGLE_CALENDAR_IDS = nuevoEstado ? marca : '';

      if (typeof sigcReconstruirIndices === 'function') sigcReconstruirIndices('actividades');

        .withSuccessHandler(r => {
          if (r && r.ok && estadoForzado !== undefined) {
            notificar(r.mensaje);
          }
        })
        .withFailureHandler(() => {})
        .marcarActividadCalendarizadaWeb(idStr, nuevoEstado);

  function formatearNombreCapacitacion(texto) {
    if (!texto) return '';
    let str = String(texto).replace(/[\r\n]+/g, ' ').trim();
    str = str.replace(/^CAP-\d{4}-\d+\s*[—–-]\s*/i, '').replace(/^ACT-\d+\s*[—–-]\s*/i, '').trim();
    str = str.replace(/\s*[—–-]\s*\d{1,2}[-/]\d{1,2}[-/]\d{2,4}$/, '').trim();

    const letras = str.replace(/[^a-zA-ZáéíóúÁÉÍÓÚñÑ]/g, '');
    const mayusculas = str.replace(/[^A-ZÁÉÍÓÚÑ]/g, '');
    const esTodoMayus = letras.length > 3 && (mayusculas.length / letras.length) > 0.7;

    const siglas = ['DUOC', 'UDLA', 'IA', 'MIPE', 'PMJH', 'CANVA', 'TI', 'SGC', 'SIGC', 'RRHH', 'SII', 'RUT', 'DIDECO', 'DIDEL', 'Power BI', 'Excel'];

    if (esTodoMayus) {
      const minusculas = ['de', 'del', 'la', 'las', 'los', 'y', 'e', 'en', 'para', 'con', 'por', 'a', 'al', 'o', 'u'];
      const palabras = str.toLowerCase().split(' ');
      str = palabras.map(function(p, i) {
        if (!p) return '';
        const pUpper = p.toUpperCase();
        const matchSigla = siglas.find(function(s) { return s.toUpperCase() === pUpper; });
        if (matchSigla) return matchSigla;
        if (i > 0 && minusculas.indexOf(p) >= 0) return p;
        return p.charAt(0).toUpperCase() + p.slice(1);
      }).join(' ');
    } else {
      siglas.forEach(function(s) {
        const reg = new RegExp('\\b' + s + '\\b', 'gi');
        str = str.replace(reg, s);
      });
      if (str.length > 0) {
        str = str.charAt(0).toUpperCase() + str.slice(1);
      }
    }
    return str;
  }

  let _intervaloAutoSyncSat = null;

  function iniciarAutoSincronizacionSatisfaccion_(idActividad) {
    detenerAutoSincronizacionSatisfaccion_();
    if (!idActividad) return;
    // Auto-actualización periódica en segundo plano cada 30 segundos mientras el modal esté visible
    _intervaloAutoSyncSat = setInterval(function() {
      const modal = document.getElementById('modalEvaluacionSatisfaccion');
      if (modal && modal.style.display !== 'none' && SATISFACCION_ACTUAL && SATISFACCION_ACTUAL.idActividad === idActividad) {
        cargarDatosSatisfaccionActividad_(idActividad, true, true);
      } else {
        detenerAutoSincronizacionSatisfaccion_();
      }
    }, 30000);
  }

  function detenerAutoSincronizacionSatisfaccion_() {
    if (_intervaloAutoSyncSat) {
      clearInterval(_intervaloAutoSyncSat);
      _intervaloAutoSyncSat = null;
    }
  }

  function cargarDatosSatisfaccionActividad_(idActividad, forzarSync, silencioso) {
    if (!idActividad) return;
    if (forzarSync && !silencioso) {
      mostrarCarga(true, 'Sincronizando respuestas digitales y calculando consolidado…');
    }
    google.script.run
      .withSuccessHandler(res => {
        if (!silencioso) mostrarCarga(false);
        if (!res || !res.ok) return;
        SATISFACCION_ACTUAL = {
          idActividad: res.idActividad,
          nombreActividad: res.nombreActividad,
          resumen: res.resumen || {},
          formulario: res.formulario || SATISFACCION_ACTUAL.formulario
        };
        if (GESTION && String(GESTION.actividad?.ID_ACTIVIDAD) === String(res.idActividad)) {
          GESTION.satisfaccion = res.resumen;
          actualizarKpisGestion();
        }
        renderPanelSatisfaccion_();
        if (SATISFACCION_ACTUAL.formulario) {
          mostrarInfoFormularioSatisfaccion_(SATISFACCION_ACTUAL.formulario);
        }
        actualizarVistaPreviaEncuestaFisica();
        if (forzarSync && !silencioso) {
          notificar(res.sincronizadas > 0
            ? ('Se sincronizaron ' + res.sincronizadas + ' nueva(s) encuesta(s) digital(es).')
            : 'Consolidado de satisfacción actualizado.');
        } else if (res.sincronizadas > 0) {
          notificar('Se consolidaron automáticamente ' + res.sincronizadas + ' nueva(s) encuesta(s).');
        }
      })
      .withFailureHandler(err => {
        if (!silencioso) {
          mostrarCarga(false);
          notificar(err.message || String(err), true);
        }
      })
      .obtenerEvaluacionesActividadWeb(idActividad, Boolean(forzarSync));

  function guardarEvaluacionPapelUI() {
    const act = obtenerActividadSatisfaccionActual_();
    if (!act || !act.ID_ACTIVIDAD) {
      notificar('Seleccione una actividad primero.', true);
      return;
    }
    const modo = document.getElementById('satModoDigitacion')?.value || 'INDIVIDUAL';
    const cantidad = modo === 'LOTE' ? Number(document.getElementById('satInputCantidadLote')?.value || 1) : 1;
    const nRel = parseFloat(document.getElementById('satInputNotaRelator')?.value || '0');
    const nCon = parseFloat(document.getElementById('satInputNotaContenidos')?.value || '0');
    const nOrg = parseFloat(document.getElementById('satInputNotaOrganizacion')?.value || '0');
    const nGlo = parseFloat(document.getElementById('satInputNotaGlobal')?.value || '0');

    if ([nRel, nCon, nOrg, nGlo].some(n => isNaN(n) || n < 1 || n > 5)) {
      notificar('Todas las calificaciones deben estar entre 1.0 y 5.0.', true);
      return;
    }

    const payload = {
      idActividad: act.ID_ACTIVIDAD,
      modo: modo,
      cantidadRespuestas: cantidad,
      notaRelator: nRel,
      notaContenidos: nCon,
      notaOrganizacion: nOrg,
      notaGlobal: nGlo,
      recomienda: document.getElementById('satInputRecomienda')?.value || 'Sí',
      loMasValioso: document.getElementById('satInputValioso')?.value || '',
      sugerencias: document.getElementById('satInputSugerencias')?.value || ''
    };

    const btn = document.getElementById('btnGuardarEvaluacionPapel');
    if (btn) btn.disabled = true;
    mostrarCarga(true, 'Guardando y consolidando encuesta(s) física(s)…');

    google.script.run
      .withSuccessHandler(res => {
        mostrarCarga(false);
        if (btn) btn.disabled = false;
        notificar(res.mensaje || 'Encuesta consolidada exitosamente.');
        SATISFACCION_ACTUAL.resumen = res.resumen || {};
        if (GESTION && String(GESTION.actividad?.ID_ACTIVIDAD) === String(act.ID_ACTIVIDAD)) {
          GESTION.satisfaccion = res.resumen;
          actualizarKpisGestion();
        }
        renderPanelSatisfaccion_();
        limpiarFormularioDigitacionSatisfaccion();
        if (modo === 'LOTE') {
          cambiarTabSatisfaccion('consolidado');
        }
      })
      .withFailureHandler(err => {
        mostrarCarga(false);
        if (btn) btn.disabled = false;
        notificar(err.message || String(err), true);
      })
      .guardarEvaluacionSatisfaccionWeb(payload);
  }

  function eliminarRegistroEvaluacionUI(idEvaluacion) {
    const act = obtenerActividadSatisfaccionActual_();
    if (!idEvaluacion || !act || !act.ID_ACTIVIDAD) return;
    if (!confirm('¿Está seguro de eliminar este registro de evaluación del consolidado?')) return;

    mostrarCarga(true, 'Eliminando registro de evaluación…');
    google.script.run
      .withSuccessHandler(res => {
        mostrarCarga(false);
        notificar(res.mensaje || 'Registro eliminado.');
        SATISFACCION_ACTUAL.resumen = res.resumen || {};
        if (GESTION && String(GESTION.actividad?.ID_ACTIVIDAD) === String(act.ID_ACTIVIDAD)) {
          GESTION.satisfaccion = res.resumen;
          actualizarKpisGestion();
        }
        renderPanelSatisfaccion_();
      })
      .withFailureHandler(err => {
        mostrarCarga(false);
        notificar(err.message || String(err), true);
      })
      .eliminarEvaluacionSatisfaccionWeb(idEvaluacion, act.ID_ACTIVIDAD);
  }

  function generarFormularioSatisfaccionUI(silencioso) {
    const act = obtenerActividadSatisfaccionActual_();
    if (!act || !act.ID_ACTIVIDAD) {
      if (!silencioso) notificar('Seleccione una actividad primero.', true);
      return;

        if (btn) btn.disabled = false;
        SATISFACCION_ACTUAL.formulario = res;
        mostrarInfoFormularioSatisfaccion_(res);

        if (!silencioso) {

        if (!silencioso) mostrarCarga(false);
        if (btn) btn.disabled = false;
        if (!silencioso) notificar(err.message || String(err), true);

  function copiarEnlaceSatisfaccionUI() {
    const input = document.getElementById('inputUrlPrellenadaSat');
    const url = input?.value || '';
    if (!url) return notificar('Primero presione "Obtener / Activar Enlace Digital y QR".', true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(() => notificar('Enlace de encuesta copiado al portapapeles.'));
    } else {
      input.select();
      document.execCommand('copy');
      notificar('Enlace de encuesta copiado al portapapeles.');
    }
  }

  function normalizarClaveRutImport_(val) {
    return String(val || '').toUpperCase().replace(/[^0-9K]/g, '').replace(/^0+/, '');
  }

  function esValorPresenteAsistencia_(val) {
    const s = normalizar(String(val || '').trim());
    if (!s) return false;
    if (['1', 'x', 'si', 's', 'p', 'presente', 'asistio', 'asiste', 'true', 'ok', 'yes'].includes(s)) return true;
    if (['✓', '✔', '☑'].includes(String(val || '').trim())) return true;
    const num = Number(s);
    return !isNaN(num) && num > 0;
  }

  function descargarWorkbookExcel_(hojas, nombreArchivoBase) {
    if (typeof XLSX !== 'undefined' && XLSX && XLSX.utils) {
      const wb = XLSX.utils.book_new();
      hojas.forEach(h => {
        const ws = XLSX.utils.aoa_to_sheet(h.filas);
        if (h.anchos) {
          ws['!cols'] = h.anchos.map(w => ({ wch: w }));
        }
        XLSX.utils.book_append_sheet(wb, ws, String(h.nombre || 'Datos').slice(0, 31));
      });
      XLSX.writeFile(wb, `${nombreArchivoBase}.xlsx`);
      return;
    }
    // Respaldo CSV UTF-8 con BOM si SheetJS no estuviera disponible
    const primera = hojas[0]?.filas || [];
    const csv = '\uFEFF' + primera.map(fila =>
      fila.map(c => `"${String(c ?? '').replace(/"/g, '""')}"`).join(';')
    ).join('\r\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${nombreArchivoBase}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function leerArchivoTabular_(archivo, callback) {
    if (!archivo) return;
    const nombre = String(archivo.name || '').toLowerCase();
    if (/\.(xlsx|xls)$/i.test(nombre)) {
      if (typeof XLSX === 'undefined' || !XLSX) {
        return notificar('La librería de Excel aún está cargando. Espere un segundo e intente nuevamente, o pegue los datos directamente.', true);
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const wb = XLSX.read(data, { type: 'array' });
          const primeraHoja = wb.SheetNames[0];
          if (!primeraHoja) return callback([]);
          const ws = wb.Sheets[primeraHoja];
          const matriz = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
          callback(matriz.filter(f => Array.isArray(f) && f.some(c => String(c || '').trim() !== '')));
        } catch (err) {
          notificar('No se pudo leer el archivo Excel: ' + err.message, true);
        }
      };
      reader.readAsArrayBuffer(archivo);
    } else {
      const reader = new FileReader();
      reader.onload = function(e) {
        const matriz = parsearTablaPegada_(e.target.result || '');
        callback(matriz);
      };
      reader.readAsText(archivo, 'UTF-8');
    }
  }

  function detectarFilaEncabezadoAsistencia_(matriz) {
    for (let i = 0; i < Math.min(matriz.length, 10); i++) {
      const filaNorm = (matriz[i] || []).map(c => normalizar(String(c || '')));
      const tieneClave = filaNorm.some(h =>
        /^(rut|run|documento|correo|email|e-mail|mail|nombre|name|participante|s1|sesion\s*1)/.test(h) ||
        h.includes('nombre original') || h.includes('user email') || h.includes('correo electronico')
      );
      if (tieneClave) return i;
    }
    return -1;
  }

  function reprocesarAsistenciaImportada() {
    const previewCont = document.getElementById('asisContenedorPreview');
    const btnAplicar = document.getElementById('btnAplicarImportacionAsistencia');
    if (!ASIS_IMP_MATRIZ || !ASIS_IMP_MATRIZ.length) {
      previewCont.style.display = 'none';
      btnAplicar.disabled = true;
      ASIS_IMP_RESULTADO = null;
      return;
    }

    const act = GESTION?.actividad || {};
    const totSesiones = Math.max(1, Number(act.SESIONES_TOTALES || 1));
    const modoDestino = document.getElementById('asisSesionDestino').value;
    const minMinutos = Math.max(0, Number(document.getElementById('asisMinutosMinimos').value || 0));

    let idxHeader = detectarFilaEncabezadoAsistencia_(ASIS_IMP_MATRIZ);
    let encabezados = [];
    let filasDatos = [];

    if (idxHeader >= 0) {
      encabezados = ASIS_IMP_MATRIZ[idxHeader].map(v => String(v || '').trim());
      filasDatos = ASIS_IMP_MATRIZ.slice(idxHeader + 1);
    } else {
      // Lista sin encabezados (ej. solo RUTs o correos pegados directo)
      const ancho = Math.max(...ASIS_IMP_MATRIZ.map(f => f.length));
      encabezados = Array.from({ length: ancho }, (_, idx) => {
        const muestra = String(ASIS_IMP_MATRIZ[0]?.[idx] || '').trim();
        if (muestra.includes('@')) return 'CORREO';
        if (/^\d{1,2}\.?\d{3}\.?\d{3}-?[0-9kK]$/.test(muestra) || /^\d{7,8}[0-9kK]$/.test(muestra)) return 'RUT';
        if (idx === 0) return 'DATO';
        return 'COL_' + (idx + 1);
      });
      filasDatos = ASIS_IMP_MATRIZ;
    }

    let colRut = -1, colCorreo = -1, colNombre = -1, colMinutos = -1, colAsist = -1;
    const colsSesiones = {};

    encabezados.forEach((enc, idx) => {
      const h = normalizar(enc);
      const mSes = h.match(/^(?:s|sesion)\s*0*(\d+)$/);
      if (mSes) {
        const num = Number(mSes[1]);
        if (num >= 1 && num <= totSesiones) colsSesiones[num] = idx;
        return;
      }
      if (colRut < 0 && (/^(rut|run|documento|numero documento|nro documento|dni|cedula)$/.test(h) || h.includes('rut'))) {
        colRut = idx;
      } else if (colCorreo < 0 && (h.includes('correo') || h.includes('email') || h.includes('e-mail') || h.includes('mail'))) {
        colCorreo = idx;
      } else if (colNombre < 0 && (h.includes('nombre') || h.includes('name') || h.includes('participante') || h.includes('asistente')) && !/curso|actividad|taller|empresa/.test(h)) {
        colNombre = idx;
      } else if (colMinutos < 0 && (h.includes('duracion') || h.includes('duration') || h.includes('minutos') || h.includes('minutes'))) {
        colMinutos = idx;
      } else if (colAsist < 0 && /^(asistencia|presente|estado)$/.test(h)) {
        colAsist = idx;
      }
    });

    document.getElementById('asisContenedorMinutos').style.display = colMinutos >= 0 ? 'block' : 'none';
    const tieneColsSesiones = Object.keys(colsSesiones).length > 0;

    // Indexar nómina actual de GESTION.participaciones
    const porRut = new Map();
    const porCorreo = new Map();
    const porNombre = new Map();
    (GESTION.participaciones || []).forEach(p => {
      const r1 = normalizarClaveRutImport_(p.DOCUMENTO);
      const r2 = normalizarClaveRutImport_(p.RUT);
      if (r1) porRut.set(r1, p);
      if (r2) porRut.set(r2, p);
      const cor = normalizar(p.CORREO || '');
      if (cor) porCorreo.set(cor, p);
      const nom = normalizar(p.NOMBRE_COMPLETO || '');
      if (nom) porNombre.set(nom, p);
    });

    // Agrupar filas (útil para reportes de Zoom/Meet donde alguien se desconecta y vuelve)
    const sesionesPorParticipacion = new Map();
    const minutosAcumulados = new Map();
    const filasPreview = [];
    const noInscritos = [];
    let errores = 0;

    filasDatos.forEach((fila, i) => {
      if (!Array.isArray(fila) || !fila.some(c => String(c || '').trim() !== '')) return;
      const numFila = (idxHeader >= 0 ? idxHeader + 2 : 1) + i;

      const rawRut = colRut >= 0 ? String(fila[colRut] || '').trim() : (encabezados[0] === 'DATO' ? String(fila[0] || '').trim() : '');
      const rawCorreo = colCorreo >= 0 ? String(fila[colCorreo] || '').trim() : (encabezados[0] === 'DATO' && String(fila[0] || '').includes('@') ? String(fila[0] || '').trim() : '');
      const rawNombre = colNombre >= 0 ? String(fila[colNombre] || '').trim() : (encabezados[0] === 'DATO' && !rawCorreo ? String(fila[0] || '').trim() : '');

      const claveRut = normalizarClaveRutImport_(rawRut);
      const claveCorreo = normalizar(rawCorreo);
      const claveNombre = normalizar(rawNombre);

      if (!claveRut && !claveCorreo && !claveNombre) {
        errores++;
        return;
      }

      let personaMatch = null;
      let metodoCruce = '';
      if (claveRut && porRut.has(claveRut)) {
        personaMatch = porRut.get(claveRut);
        metodoCruce = 'RUT';
      } else if (claveCorreo && porCorreo.has(claveCorreo)) {
        personaMatch = porCorreo.get(claveCorreo);
        metodoCruce = 'Correo';
      } else if (claveNombre && porNombre.has(claveNombre)) {
        personaMatch = porNombre.get(claveNombre);
        metodoCruce = 'Nombre';
      }

      const datoMostrado = rawNombre || rawRut || rawCorreo;
      if (!personaMatch) {
        noInscritos.push(`${datoMostrado}${rawRut && rawNombre ? ' (' + rawRut + ')' : ''}`);
        return;
      }

      const idPart = String(personaMatch.ID_PARTICIPACION);
      if (colMinutos >= 0) {
        const mins = Number(String(fila[colMinutos] || '0').replace(/[^\d.,]/g, '').replace(',', '.')) || 0;
        minutosAcumulados.set(idPart, (minutosAcumulados.get(idPart) || 0) + mins);
      }

      let sesionesAMarcar = [];
      if (modoDestino === 'auto' && tieneColsSesiones) {
        Object.keys(colsSesiones).forEach(sNum => {
          if (esValorPresenteAsistencia_(fila[colsSesiones[sNum]])) {
            sesionesAMarcar.push(Number(sNum));
          }
        });
      } else if (modoDestino === 'all') {
        for (let s = 1; s <= totSesiones; s++) sesionesAMarcar.push(s);
      } else {
        const sTarget = modoDestino === 'auto' ? 1 : Number(modoDestino);
        const marcadoExplicitamente = colAsist >= 0 ? esValorPresenteAsistencia_(fila[colAsist]) : true;
        if (marcadoExplicitamente) sesionesAMarcar.push(sTarget);
      }

      if (!sesionesPorParticipacion.has(idPart)) {
        sesionesPorParticipacion.set(idPart, {
          participacion: personaMatch,
          sesiones: new Set(),
          metodo: metodoCruce,
          dato: datoMostrado,
          fila: numFila
        });
      }
      const entry = sesionesPorParticipacion.get(idPart);
      sesionesAMarcar.forEach(s => entry.sesiones.add(s));
    });

    // Aplicar filtro de minutos si corresponde (Zoom/Meet)
    const cambiosFinales = [];
    sesionesPorParticipacion.forEach((entry, idPart) => {
      if (colMinutos >= 0 && minMinutos > 0) {
        const totMins = minutosAcumulados.get(idPart) || 0;
        if (totMins < minMinutos) {
          errores++;
          return;
        }
      }
      const arrSes = Array.from(entry.sesiones).sort((a, b) => a - b);
      if (arrSes.length > 0) {
        cambiosFinales.push({
          participacion: entry.participacion,
          sesiones: arrSes,
          metodo: entry.metodo,
          dato: entry.dato,
          fila: entry.fila
        });
      }
    });

    ASIS_IMP_RESULTADO = cambiosFinales;
    document.getElementById('asisKpiMatch').textContent = cambiosFinales.length;
    document.getElementById('asisKpiNoInscritos').textContent = noInscritos.length;
    document.getElementById('asisKpiError').textContent = errores;

    const alertaNoIns = document.getElementById('asisAlertaNoInscritos');
    if (noInscritos.length > 0) {
      const muestra = noInscritos.slice(0, 8).map(x => esc(x)).join(', ');
      alertaNoIns.innerHTML = `<strong>⚠️ ${noInscritos.length} persona(s) del archivo no están inscritas en esta actividad:</strong> ${muestra}${noInscritos.length > 8 ? '…' : ''}. <span style="display:block;margin-top:3px;">Si necesitas inscribirlas primero, usa el módulo <strong>Importaciones</strong>.</span>`;
      alertaNoIns.style.display = 'block';
    } else {
      alertaNoIns.style.display = 'none';
    }

    const tbody = document.getElementById('asisTablaPreview');
    tbody.innerHTML = cambiosFinales.length
      ? cambiosFinales.slice(0, 120).map(item => `
          <tr>
            <td>${item.fila}</td>
            <td>${esc(item.dato)}</td>
            <td><strong>${esc(item.participacion.NOMBRE_COMPLETO)}</strong> <span class="muted" style="font-size:11px;">(${esc(item.participacion.DOCUMENTO || item.participacion.RUT || '')})</span></td>
            <td><span class="badge info">${esc(item.metodo)}</span></td>
            <td>${item.sesiones.map(s => `<span class="badge success">S${s} ✓</span>`).join(' ')}</td>
          </tr>`).join('')
      : '<tr><td colspan="5" class="empty-state">No se encontraron asistencias válidas para marcar con los criterios actuales.</td></tr>';

    previewCont.style.display = 'block';
    btnAplicar.disabled = cambiosFinales.length === 0;
  }

  function aplicarAsistenciaImportada() {
    if (!ASIS_IMP_RESULTADO || !ASIS_IMP_RESULTADO.length) return;
    const promover = document.getElementById('asisPromoverSeleccionado').checked;
    let aplicados = 0;

    ASIS_IMP_RESULTADO.forEach(item => {
      const p = item.participacion;
      if (p.ESTADO_SELECCION !== 'Seleccionado') {
        if (!promover) return;
        p.ESTADO_SELECCION = 'Seleccionado';
      }
      const actuales = new Set(obtenerSesionesAsistidasParticipacion(p));
      item.sesiones.forEach(s => actuales.add(s));
      const arr = Array.from(actuales).sort((a, b) => a - b);
      p.ASISTENCIA_SESIONES = JSON.stringify(arr);
      p.SESIONES_ASISTIDAS = arr.length;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
      aplicados++;
    });

    cerrarModalImportarAsistencia();
    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    if (aplicados > 0) {
      guardarGestion(true);
      notificar(`✓ Asistencia aplicada y guardando para ${aplicados} participante(s).`);
    } else {
      notificar('No se aplicaron cambios (verifique si los participantes están en estado Seleccionado).', true);
    }
  }

  // ============================================================================
  // MEJORAS AL MÓDULO IMPORTACIONES (TABS, ARCHIVO EXCEL/CSV Y PLANTILLA)
  // ============================================================================
  function cambiarTabImportaciones(tab) {
    const esListados = tab !== 'basemadre';
    const tab1 = document.getElementById('tabImpListados');
    const tab2 = document.getElementById('tabImpBaseMadre');
    const b1 = document.getElementById('btnTabImpListados');
    const b2 = document.getElementById('btnTabImpBaseMadre');
    if (tab1) tab1.style.display = esListados ? 'block' : 'none';
    if (tab2) tab2.style.display = esListados ? 'none' : 'block';
    if (b1) b1.className = esListados ? 'btn compact' : 'btn secondary compact';
    if (b2) b2.className = esListados ? 'btn secondary compact' : 'btn compact';
  }

    const encabezados = ['NOMBRE_COMPLETO', 'RUT', 'CORREO', 'TELEFONO', 'COMUNA', 'GENERO', 'FECHA_NACIMIENTO', 'SESIONES_ASISTIDAS', 'OBSERVACIONES'];
    const filas = [
      encabezados,
      ['María Pérez González', '12.345.678-5', 'maria@ejemplo.cl', '912345678', 'Santiago', 'Mujer', '1990-05-15', 1, ''],
      ['Juan Soto Rojas', '15.987.654-K', 'juan@ejemplo.cl', '987654321', 'Santiago', 'Hombre', '1988-11-20', 0, '']
    ];
    const instrucciones = [
      ['INSTRUCCIONES DE USO — CARGA MASIVA DE PARTICIPANTES SIGC'],
      [''],
      ['1. Campos mínimos obligatorios: NOMBRE_COMPLETO y RUT (o Pasaporte/DNI).'],
      ['2. GENERO acepta: Mujer, Hombre, No binario, Prefiere no informar.'],
      ['3. FECHA_NACIMIENTO en formato AAAA-MM-DD o DD-MM-AAAA (ej: 1990-05-15).'],
      ['4. Si la persona ya existe en la base del SIGC, sus datos se actualizarán sin duplicarla ni borrar información previa.'],
      ['5. SESIONES_ASISTIDAS es numérico (ej: 0, 1, 2...).'],
      ['6. Puede cargar hasta 250 filas por archivo. Si tiene más, divida el listado en lotes.']
    ];
    descargarWorkbookExcel_([
      { nombre: 'Participantes', filas, anchos: [32, 16, 28, 15, 18, 16, 20, 20, 28] },
      { nombre: 'Instrucciones', filas: instrucciones, anchos: [88] }
    ], 'Plantilla_Carga_Masiva_SIGC');
    notificar('Plantilla Excel estándar descargada.');
  }

  function manejarArchivoImportacionUniversal(event) {
    const archivo = event?.target?.files?.[0];
    if (!archivo) return;
    const lbl = document.getElementById('impArchivoNombre');
    if (lbl) lbl.textContent = `Archivo cargado: ${archivo.name}`;
    leerArchivoTabular_(archivo, matriz => {
      if (!matriz || !matriz.length) {
        return notificar('El archivo está vacío o no tiene filas legibles.', true);
      }
      const tsv = matriz.map(fila => fila.map(c => String(c ?? '').replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');
      const textarea = document.getElementById('importTexto');
      if (textarea) textarea.value = tsv;
      leerTablaImportacion();
    });
  }

  try { actualizarAreasReporte(); } catch (e) {}

  function arrancarSistemaSIGC_() {
    try { aplicarDatosInicialesServidor_(); } catch (eInit) {}
    try { inicializarFijarColumnaNombre(); } catch (e) {}
    try { cargarDatos(); } catch (e) {}
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', arrancarSistemaSIGC_);
  } else {
    arrancarSistemaSIGC_();
  }

  window.addEventListener('load', function() {
    if (DB && DB.graficos && Object.keys(DB.graficos).length > 0) {
      try { renderGraficos(); } catch (e) {}
    }
  });
</script>
