<script>
let DB = {personas:[], actividades:[], participaciones:[], intereses:[], demanda:{resumen:{},filas:[],detalle:[]}, graficos:{}, resumen:{}};
  window.DB = DB;
  window.DATOS = DB;
  let GESTION = {actividad:null, participaciones:[], resumen:{}};
  let COMUNICACIONES = {destinatarios:[], resumen:{}};
  let DEMANDA_DETALLE_ACTUAL = [];
  let FORMULARIOS = [];
  let CAPACIDAD_FORMULARIOS = {};
  let FORMULARIO_INTERESES = null;
  let REPORTE = null;
  let REPORTE_ASISTENCIAS = null;
  let PAGINA_ASISTENCIAS = 1;
  const TAMANO_PAGINA_ASISTENCIAS = 50;
  let TEMPORIZADOR_ASISTENCIAS = null;
  const DASHBOARD_LOCAL_KEY = 'SIGC_DASHBOARD_CLIENTE_V1';
  const MODULOS_CARGADOS = new Set();
  const PAGINACION = {
    personas:{pagina:1,tamano:50},
    actividades:{pagina:1,tamano:25},
    participaciones:{pagina:1,tamano:50}
  };
  const TEMPORIZADORES_RENDER = {};
  let CARGAS_ACTIVAS = 0;
  let CASOS_REVISION = [];
  let CONFIG_REVISION_ACTIVA = '';
  let CASO_REVISION_ACTIVO = null;
  let NUEVOS_INTERESES = [];
  let IMPORTACION = {encabezados:[], filas:[], mapeo:{}, analisis:null, historial:[], baseMadre:null};
  const COMUNICACION_SELECCIONADOS = new Set();
  const GESTION_SELECCIONADOS = new Set();
  const GESTION_MODIFICADOS = new Set();
  const charts = {};

  // ==========================================
  // MOTOR DE DATOS RELACIONAL Y CACHÉ LOCAL
  // ==========================================
  const SIGC_INDEX = {
    personasPorId: new Map(),
    personasPorDoc: new Map(),
    actividadesPorId: new Map(),
    participacionesPorId: new Map(),
    participacionesPorActividad: new Map(),
    participacionesPorPersona: new Map()
  };

  function normalizarClaveDoc(doc) {
    return String(doc || '').replace(/[^0-9kK]/g, '').toUpperCase();
  }

  function sigcReconstruirIndices(tipo = 'todos') {
    if (tipo === 'todos' || tipo === 'personas') {
      SIGC_INDEX.personasPorId.clear();
      SIGC_INDEX.personasPorDoc.clear();
      (DB.personas || []).forEach(p => {
        const id = String(p.ID_PERSONA || '').trim();
        if (id) SIGC_INDEX.personasPorId.set(id, p);
        const doc = normalizarClaveDoc(p.NUMERO_DOCUMENTO || p.DOCUMENTO || p.RUT);
        if (doc) SIGC_INDEX.personasPorDoc.set(doc, p);
      });
    }
    if (tipo === 'todos' || tipo === 'actividades') {
      SIGC_INDEX.actividadesPorId.clear();
      (DB.actividades || []).forEach(a => {
        const id = String(a.ID_ACTIVIDAD || '').trim();
        if (id) SIGC_INDEX.actividadesPorId.set(id, a);
      });
    }
    if (tipo === 'todos' || tipo === 'participaciones') {
      SIGC_INDEX.participacionesPorId.clear();
      SIGC_INDEX.participacionesPorActividad.clear();
      SIGC_INDEX.participacionesPorPersona.clear();
      (DB.participaciones || []).forEach(p => {
        const id = String(p.ID_PARTICIPACION || '').trim();
        if (id) SIGC_INDEX.participacionesPorId.set(id, p);
        const idAct = String(p.ID_ACTIVIDAD || '').trim();
        if (idAct) {
          if (!SIGC_INDEX.participacionesPorActividad.has(idAct)) {
            SIGC_INDEX.participacionesPorActividad.set(idAct, []);
          }
          SIGC_INDEX.participacionesPorActividad.get(idAct).push(p);
        }
        const idPer = String(p.ID_PERSONA || '').trim();
        if (idPer) {
          if (!SIGC_INDEX.participacionesPorPersona.has(idPer)) {
            SIGC_INDEX.participacionesPorPersona.set(idPer, []);
          }
          SIGC_INDEX.participacionesPorPersona.get(idPer).push(p);
        }
      });
    }
  }

  // Almacén IndexedDB con fallback seguro a localStorage
  const SIGC_STORE = {
    dbName: 'SIGC_LOCAL_DB_V1',
    storeName: 'datos',
    _db: null,
    async getDb() {
      if (this._db) return this._db;
      if (!window.indexedDB) return null;
      return new Promise((resolve) => {
        try {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName);
            }
          };
          req.onsuccess = (e) => {
            this._db = e.target.result;
            resolve(this._db);
          };
          req.onerror = () => resolve(null);
        } catch (e) {
          resolve(null);
        }
      });
    },
    async set(clave, valor) {
      try {
        const db = await this.getDb();
        if (db) {
          return new Promise((resolve) => {
            const tx = db.transaction(this.storeName, 'readwrite');
            tx.objectStore(this.storeName).put(valor, clave);
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          });
        }
        localStorage.setItem('SIGC_' + clave, JSON.stringify(valor));
        return true;
      } catch (e) {
        return false;
      }
    },
    async get(clave) {
      try {
        const db = await this.getDb();
        if (db) {
          return new Promise((resolve) => {
            const tx = db.transaction(this.storeName, 'readonly');
            const req = tx.objectStore(this.storeName).get(clave);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          });
        }
        const val = localStorage.getItem('SIGC_' + clave);
        return val ? JSON.parse(val) : null;
      } catch (e) {
        return null;
      }
    }
  };

  function actualizarEstadoSincronizacion(estado, textoCustom) {
    const dot = document.querySelector('.status-dot');
    const elAct = document.getElementById('ultimaActualizacion');
    if (dot) {
      dot.className = 'status-dot ' + (estado || 'saved');
    }
    if (elAct && textoCustom) {
      elAct.textContent = textoCustom;
    }
  }

  function irAVista(nombreVista) {
    const btn = document.querySelector(`.menu button[data-view="${nombreVista}"]`);
    document.querySelectorAll('.menu button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const targetView = document.getElementById(nombreVista);
    if (targetView) targetView.classList.add('active');
    const titulo = document.getElementById('tituloVista');
    if (titulo) {
      if (btn) titulo.textContent = btn.textContent.replace(/^[^A-Za-zÁÉÍÓÚÑ]+/, '').trim();
      else if (nombreVista === 'calendario') titulo.textContent = 'Calendario de capacitaciones';
      else if (nombreVista === 'registro-personas') titulo.textContent = 'Registrar persona';
      else if (nombreVista === 'registro-actividades') titulo.textContent = 'Registrar actividad';
      else if (nombreVista === 'registro-participaciones') titulo.textContent = 'Registrar participación';
    }
    cargarVistaBajoDemanda(nombreVista);
  }

  document.querySelectorAll('.menu button').forEach(btn => {
    btn.addEventListener('click', () => {
      irAVista(btn.dataset.view);
    });
  });

  async function cargarDatos(forzar=false) {
    const inicioCarga = performance.now();
    let localDataLoaded = false;

    if (!forzar) {
      // 1. Carga ultra-rápida desde IndexedDB/localStorage en 0.0 segundos
      const [resumenLocal, personasLocal, actividadesLocal, partLocal] = await Promise.all([
        SIGC_STORE.get('dashboard'),
        SIGC_STORE.get('personas'),
        SIGC_STORE.get('actividades'),
        SIGC_STORE.get('participaciones')
      ]);

      if (resumenLocal && resumenLocal.resumen) {
        DB.resumen = resumenLocal.resumen || {};
        DB.graficos = resumenLocal.graficos || {};
        DB.fechaActualizacion = resumenLocal.fechaActualizacion || '';
        if (personasLocal && Array.isArray(personasLocal)) {
          DB.personas = personasLocal;
          MODULOS_CARGADOS.add('personas');
        }
        if (actividadesLocal && Array.isArray(actividadesLocal)) {
          DB.actividades = actividadesLocal;
          MODULOS_CARGADOS.add('actividades');
        }
        if (partLocal && Array.isArray(partLocal)) {
          DB.participaciones = partLocal;
          MODULOS_CARGADOS.add('participaciones');
        }
        sigcReconstruirIndices('todos');
        renderDashboard();
        llenarSelectores();
        localDataLoaded = true;
        const ms = (performance.now() - inicioCarga).toFixed(1);
        actualizarEstadoSincronizacion('saved', `Listo (RAM) · ${ms} ms`);
      }
    }

    if (!localDataLoaded) {
      mostrarCarga(true, 'Cargando datos…');
    } else {
      actualizarEstadoSincronizacion('syncing', 'Sincronizando con Google Sheets…');
    }

    const clientTimestamp = (!forzar && DB.fechaActualizacion) ? DB.fechaActualizacion : null;

    google.script.run
      .withSuccessHandler(datos => {
        mostrarCarga(false);
        if (!datos) return;

        if (datos.sinCambios) {
          actualizarEstadoSincronizacion('saved', `Sincronizado: ${datos.fechaActualizacion || 'Al día'}`);
          precargarModulosSilencioso_();
          return;
        }

        DB.resumen = datos.resumen || {};
        DB.graficos = datos.graficos || {};
        DB.fechaActualizacion = datos.fechaActualizacion || '';
        renderDashboard();
        SIGC_STORE.set('dashboard', datos);
        const segundos = ((performance.now() - inicioCarga) / 1000).toFixed(1);
        actualizarEstadoSincronizacion('saved', `Sincronizado: ${datos.fechaActualizacion || 'Hoy'} · ${segundos}s`);
        precargarModulosSilencioso_();
      })
      .withFailureHandler(error => {
        mostrarCarga(false);
        if (!localDataLoaded) {
          notificar(error.message || String(error), true);
          actualizarEstadoSincronizacion('error', 'Error al sincronizar');
        } else {
          actualizarEstadoSincronizacion('saved', 'Operando con datos locales');
        }
      })
      .obtenerDashboardLiviano(forzar === true, clientTimestamp);
  }

  function precargarModulosSilencioso_() {
    setTimeout(() => {
      google.script.run.withSuccessHandler(datos => {
        if (datos && datos.actividades) {
          DB.actividades = datos.actividades;
          MODULOS_CARGADOS.add('actividades');
          SIGC_STORE.set('actividades', datos.actividades);
          sigcReconstruirIndices('actividades');
          llenarSelectores();
          if (document.getElementById('actividades')?.classList.contains('active')) renderActividades();
          if (document.getElementById('calendario')?.classList.contains('active')) renderCalendario();

          setTimeout(() => {
            google.script.run.withSuccessHandler(dPersonas => {
              if (dPersonas && dPersonas.personas) {
                DB.personas = dPersonas.personas;
                MODULOS_CARGADOS.add('personas');
                SIGC_STORE.set('personas', dPersonas.personas);
                sigcReconstruirIndices('personas');
                llenarSelectores();
                if (document.getElementById('personas')?.classList.contains('active')) renderPersonas();

                setTimeout(() => {
                  if (!MODULOS_CARGADOS.has('participaciones')) {
                    google.script.run.withSuccessHandler(dPart => {
                      if (dPart && dPart.participaciones) {
                        DB.participaciones = dPart.participaciones;
                        MODULOS_CARGADOS.add('participaciones');
                        SIGC_STORE.set('participaciones', dPart.participaciones);
                        sigcReconstruirIndices('participaciones');
                        if (document.getElementById('participaciones')?.classList.contains('active')) renderParticipaciones();
                      }
                    }).obtenerDatosModulo('participaciones');
                  }
                }, 1000);
              }
            }).obtenerDatosModulo('personas');
          }, 800);
        }
      }).obtenerDatosModulo('actividades');
    }, 600);
  }

  function cargarDashboardLocal_() {
    return false;
  }
  function guardarDashboardLocal_(datos) {
    if (datos) SIGC_STORE.set('dashboard', datos);
  }
  function renderDashboard() {
    const r = DB.resumen;
    texto('kpiPersonas', r.totalPersonas);
    texto('kpiActividades', r.totalActividades);
    texto('kpiActivas', r.actividadesActivas);
    texto('kpiParticipaciones', r.totalParticipaciones);
    texto('kpiEfectiva', r.participacionEfectiva || 0);
    texto('kpiAprobacion', formatoPorcentaje(r.tasaAprobacion));
    texto('kpiTasaParticipacion', formatoPorcentaje(r.tasaParticipacion));
    texto('kpiCupos', r.cuposOfrecidos || 0);
    texto('kpiSeleccion', formatoPorcentaje(r.tasaSeleccion));
    texto('kpiAsistencia', formatoPorcentaje(r.tasaAsistencia));
    texto('kpiCertificacion', formatoPorcentaje(r.tasaCertificacion));
    texto('kpiBrecha', r.brechaDemanda || 0);
    renderGraficos();
  }
  function cargarVistaBajoDemanda(vista) {
    if (vista === 'dashboard') return;
    if (vista === 'formularios') {
      asegurarModulo('actividades', cargarFormularios);
      return;
    }
    if (vista === 'importaciones') {
      asegurarModulo('actividades', cargarImportaciones);
      return;
    }
    if (vista === 'reportes') {
      asegurarModulo('actividades');
      return;
    }
    if (vista === 'calendario') {
      asegurarModulo('actividades', renderCalendario);
      return;
    }
    const mapa = {
      personas: 'personas',
      actividades: 'actividades',
      calendario: 'actividades',
      participaciones: 'participaciones',
      demanda: 'demanda',
      gestion: 'actividades',
      comunicaciones: 'actividades',
      'registro-personas': 'personas',
      'registro-actividades': 'actividades',
      'registro-participaciones': 'catalogos'
    };
    if (mapa[vista]) asegurarModulo(mapa[vista]);
  }
  function asegurarModulo(modulo, alTerminar) {
    if (MODULOS_CARGADOS.has(modulo)) { if (alTerminar) alTerminar(); return; }
    mostrarCarga(true, 'Preparando módulo…');
    google.script.run.withSuccessHandler(datos => {
      Object.assign(DB, datos || {});
      MODULOS_CARGADOS.add(modulo);
      if (modulo === 'personas') renderPersonas();
      if (modulo === 'actividades') {
        renderActividades();
        renderCalendario();
        llenarSelectores();
      }
      if (modulo === 'participaciones') { renderPersonas(); renderActividades(); renderParticipaciones(); llenarSelectores(); MODULOS_CARGADOS.add('personas'); MODULOS_CARGADOS.add('actividades'); }
      if (modulo === 'demanda') renderDemanda();
      if (modulo === 'catalogos') {
        MODULOS_CARGADOS.add('personas');
        MODULOS_CARGADOS.add('actividades');
        llenarSelectores();
      }
      mostrarCarga(false);
      if (alTerminar) alTerminar();
    }).withFailureHandler(error => { mostrarCarga(false); notificar(error.message || String(error), true); })
      .obtenerDatosModulo(modulo);
  }
  function renderGraficos() {
    if (typeof Chart === 'undefined') return;
    crearGrafico('chartEstados', 'doughnut', DB.graficos.actividadesPorEstado);
    crearGrafico('chartResultados', 'doughnut', DB.graficos.resultados);
    crearGrafico('chartAreas', 'bar', DB.graficos.actividadesPorArea.slice(0,10));
    crearGrafico('chartParticipaciones', 'bar', DB.graficos.participacionesPorActividad.slice(0,10), true);
    crearGrafico('chartEfectiva', 'bar', DB.graficos.participacionEfectivaPorActividad.slice(0,10), true);
  }
  function crearGrafico(id, tipo, datos, horizontal=false) {
    if (!datos || !datos.length) return;
    const el = document.getElementById(id);
    if (!el) return;
    if (charts[id]) charts[id].destroy();
    const paletaModerna = [
      '#1e3a8a', '#10b981', '#f59e0b', '#ef4444',
      '#8b5cf6', '#0ea5e9', '#6366f1', '#ec4899',
      '#14b8a6', '#f97316'
    ];
    charts[id] = new Chart(el, {
      type: tipo,
      data: {
        labels: datos.map(x => x.nombre),
        datasets: [{
          data: datos.map(x => x.valor),
          backgroundColor: paletaModerna.slice(0, datos.length),
          borderRadius: tipo === 'bar' ? 6 : 0,
          borderWidth: tipo === 'doughnut' ? 2 : 0,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: horizontal ? 'y' : 'x',
        plugins: {
          legend: {
            display: tipo === 'doughnut',
            position: 'bottom',
            labels: { boxWidth: 12, padding: 14, font: { size: 12, family: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto' } }
          },
          tooltip: {
            padding: 10,
            cornerRadius: 8,
            boxPadding: 4
          }
        },
        scales: tipo === 'bar' ? {
          y: horizontal ? {} : { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { precision: 0 } },
          x: horizontal ? { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { precision: 0 } } : { grid: { display: false } }
        } : {}
      }
    });
  }
  function renderPersonas() {
    const q = normalizar(document.getElementById('buscarPersonas')?.value || '');
    const filas = DB.personas.filter(p => normalizar([
      p.NOMBRE_COMPLETO,p.RUT,p.DOCUMENTO,p.FECHA_NACIMIENTO,p.EDAD,
      p.CORREO,p.TELEFONO,p.COMUNA,p.BARRIO,p.PARTICIPA_PMJH
    ].join(' ')).includes(q));
    const visibles = paginarFilas_('personas', filas);
    document.getElementById('tablaPersonas').innerHTML = visibles.length ? visibles.map(p => `<tr>
      <td>${esc(p.ID_PERSONA)}</td>
      <td>${esc(p.DOCUMENTO || p.RUT)}</td>
      <td><strong>${esc(p.NOMBRE_COMPLETO)}</strong></td>
      <td>${esc(fechaPersonaVisible(p.FECHA_NACIMIENTO))}</td>
      <td>${esc(edadVisible(p.EDAD))}</td>
      <td>${esc(p.CORREO)}</td>
      <td>${esc(p.TELEFONO)}</td>
      <td>${esc(p.COMUNA)}</td>
      <td>${esc(p.BARRIO)}</td>
      <td><span class="badge">${esc(p.PARTICIPA_PMJH || 'No informado')}</span></td>
      <td><span class="badge">${esc(p.ESTADO_CONTACTO || 'No informado')}</span></td>
      <td><button class="btn secondary compact" type="button" data-id="${esc(p.ID_PERSONA)}" onclick="abrirEdicionPersona(this.dataset.id)">Editar</button></td>
    </tr>`).join('') : '<tr><td colspan="12" class="empty-state">No se encontraron personas.</td></tr>';
  }
  const ESTADOS_ACTIVIDAD_CATALOGO = [
    'Planificada',
    'Difusión',
    'Inscripción abierta',
    'En ejecución',
    'Ejecutada',
    'Suspendida',
    'Cerrada',
    'Archivada'
  ];

  function poblarFiltroEstadosActividad_() {
    const filtro = document.getElementById('filtroEstado');
    if (!filtro) return;
    const valorSeleccionado = filtro.value;
    const estadosEnDb = (DB.actividades || []).map(a => a.ESTADO_ACTIVIDAD).filter(Boolean);
    const todosLosEstados = [...new Set([...ESTADOS_ACTIVIDAD_CATALOGO, ...estadosEnDb])];
    if (filtro.options.length === todosLosEstados.length + 1) return;

    filtro.innerHTML = '<option value="">Todos los estados</option>' +
      todosLosEstados.map(e => `<option value="${esc(e)}">${esc(e)}</option>`).join('');

    if (valorSeleccionado) {
      filtro.value = valorSeleccionado;
    }
  }

  function obtenerBadgeClaseEstadoActividad(estado) {
    const e = String(estado || '').trim();
    if (e === 'En ejecución') return 'success';
    if (e === 'Inscripción abierta' || e === 'Difusión') return 'info';
    if (e === 'Ejecutada' || e === 'Cerrada') return 'neutral';
    if (e === 'Suspendida' || e === 'Archivada') return 'danger';
    return 'warning';
  }

  function renderActividades() {
    poblarFiltroEstadosActividad_();
    const q = normalizar(document.getElementById('buscarActividades')?.value || '');
    const estado = document.getElementById('filtroEstado')?.value || '';
    const mostrarArchivadas = document.getElementById('mostrarActividadesArchivadas')?.checked === true;
    const filas = DB.actividades
      .filter(a =>
        normalizar([a.NOMBRE_ACTIVIDAD,a.TIPO_ACTIVIDAD,a.PROGRAMA,a.AREA_TEMATICA,a.ID_ACTIVIDAD].join(' ')).includes(q) &&
        (!estado || a.ESTADO_ACTIVIDAD === estado) &&
        (mostrarArchivadas || normalizar(estado) === 'archivada' || !esActividadArchivada_(a))
      )
      .sort(compararActividadesRecientes);

    const visibles = paginarFilas_('actividades', filas);
    document.getElementById('tablaActividades').innerHTML = visibles.length ? visibles.map(a => `<tr>
      <td>${esc(a.ID_ACTIVIDAD)}</td>
      <td>
        <strong>${esc(a.NOMBRE_ACTIVIDAD)}</strong>
        ${a.FECHA_INICIO ? `<br><small class="muted" style="font-size:11.5px">📅 ${esc(fechaActividadVisible(a.FECHA_INICIO))}${a.FECHA_TERMINO ? ' al ' + esc(fechaActividadVisible(a.FECHA_TERMINO)) : ''}</small>` : ''}
      </td>
      <td>${esc(a.TIPO_ACTIVIDAD)}</td>
      <td>${esc(a.PROGRAMA)}</td>
      <td>${esc(a.AREA_TEMATICA)}</td>
      <td>${esc(a.ANO)}</td>
      <td>${esc(a.SESIONES_TOTALES)}</td>
      <td><span class="badge ${obtenerBadgeClaseEstadoActividad(a.ESTADO_ACTIVIDAD)}">${esc(a.ESTADO_ACTIVIDAD || 'Planificada')}</span></td>
      <td><div class="bulkbar"><button class="btn secondary compact" type="button" data-id="${esc(a.ID_ACTIVIDAD)}" onclick="abrirEdicionActividad(this.dataset.id)">Editar</button>${esActividadArchivada_(a) ? '' : `<button class="btn danger compact" type="button" data-id="${esc(a.ID_ACTIVIDAD)}" onclick="solicitarQuitarActividad(this.dataset.id)">Quitar</button>`}</div></td>
    </tr>`).join('') : '<tr><td colspan="9" class="empty-state">No se encontraron actividades.</td></tr>';
  }
  function renderParticipaciones() {
    const q = normalizar(document.getElementById('buscarParticipaciones')?.value || '');
    const filas = DB.participaciones.filter(p => {
      const per = SIGC_INDEX.personasPorId.get(String(p.ID_PERSONA || '').trim());
      const act = SIGC_INDEX.actividadesPorId.get(String(p.ID_ACTIVIDAD || '').trim());
      const nombreCompleto = p.NOMBRE_COMPLETO || per?.NOMBRE_COMPLETO || '';
      const doc = p.DOCUMENTO || p.RUT || per?.NUMERO_DOCUMENTO || per?.DOCUMENTO || per?.RUT || '';
      const actNombre = p.NOMBRE_ACTIVIDAD || act?.NOMBRE_ACTIVIDAD || '';
      return normalizar([nombreCompleto, doc, p.EDAD, p.PARTICIPA_PMJH, actNombre, p.RESULTADO_FINAL].join(' ')).includes(q);
    });
    const visibles = paginarFilas_('participaciones', filas);
    document.getElementById('tablaParticipaciones').innerHTML = visibles.length ? visibles.map(p => {

  function paginarFilas_(tipo, filas) {
    const estado = PAGINACION[tipo];
    const paginas = Math.max(1, Math.ceil(filas.length / estado.tamano));
    estado.pagina = Math.min(Math.max(1, estado.pagina), paginas);
    const inicio = (estado.pagina - 1) * estado.tamano;
    const info = document.getElementById(`pagina${tipo.charAt(0).toUpperCase() + tipo.slice(1)}Info`);
    if (info) {
      const desde = filas.length ? inicio + 1 : 0;
      const hasta = Math.min(inicio + estado.tamano, filas.length);
      info.textContent = `${desde}–${hasta} de ${filas.length}`;
    }
    return filas.slice(inicio, inicio + estado.tamano);
  }

  function esActividadArchivada_(actividad) {
    return normalizar(actividad?.ESTADO_ACTIVIDAD) === 'archivada';
  }
  function compararActividadesRecientes(a, b) {
    const fechaA = fechaActividadNumero(a.FECHA_INICIO);
    const fechaB = fechaActividadNumero(b.FECHA_INICIO);
    if (fechaA && fechaB && fechaA !== fechaB) {
      return fechaB - fechaA;
    }
    if (fechaA && !fechaB) return -1;
    if (!fechaA && fechaB) return 1;

    const claveA = claveCorrelativaActividad(a.ID_ACTIVIDAD);
    const claveB = claveCorrelativaActividad(b.ID_ACTIVIDAD);
    const anioA = Number(a.ANO || claveA.anio || 0);
    const anioB = Number(b.ANO || claveB.anio || 0);
    if (anioA !== anioB) return anioB - anioA;
    if (claveA.numero !== claveB.numero) return claveB.numero - claveA.numero;
    return Number(b._ordenIngreso || 0) - Number(a._ordenIngreso || 0);
  }
  function claveCorrelativaActividad(idActividad) {
    const texto = String(idActividad || '').trim().toUpperCase();
    const coincidencia = texto.match(/(\d{4})\D+(\d+)\s*$/);
    if (coincidencia) {
      return {anio: Number(coincidencia[1]) || 0, numero: Number(coincidencia[2]) || 0};
    }
    const numeros = texto.match(/\d+/g) || [];
    return {
      anio: Number(numeros.length > 1 ? numeros[numeros.length - 2] : 0) || 0,
      numero: Number(numeros.length ? numeros[numeros.length - 1] : 0) || 0
    };
  }
  function fechaActividadNumero(valor) {
    const texto = String(valor || '').trim();
    if (!texto) return 0;
    let coincidencia = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (coincidencia) {
      return new Date(Number(coincidencia[1]), Number(coincidencia[2]) - 1, Number(coincidencia[3])).getTime();
    }
    coincidencia = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (coincidencia) {
      return new Date(Number(coincidencia[3]), Number(coincidencia[2]) - 1, Number(coincidencia[1])).getTime();
    }
    const fecha = new Date(texto);
    return Number.isNaN(fecha.getTime()) ? 0 : fecha.getTime();
  }
  function fechaActividadVisible(valor) {
    const texto = String(valor || '').trim();
    if (!texto) return '';
    let coincidencia = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (coincidencia) {
      return `${String(coincidencia[3]).padStart(2,'0')}-${String(coincidencia[2]).padStart(2,'0')}-${coincidencia[1]}`;
    }
    coincidencia = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (coincidencia) {
      return `${String(coincidencia[1]).padStart(2,'0')}-${String(coincidencia[2]).padStart(2,'0')}-${coincidencia[3]}`;
    }
    return texto;
  }

    if (!correos.length) return notificar('No hay correos seleccionados para copiar.', true);
    await copiarTextoPortapapeles_(correos.join('; '));
    notificar('Se copiaron ' + correos.length + ' correos para CCO.');
  }
  function correoEsValidoCliente_(correo) {
    return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(correo || '').trim());
  }
  function correosUnicosValidos_(personas) {
    return [...new Set((personas || [])
      .map(p => String(p.CORREO || '').trim().toLowerCase())
      .filter(correoEsValidoCliente_))];
  }
  async function copiarTextoPortapapeles_(contenido) {
    try {
      await navigator.clipboard.writeText(contenido);
    } catch (error) {
      const auxiliar = document.createElement('textarea');
      auxiliar.value = contenido;
      document.body.appendChild(auxiliar);
      auxiliar.select();
      document.execCommand('copy');
      auxiliar.remove();
    }
  }

  function obtenerDiasSeleccionados(prefijo) {
    const contenedor = document.getElementById(`${prefijo}DiasSemana`);
    if (!contenedor) return [];
    const btns = contenedor.querySelectorAll('.day-toggle-btn.active');
    return Array.from(btns).map(b => Number(b.dataset.dia)).sort((a, b) => a - b);

  function sincronizarHorarioTexto(prefijo) {
    const inputHorario = document.getElementById(`${prefijo}HorarioTexto`);
    if (!inputHorario) return;
    const dias = obtenerDiasSeleccionados(prefijo);
    const hInicio = document.getElementById(`${prefijo}HoraInicio`)?.value || '';
    const hFin = document.getElementById(`${prefijo}HoraFin`)?.value || '';

    if (!dias.length && !hInicio) return;

    const nombresDias = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo' };
    let textoDias = '';
    if (dias.length === 1) {
      textoDias = nombresDias[dias[0]];
    } else if (dias.length > 1) {
      const arr = dias.map(d => nombresDias[d]);
      const ultimo = arr.pop();
      textoDias = arr.join(', ') + ' y ' + ultimo;
    }

    let textoHoras = '';
    if (hInicio && hFin) textoHoras = `${hInicio} a ${hFin}`;
    else if (hInicio) textoHoras = `desde ${hInicio}`;

    const resumen = [textoDias, textoHoras].filter(Boolean).join(' ');
    if (resumen) inputHorario.value = resumen;
  }

  function generarCronogramaAutomatico(prefijo) {
    const fInicioVal = document.getElementById(`${prefijo}FechaInicio`)?.value;
    if (!fInicioVal) {
      notificar('Por favor seleccione una Fecha de Inicio antes de generar el cronograma.', true);
      document.getElementById(`${prefijo}FechaInicio`)?.focus();
      return;
    }
    const totalSesiones = Math.max(1, parseInt(document.getElementById(`${prefijo}SesionesTotales`)?.value || '1', 10));
    let diasSeleccionados = obtenerDiasSeleccionados(prefijo);

    const partes = fInicioVal.split('-');
    let cursorFecha = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12, 0, 0);

    if (diasSeleccionados.length === 0) {
      const diaInicio = cursorFecha.getDay();
      diasSeleccionados = [diaInicio];
      const btn = document.getElementById(`${prefijo}DiasSemana`)?.querySelector(`[data-dia="${diaInicio}"]`);
      if (btn) btn.classList.add('active');
    }

    const hInicio = document.getElementById(`${prefijo}HoraInicio`)?.value || '10:00';
    const hFin = document.getElementById(`${prefijo}HoraFin`)?.value || '12:00';

    const sesiones = [];
    let intentos = 0;
    while (sesiones.length < totalSesiones && intentos < 500) {
      const diaSemana = cursorFecha.getDay();
      if (diasSeleccionados.includes(diaSemana)) {
        sesiones.push({
          numero: sesiones.length + 1,
          fecha: formatoClaveFecha(cursorFecha),
          horaInicio: hInicio,
          horaFin: hFin
        });
      }
      cursorFecha.setDate(cursorFecha.getDate() + 1);
      intentos++;
    }

    SESIONES_CRONOGRAMA[prefijo] = sesiones;

    if (sesiones.length > 0) {
      const inputTermino = document.getElementById(`${prefijo}FechaTermino`);
      if (inputTermino) {
        inputTermino.value = sesiones[sesiones.length - 1].fecha;
      }
    }

    renderSesionesProgramadas(prefijo);
    sincronizarHorarioTexto(prefijo);
    sincronizarSesionesEnFormulario(prefijo);
    notificar(`Se programaron ${sesiones.length} sesiones.`);
  }

  function agregarSesionFila(prefijo) {
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    let fechaSugerida = '';
    const hInicio = document.getElementById(`${prefijo}HoraInicio`)?.value || '10:00';
    const hFin = document.getElementById(`${prefijo}HoraFin`)?.value || '12:00';

    if (sesiones.length > 0) {
      const ult = sesiones[sesiones.length - 1];
      const partes = (ult.fecha || '').split('-');
      if (partes.length === 3) {
        const d = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12, 0, 0);
        d.setDate(d.getDate() + 7);
        fechaSugerida = formatoClaveFecha(d);
      }
    } else {
      fechaSugerida = document.getElementById(`${prefijo}FechaInicio`)?.value || formatoClaveFecha(new Date());
    }

    sesiones.push({
      numero: sesiones.length + 1,
      fecha: fechaSugerida,
      horaInicio: hInicio,
      horaFin: hFin
    });

    SESIONES_CRONOGRAMA[prefijo] = sesiones;

    const inputTotales = document.getElementById(`${prefijo}SesionesTotales`);
    if (inputTotales) inputTotales.value = sesiones.length;

    renderSesionesProgramadas(prefijo);
    sincronizarSesionesEnFormulario(prefijo);
  }

  function quitarSesionFila(prefijo, index) {
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (index >= 0 && index < sesiones.length) {
      sesiones.splice(index, 1);
      sesiones.forEach((s, i) => { s.numero = i + 1; });
      SESIONES_CRONOGRAMA[prefijo] = sesiones;

      const inputTotales = document.getElementById(`${prefijo}SesionesTotales`);
      if (inputTotales && sesiones.length > 0) inputTotales.value = sesiones.length;

      renderSesionesProgramadas(prefijo);
      sincronizarSesionesEnFormulario(prefijo);
    }
  }

  function cambiarFechaSesion(prefijo, index, nuevaFecha) {

      sincronizarSesionesEnFormulario(prefijo);

  function cambiarHoraSesion(prefijo, index, campo, nuevoValor) {

    );
    establecerSelectConValor(
      form.elements.REQUIERE_SELECCION,
      actividad.REQUIERE_SELECCION || 'No'
    );
    asignarCampoFormulario(form, 'CUPOS', actividad.CUPOS);

    establecerSelectConValor(form.elements.MODALIDAD, actividad.MODALIDAD || 'Presencial');

      form.elements.ESTADO_ACTIVIDAD,
      actividad.ESTADO_ACTIVIDAD || 'Planificada'
    );
    asignarCampoFormulario(form, 'INSTITUCION_ASOCIADA', actividad.INSTITUCION_ASOCIADA);
    asignarCampoFormulario(form, 'RESPONSABLE', actividad.RESPONSABLE);
    asignarCampoFormulario(form, 'CARPETA_DRIVE', actividad.CARPETA_DRIVE);
    asignarCampoFormulario(form, 'HORARIO', actividad.HORARIO || '');
    asignarCampoFormulario(form, 'OBSERVACIONES', actividad.OBSERVACIONES);

    let sesiones = [];
    if (actividad.DETALLE_SESIONES) {
      try {
        sesiones = typeof actividad.DETALLE_SESIONES === 'string'
          ? JSON.parse(actividad.DETALLE_SESIONES)
          : actividad.DETALLE_SESIONES;
      } catch (e) { sesiones = []; }
    }
    SESIONES_CRONOGRAMA['edit'] = Array.isArray(sesiones) ? [...sesiones] : [];

    // Cargar horas de la primera sesión si existen
    if (SESIONES_CRONOGRAMA['edit'].length > 0) {
      const s1 = SESIONES_CRONOGRAMA['edit'][0];

      if (contenedorDias) {
        contenedorDias.querySelectorAll('.day-toggle-btn').forEach(btn => btn.classList.remove('active'));

  function asignarCampoFormulario(form, nombre, valor) {
    const campo = form?.elements?.[nombre];

  }
  function establecerSelectConValor(selector, valor) {
    if (!selector) return;
    const texto = String(valor || '').trim();
    const existe = [...selector.options].some(op => op.value === texto);
    if (texto && !existe) {
      selector.insertAdjacentHTML(
        'beforeend',
        `<option value="${esc(texto)}">${esc(texto)}</option>`
      );
    }
    selector.value = texto;
  }
  function porcentajeParaFormulario(valor) {
    const texto = String(valor ?? '').trim();
    if (!texto) return '';
    const limpio = texto.replace('%','').replace(',','.').trim();
    const numero = Number(limpio);
    if (!Number.isFinite(numero)) return '';
    if (texto.includes('%')) return numero;
    return numero <= 1 ? numero * 100 : numero;
  }
  function enviarEdicionActividad(evento) {
    evento.preventDefault();
    sincronizarSesionesEnFormulario('edit');
    const form = evento.target;
    const datos = Object.fromEntries(new FormData(form).entries());
    const estado = String(datos.ESTADO_ACTIVIDAD || '');
    const avisoFinal = ['Ejecutada', 'Cerrada'].includes(estado)
      ? '\n\nAl continuar, se recalcularán los resultados de las personas seleccionadas.'
      : '';
    if (!confirm('¿Desea guardar los cambios de esta actividad?' + avisoFinal)) {
      return;
    }

    const idActividad = datos.ID_ACTIVIDAD;
    const idx = DB.actividades.findIndex(a => a.ID_ACTIVIDAD === idActividad);
    const backupActividad = idx >= 0 ? {...DB.actividades[idx]} : null;

    // Actualización optimista inmediata (0 ms)
    if (idx >= 0) {
      DB.actividades[idx] = Object.assign({}, DB.actividades[idx], datos);
      sigcReconstruirIndices('actividades');
      renderActividades();
      llenarSelectores();
      if (document.getElementById('calendario')?.classList.contains('active')) renderCalendario();
    }
    cerrarEdicionActividad();
    notificar('Cambios aplicados localmente. Sincronizando con Google Sheets…');
    actualizarEstadoSincronizacion('syncing', 'Guardando actividad en segundo plano…');

    google.script.run
      .withSuccessHandler(respuesta => {
        notificar(respuesta.mensaje || 'Actividad actualizada.');
        actualizarEstadoSincronizacion('saved', '✓ Actividad guardada en Google Sheets');
        if (respuesta.actividad) {
          const freshIdx = DB.actividades.findIndex(a => a.ID_ACTIVIDAD === respuesta.id);
          if (freshIdx >= 0) DB.actividades[freshIdx] = Object.assign({}, DB.actividades[freshIdx], respuesta.actividad);
          SIGC_STORE.set('actividades', DB.actividades);
          sigcReconstruirIndices('actividades');
          renderActividades();
          llenarSelectores();
        }
      })
      .withFailureHandler(error => {
        if (backupActividad && idx >= 0) {
          DB.actividades[idx] = backupActividad;
          sigcReconstruirIndices('actividades');
          renderActividades();
          llenarSelectores();
        }
        notificar('Error al guardar en Google Sheets: ' + (error.message || String(error)), true);
        actualizarEstadoSincronizacion('error', 'Error al guardar actividad');
      })
      .actualizarActividad(datos);
  }
  function partesFechaPersona(valor) {
    const texto = String(valor || '').trim();
    if (!texto) return null;
    let m = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (m) {
      return {
        anio: Number(m[1]),
        mes: Number(m[2]),
        dia: Number(m[3])
      };
    }
    m = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (m) {
      return {
        anio: Number(m[3]),
        mes: Number(m[2]),
        dia: Number(m[1])
      };
    }
    return null;
  }
  function calcularEdadDesdeFecha(valor) {
    const partes = partesFechaPersona(valor);
    if (!partes) return '';
    const nacimiento = new Date(partes.anio, partes.mes - 1, partes.dia);
    if (
      nacimiento.getFullYear() !== partes.anio ||
      nacimiento.getMonth() !== partes.mes - 1 ||
      nacimiento.getDate() !== partes.dia
    ) return '';
    const hoy = new Date();
    if (nacimiento.getTime() > hoy.getTime()) return '';
    let edad = hoy.getFullYear() - nacimiento.getFullYear();
    const aunNoCumple =
      hoy.getMonth() < nacimiento.getMonth() ||
      (hoy.getMonth() === nacimiento.getMonth() &&
       hoy.getDate() < nacimiento.getDate());
    if (aunNoCumple) edad--;
    return edad >= 0 && edad <= 120 ? edad : '';
  }
  function actualizarEdadPersona() {
    const fecha = document.getElementById('fechaNacimientoPersona');
    const edad = document.getElementById('edadPersona');
    if (!edad) return;
    const calculada = calcularEdadDesdeFecha(fecha?.value || '');
    edad.value = calculada === '' ? '' : `${calculada} años`;
  }
  function fechaPersonaVisible(valor) {
    const partes = partesFechaPersona(valor);
    if (!partes) return valor ? String(valor) : 'No informada';
    return `${String(partes.dia).padStart(2,'0')}-${String(partes.mes).padStart(2,'0')}-${partes.anio}`;

          sigcReconstruirIndices('personas');
          renderPersonas();
          llenarSelectores();

    const datos = Object.fromEntries(new FormData(form).entries());
    if (form.id === 'formPersona') datos.INTERESES = NUEVOS_INTERESES.map(x => ({...x}));

    // Actualización optimista inmediata en cliente (0 ms)
    let tempId = null;
    if (form.id === 'formPersona') {
      tempId = 'PER-TMP-' + Math.random().toString(36).substring(2, 7).toUpperCase();
      const localPersona = Object.assign({
        ID_PERSONA: tempId,
        DOCUMENTO: datos.NUMERO_DOCUMENTO || datos.RUT || '',
        RUT: datos.TIPO_DOCUMENTO === 'RUT' ? (datos.NUMERO_DOCUMENTO || datos.RUT || '') : '',
        ESTADO_CONTACTO: 'Pendiente',
        FECHA_PRIMER_REGISTRO: new Date().toISOString().slice(0, 10)
      }, datos);
      DB.personas.unshift(localPersona);
      sigcReconstruirIndices('personas');
      renderPersonas();
      llenarSelectores();
      form.reset();
      NUEVOS_INTERESES = [];
      renderInteresesNuevaPersona();
      actualizarDocumentoPersona();
      actualizarEdadPersona();
      actualizarAreasPersonaInteres();

    } else if (form.id === 'formActividad') {

      const localActividad = Object.assign({
        ID_ACTIVIDAD: tempId,

      }, datos);
      DB.actividades.unshift(localActividad);
      sigcReconstruirIndices('actividades');
      renderActividades();
      llenarSelectores();
      form.reset();
      actualizarAreasActividad();
      SESIONES_CRONOGRAMA['reg'] = [];
      renderSesionesProgramadas('reg');
      sincronizarSesionesEnFormulario('reg');
      notificar('Actividad registrada localmente. Sincronizando con Google Sheets…');
      actualizarEstadoSincronizacion('syncing', 'Guardando actividad en segundo plano…');
    } else if (form.id === 'formParticipacion') {
      tempId = 'PAR-TMP-' + Math.random().toString(36).substring(2, 7).toUpperCase();
      const actObj = SIGC_INDEX.actividadesPorId.get(datos.ID_ACTIVIDAD) || {};
      const localPart = Object.assign({
        ID_PARTICIPACION: tempId,

        AREA_TEMATICA: actObj.AREA_TEMATICA || ''
      }, datos);

      sigcReconstruirIndices('participaciones');
      renderParticipaciones();
      form.reset();
      notificar('Inscripción registrada localmente. Sincronizando con Google Sheets…');
      actualizarEstadoSincronizacion('syncing', 'Guardando participación en segundo plano…');

      mostrarCarga(true);

    google.script.run
      .withSuccessHandler(r => {
        mostrarCarga(false);
        notificar(r.mensaje || 'Registro guardado exitosamente.');
        actualizarEstadoSincronizacion('saved', '✓ Guardado en Google Sheets');

        if (form.id === 'formPersona') {
          if (r.persona) {
            const idx = DB.personas.findIndex(p => p.ID_PERSONA === tempId || p.ID_PERSONA === r.id);
            if (idx >= 0) DB.personas[idx] = Object.assign({}, DB.personas[idx], r.persona);
            else DB.personas.unshift(r.persona);
            SIGC_STORE.set('personas', DB.personas);
            sigcReconstruirIndices('personas');
            renderPersonas();
            llenarSelectores();
          }
        }
        if (form.id === 'formActividad') {
          if (r.actividad) {
            const idx = DB.actividades.findIndex(a => a.ID_ACTIVIDAD === tempId || a.ID_ACTIVIDAD === r.id);
            if (idx >= 0) DB.actividades[idx] = Object.assign({}, DB.actividades[idx], r.actividad);
            else DB.actividades.unshift(r.actividad);
            SIGC_STORE.set('actividades', DB.actividades);
            sigcReconstruirIndices('actividades');
            renderActividades();
            llenarSelectores();
          }
        }
        if (form.id === 'formParticipacion') {
          if (r.participacion) {
            const idx = DB.participaciones.findIndex(p => p.ID_PARTICIPACION === tempId || p.ID_PARTICIPACION === r.id);
            if (idx >= 0) DB.participaciones[idx] = Object.assign({}, DB.participaciones[idx], r.participacion);
            else DB.participaciones.unshift(r.participacion);
            SIGC_STORE.set('participaciones', DB.participaciones);
            sigcReconstruirIndices('participaciones');
            renderParticipaciones();
          }
        }
      })
      .withFailureHandler(error => {
        mostrarCarga(false);
        if (tempId) {
          if (form.id === 'formPersona') {
            DB.personas = DB.personas.filter(p => p.ID_PERSONA !== tempId);
            sigcReconstruirIndices('personas');
            renderPersonas();
          } else if (form.id === 'formActividad') {
            DB.actividades = DB.actividades.filter(a => a.ID_ACTIVIDAD !== tempId);
            sigcReconstruirIndices('actividades');

            sigcReconstruirIndices('participaciones');

        notificar('Error al guardar en Google Sheets: ' + (error.message || String(error)), true);

  let GESTION_MODO_VISTA = 'sesiones';

  function fechaActividadCorta(fechaStr) {
    if (!fechaStr) return '';
    const partes = String(fechaStr).split('-');
    if (partes.length === 3) return `${partes[2]}/${partes[1]}`;
    return String(fechaStr);
  }

  function obtenerSesionesActividadGestion() {
    if (!GESTION || !GESTION.actividad) return [];
    const act = GESTION.actividad;
    let sesiones = [];
    if (act.DETALLE_SESIONES) {
      try {
        sesiones = typeof act.DETALLE_SESIONES === 'string' ? JSON.parse(act.DETALLE_SESIONES) : act.DETALLE_SESIONES;
      } catch (e) { sesiones = []; }
    }
    if (Array.isArray(sesiones) && sesiones.length > 0) {
      return sesiones;
    }
    const total = Math.max(1, Number(act.SESIONES_TOTALES || 1));
    const fInicio = act.FECHA_INICIO || '';
    for (let i = 1; i <= total; i++) {
      sesiones.push({
        numero: i,
        fecha: i === 1 ? fInicio : '',
        horaInicio: '',
        horaFin: ''
      });
    }
    return sesiones;
  }

  function obtenerSesionesAsistidasParticipacion(p) {
    if (!p) return [];
    if (p.ASISTENCIA_SESIONES) {
      try {
        const parsed = typeof p.ASISTENCIA_SESIONES === 'string' ? JSON.parse(p.ASISTENCIA_SESIONES) : p.ASISTENCIA_SESIONES;
        if (Array.isArray(parsed)) {
          return parsed.map(Number);
        }
      } catch (e) {}
    }
    const num = Math.max(0, Number(p.SESIONES_ASISTIDAS || 0));
    const arr = [];
    for (let i = 1; i <= num; i++) arr.push(i);
    return arr;
  }

  function cambiarModoVistaGestion(modo) {

    if (btnCompacto && btnSesiones) {
      if (modo === 'compacta') {

        btnSesiones.classList.remove('active');
      } else {
        btnCompacto.classList.remove('active');
        btnSesiones.classList.add('active');
      }
    }
    renderGestion(true);
  }

  function recalcularResultadoParticipante_(p) {
    if (p.ESTADO_SELECCION !== 'Seleccionado') {
      p.RESULTADO_FINAL = 'Pendiente';
      return;
    }
    const act = GESTION.actividad || {};
    const regla = act.REGLA_RESULTADO || 'Asistencia';
    const exigencia = Number(act.PORCENTAJE_APROBACION || 0.8);
    const total = Number(p.SESIONES_TOTALES || act.SESIONES_TOTALES || 1);
    const asistidas = Number(p.SESIONES_ASISTIDAS || 0);
    const pct = total > 0 ? asistidas / total : 0;
    p.PORCENTAJE_ASISTENCIA = pct;

    if (regla === 'Porcentaje') {
      p.RESULTADO_FINAL = pct >= exigencia ? 'Aprobado' : 'Desaprobado';
    } else {
      p.RESULTADO_FINAL = asistidas > 0 ? 'Participó' : 'No participó';
    }
  }

  function alternarAsistenciaSesion(idParticipacion, numSesion) {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(idParticipacion));
    if (!p) return;
    if (p.ESTADO_SELECCION !== 'Seleccionado') {
      return notificar('Solo se puede registrar asistencia en personas seleccionadas.', true);
    }
    let asistidas = obtenerSesionesAsistidasParticipacion(p);
    numSesion = Number(numSesion);
    if (asistidas.includes(numSesion)) {
      asistidas = asistidas.filter(n => n !== numSesion);
    } else {
      asistidas.push(numSesion);
    }
    asistidas.sort((a, b) => a - b);
    p.ASISTENCIA_SESIONES = JSON.stringify(asistidas);
    p.SESIONES_ASISTIDAS = asistidas.length;

    recalcularResultadoParticipante_(p);

    GESTION_MODIFICADOS.add(String(idParticipacion));
    actualizarKpisGestion();
    renderGestion(false);
  }

  function marcarSesionCompleta(numSesion) {
    const seleccionados = (GESTION.participaciones || []).filter(p => p.ESTADO_SELECCION === 'Seleccionado');
    if (!seleccionados.length) return notificar('No hay personas seleccionadas.', true);
    numSesion = Number(numSesion);

    const todosMarcados = seleccionados.every(p => {
      const arr = obtenerSesionesAsistidasParticipacion(p);
      return arr.includes(numSesion);
    });

    const nuevoEstado = !todosMarcados;
    seleccionados.forEach(p => {
      let arr = obtenerSesionesAsistidasParticipacion(p);
      if (nuevoEstado) {
        if (!arr.includes(numSesion)) arr.push(numSesion);
      } else {
        arr = arr.filter(n => n !== numSesion);
      }
      arr.sort((a, b) => a - b);
      p.ASISTENCIA_SESIONES = JSON.stringify(arr);
      p.SESIONES_ASISTIDAS = arr.length;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });

    actualizarKpisGestion();
    renderGestion(false);
    notificar(nuevoEstado ? `Sesión ${numSesion} marcada para todos los seleccionados.` : `Sesión ${numSesion} desmarcada.`);
  }

  function renderModalAsistenciaContenido_() {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(MODAL_ASIS_PARTICIPACION_ID));
    if (!p) return;
    const sesionesActividad = obtenerSesionesActividadGestion();
    const total = Number(p.SESIONES_TOTALES || GESTION.actividad?.SESIONES_TOTALES || 1);
    const asistidasCount = MODAL_ASIS_SESIONES_TEMP.length;
    const pct = total > 0 ? (asistidasCount / total) * 100 : 0;

    const regla = GESTION.actividad?.REGLA_RESULTADO || 'Asistencia';
    const exigenciaPct = Math.round(Number(GESTION.actividad?.PORCENTAJE_APROBACION || 0.8) * 100);

    texto('modalAsisContador', `${asistidasCount} / ${total}`);
    texto('modalAsisPorcentaje', `${pct.toFixed(0)}%`);
    texto('modalAsisRegla', regla === 'Porcentaje' ? `${exigenciaPct}% min` : 'Asistencia');

    let resultado = 'Pendiente';
    let badgeClase = 'neutral';
    if (p.ESTADO_SELECCION === 'Seleccionado') {
      if (regla === 'Porcentaje') {
        resultado = (pct >= exigenciaPct) ? 'Aprobado' : 'Desaprobado';
        badgeClase = (pct >= exigenciaPct) ? 'success' : 'danger';
      } else {
        resultado = asistidasCount > 0 ? 'Participó' : 'No participó';
        badgeClase = asistidasCount > 0 ? 'success' : 'danger';
      }
    }
    const badge = document.getElementById('modalAsisBadgeResultado');
    if (badge) {
      badge.textContent = resultado;
      badge.className = `badge ${badgeClase}`;
    }

    const lista = document.getElementById('modalAsisListaSesiones');
    if (lista) {
      lista.innerHTML = sesionesActividad.map(s => {
        const presente = MODAL_ASIS_SESIONES_TEMP.includes(Number(s.numero));
        return `
          <div class="modal-asis-row ${presente ? 'is-present' : ''}" onclick="modalAlternarSesion(${s.numero})">
            <div class="modal-asis-info">
              <span class="modal-asis-title">Sesión ${s.numero}</span>
              <span class="modal-asis-subtitle">${s.fecha ? fechaActividadVisible(s.fecha) : 'Fecha por programar'}${s.horaInicio ? ' · ' + s.horaInicio + ' a ' + (s.horaFin || '--:--') : ''}</span>
            </div>
            <div class="modal-asis-switch">
              <span class="badge ${presente ? 'success' : 'neutral'}">${presente ? '✓ Presente' : 'Ausente'}</span>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  function modalAlternarSesion(numSesion) {
    numSesion = Number(numSesion);
    if (MODAL_ASIS_SESIONES_TEMP.includes(numSesion)) {
      MODAL_ASIS_SESIONES_TEMP = MODAL_ASIS_SESIONES_TEMP.filter(n => n !== numSesion);
    } else {
      MODAL_ASIS_SESIONES_TEMP.push(numSesion);
    }
    MODAL_ASIS_SESIONES_TEMP.sort((a, b) => a - b);
    renderModalAsistenciaContenido_();
  }

  function modalMarcarTodasSesiones(estado) {
    const sesionesActividad = obtenerSesionesActividadGestion();
    if (estado) {
      MODAL_ASIS_SESIONES_TEMP = sesionesActividad.map(s => Number(s.numero));
    } else {
      MODAL_ASIS_SESIONES_TEMP = [];
    }
    renderModalAsistenciaContenido_();
  }

  function guardarModalAsistenciaAlumno() {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(MODAL_ASIS_PARTICIPACION_ID));
    if (!p) return;
    p.ASISTENCIA_SESIONES = JSON.stringify(MODAL_ASIS_SESIONES_TEMP);
    p.SESIONES_ASISTIDAS = MODAL_ASIS_SESIONES_TEMP.length;
    recalcularResultadoParticipante_(p);
    GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    cerrarModalAsistenciaAlumno();
    actualizarKpisGestion();
    renderGestion(false);
    notificar('Asistencia actualizada para ' + (p.NOMBRE_COMPLETO || 'el participante') + '.');
  }

  function actualizarKpisGestion() {
    const r = GESTION.resumen || {};
    texto('gInscritos', r.inscritos || 0);
    texto('gSeleccionados', r.seleccionados || 0);
    texto('gConfirmados', r.confirmados || 0);
    texto('gAsistentes', r.asistentes || 0);
    texto('gAprobados', r.aprobados || 0);
  }

  function renderGestion(sincronizarAntes = true) {
    if (sincronizarAntes) {
      sincronizarGestionDesdeTabla();
    }
    const sesionesActividad = obtenerSesionesActividadGestion();
    renderHeaderGestion_(sesionesActividad);

    const tbody = document.getElementById('tablaGestion');
    const q = normalizar(document.getElementById('buscarGestion')?.value || '');
    const filtro = document.getElementById('filtroGestionSeleccion')?.value || '';
    const filas = (GESTION.participaciones || []).filter(p =>
      normalizar([p.NOMBRE_COMPLETO,p.RUT,p.DOCUMENTO,p.EDAD,p.CORREO,p.PARTICIPA_PMJH].join(' ')).includes(q) &&
      (!filtro || p.ESTADO_SELECCION === filtro)
    );

    const colSpanTotal = 13 + (GESTION_MODO_VISTA === 'sesiones' ? sesionesActividad.length : 0);

    if (!filas.length) {
      tbody.innerHTML = `<tr><td colspan="${colSpanTotal}" class="empty-state">${
        GESTION.actividad ? 'No hay participantes que coincidan con el filtro.' : 'Seleccione una actividad para comenzar.'
      }</td></tr>`;
      actualizarCheckPrincipalGestion();
      return;
    }

    const esModoSesiones = GESTION_MODO_VISTA === 'sesiones' && sesionesActividad.length > 0;

    tbody.innerHTML = filas.map(p => {
      const idx = GESTION.participaciones.indexOf(p);
      const id = String(p.ID_PARTICIPACION || '');
      const marcado = GESTION_SELECCIONADOS.has(id) ? 'checked' : '';

      const resultado = p.RESULTADO_FINAL || 'Pendiente';
      let badgeClase = 'neutral';
      if (resultado === 'Aprobado' || resultado === 'Participó') badgeClase = 'success';
      else if (resultado === 'Desaprobado' || resultado === 'No participó') badgeClase = 'danger';
      else if (resultado === 'Pendiente') badgeClase = 'warning';

      const pmjh = p.PARTICIPA_PMJH || 'No informado';
      const pmjhBadge = pmjh === 'Sí' ? 'badge success' : (pmjh === 'No' ? 'badge neutral' : 'badge neutral');

      const totalSes = Number(p.SESIONES_TOTALES || GESTION.actividad?.SESIONES_TOTALES || 1);
      const asistidasNums = obtenerSesionesAsistidasParticipacion(p);
      const totalAsistidas = asistidasNums.length;

      let celdasSesionesHtml = '';
      if (esModoSesiones) {
        celdasSesionesHtml = sesionesActividad.map(s => {
          const presente = asistidasNums.includes(Number(s.numero));
          const deshabilitado = p.ESTADO_SELECCION !== 'Seleccionado';
          return `
            <td class="col-sesion td-center">
              <button
                type="button"
                class="sesion-toggle-pill ${presente ? 'presente' : ''} ${deshabilitado ? 'disabled' : ''}"
                onclick="alternarAsistenciaSesion('${esc(id)}', ${s.numero})"
                title="Sesión ${s.numero}${s.fecha ? ' (' + fechaActividadCorta(s.fecha) + ')' : ''}: ${presente ? 'Presente' : 'Ausente'}"
              >
                ${presente ? '✓' : '—'}
              </button>
            </td>
          `;
        }).join('');
      }

      const campoAsistidasHtml = esModoSesiones
        ? `<div style="display:flex;align-items:center;justify-content:center;gap:6px">
             <strong style="font-size:14px;color:var(--primario)">${totalAsistidas}</strong>
             <button type="button" class="btn-abrir-detalle-asis" onclick="abrirModalAsistenciaAlumno('${esc(id)}')" title="Ver detalle de sesiones">📋</button>
           </div>`
        : `<div style="display:flex;align-items:center;justify-content:center;gap:4px">
             <input data-campo="SESIONES_ASISTIDAS" type="number" min="0" value="${esc(numeroPlano(p.SESIONES_ASISTIDAS,0))}" onchange="registrarCambioGestion(this)" style="width:50px">
             <button type="button" class="btn-abrir-detalle-asis" onclick="abrirModalAsistenciaAlumno('${esc(id)}')" title="Ver desglose por sesión">📋</button>
           </div>`;

      return `<tr data-idx="${idx}" data-id="${esc(id)}">
        <td class="col-check td-center"><input type="checkbox" class="gestion-check" data-id="${esc(id)}" ${marcado} onchange="cambiarSeleccionGestion(this)"></td>
        <td class="col-persona nombre"><strong>${esc(p.NOMBRE_COMPLETO)}</strong><small>${esc(p.CORREO || 'Sin correo')}</small></td>
        <td class="col-doc">${esc(p.DOCUMENTO || p.RUT || '—')}</td>
        <td class="col-edad td-center">${esc(edadVisible(p.EDAD))}</td>
        <td class="col-pmjh td-center"><span class="${pmjhBadge}">${esc(pmjh)}</span></td>
        <td class="col-requisitos">${selectGestion('CUMPLE_REQUISITOS', p.CUMPLE_REQUISITOS, ['Pendiente','Sí','No','No informado'])}</td>
        <td class="col-seleccion">${selectGestion('ESTADO_SELECCION', p.ESTADO_SELECCION, ['Pendiente','Seleccionado','Lista de espera','No seleccionado','No informado'])}</td>
        <td class="col-confirma">${selectGestion('CONFIRMA_PARTICIPACION', p.CONFIRMA_PARTICIPACION, ['No informado','Sí','No'])}</td>
        ${celdasSesionesHtml}
        <td class="col-asistidas td-center">${campoAsistidasHtml}</td>
        <td class="col-total td-center"><input data-campo="SESIONES_TOTALES" type="number" min="1" value="${esc(numeroPlano(p.SESIONES_TOTALES, GESTION.actividad?.SESIONES_TOTALES || 1))}" onchange="registrarCambioGestion(this)"></td>
        <td class="col-resultado td-center"><span class="badge ${badgeClase}">${esc(resultado)}</span></td>
        <td class="col-cert">${selectGestion('CERTIFICADO', p.CERTIFICADO, ['No informado','Sí','No','No aplica'])}</td>
        <td class="col-obs"><input class="obs" data-campo="OBSERVACIONES" placeholder="Observación..." value="${esc(p.OBSERVACIONES || '')}" onchange="registrarCambioGestion(this)"></td>
      </tr>`;
    }).join('');
    actualizarCheckPrincipalGestion();
  }

  function selectGestion(campo, actual, opciones) {
    return `<select data-campo="${campo}" onchange="registrarCambioGestion(this)">` + opciones.map(op =>
      `<option value="${esc(op)}" ${String(actual || '') === String(op) ? 'selected' : ''}>${esc(op || 'Automático')}</option>`
    ).join('') + `</select>`;
  }

  function cambiarSeleccionGestion(checkbox) {
    const id = String(checkbox.dataset.id || '').trim();
    if (!id) return;
    if (checkbox.checked) {
      GESTION_SELECCIONADOS.add(id);
    } else {
      GESTION_SELECCIONADOS.delete(id);
    }
    actualizarCheckPrincipalGestion();
  }

  function actualizarCheckPrincipalGestion() {
    const principal = document.getElementById('checkTodosGestion');
    if (!principal) return;
    const checksVisibles = [
      ...document.querySelectorAll('#tablaGestion .gestion-check')
    ];
    if (!checksVisibles.length) {
      principal.checked = false;
      principal.indeterminate = false;
      return;
    }
    const cantidadMarcados = checksVisibles.filter(function(check) {
      return check.checked;
    }).length;
    principal.checked = cantidadMarcados === checksVisibles.length;
    principal.indeterminate =
      cantidadMarcados > 0 &&
      cantidadMarcados < checksVisibles.length;
  }

  function registrarCambioGestion(control) {
    const tr = control.closest('tr[data-idx]');
    if (!tr) return;
    const idx = Number(tr.dataset.idx);
    const registro = GESTION.participaciones[idx];
    if (!registro) return;
    const campo = control.dataset.campo;
    registro[campo] = control.value;
    if (campo === 'ESTADO_SELECCION' &&
        control.value !== 'Seleccionado') {
      registro.SESIONES_ASISTIDAS = 0;
      registro.ASISTENCIA_SESIONES = '[]';
      const asistencia = tr.querySelector(
        '[data-campo="SESIONES_ASISTIDAS"]'
      );
      if (asistencia) asistencia.value = 0;
    }
    recalcularResultadoParticipante_(registro);
    GESTION_MODIFICADOS.add(String(registro.ID_PARTICIPACION));
  }

  function sincronizarGestionDesdeTabla() {
    document.querySelectorAll('#tablaGestion tr[data-idx]').forEach(tr => {
      const idx = Number(tr.dataset.idx);
      const registro = GESTION.participaciones[idx];
      if (!registro) return;
      tr.querySelectorAll('[data-campo]').forEach(control => {
        registro[control.dataset.campo] = control.value;
      });
      const check = tr.querySelector('.gestion-check');
      if (check) cambiarSeleccionGestion(check);
    });
  }

  function indicesGestionMarcados() {
    sincronizarGestionDesdeTabla();
    return (GESTION.participaciones || [])
      .map((p, i) => GESTION_SELECCIONADOS.has(String(p.ID_PARTICIPACION)) ? i : -1)
      .filter(i => i >= 0);
  }

  function alternarTodosGestion(checkPrincipal) {
    marcarTodosGestion(checkPrincipal.checked);
  }

  function marcarTodosGestion(estado) {
    const checksVisibles = [
      ...document.querySelectorAll('#tablaGestion .gestion-check')
    ];
    checksVisibles.forEach(function(check) {
      const id = String(check.dataset.id || '').trim();
      if (!id) return;
      check.checked = estado;
      if (estado) {
        GESTION_SELECCIONADOS.add(id);
      } else {
        GESTION_SELECCIONADOS.delete(id);
      }
    });
    actualizarCheckPrincipalGestion();
  }

  function aplicarMasivo(campo, idSelector) {
    const valor = document.getElementById(idSelector).value;
    if (!valor) return notificar('Seleccione un valor para aplicar.', true);
    const indices = indicesGestionMarcados();
    if (!indices.length) return notificar('Marque al menos una persona.', true);
    indices.forEach(i => {
      const p = GESTION.participaciones[i];
      p[campo] = valor;
      if (campo === 'ESTADO_SELECCION' &&
          valor !== 'Seleccionado') {
        p.SESIONES_ASISTIDAS = 0;
        p.ASISTENCIA_SESIONES = '[]';
      }
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });
    renderGestion(false);
    notificar('Cambio aplicado a ' + indices.length + ' registros.');
  }

  function marcarAsistenciaCompleta() {
    const indices = indicesGestionMarcados();
    if (!indices.length) return notificar('Marque al menos una persona.', true);
    const seleccionados = indices.filter(i => GESTION.participaciones[i].ESTADO_SELECCION === 'Seleccionado');
    if (!seleccionados.length) return notificar('La asistencia solo puede aplicarse a personas seleccionadas.', true);
    const sesionesActividad = obtenerSesionesActividadGestion();
    const todasLasSesiones = sesionesActividad.map(s => Number(s.numero));

    seleccionados.forEach(i => {
      const p = GESTION.participaciones[i];
      p.ASISTENCIA_SESIONES = JSON.stringify(todasLasSesiones);
      p.SESIONES_ASISTIDAS = todasLasSesiones.length;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });
    actualizarKpisGestion();
    renderGestion(false);
    notificar('Asistencia al 100% registrada para ' + seleccionados.length + ' participantes.');
  }

  function marcarAsistenciaCero() {
    const indices = indicesGestionMarcados();
    if (!indices.length) {
      return notificar('Marque al menos una persona.', true);
    }
    indices.forEach(i => {
      const p = GESTION.participaciones[i];
      p.ASISTENCIA_SESIONES = '[]';
      p.SESIONES_ASISTIDAS = 0;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });
    actualizarKpisGestion();
    renderGestion(false);
    notificar('Asistencia establecida en 0 para ' + indices.length + ' registros.');
  }

  function guardarGestion() {
    if (!GESTION.actividad) return notificar('Primero cargue una actividad.', true);
    sincronizarGestionDesdeTabla();
    const registros = GESTION.participaciones
      .filter(p => GESTION_MODIFICADOS.has(String(p.ID_PARTICIPACION)))
      .map(p => ({
        ID_PARTICIPACION: p.ID_PARTICIPACION,
        CUMPLE_REQUISITOS: p.CUMPLE_REQUISITOS,
        ESTADO_SELECCION: p.ESTADO_SELECCION,
        CONFIRMA_PARTICIPACION: p.CONFIRMA_PARTICIPACION,
        SESIONES_ASISTIDAS: p.SESIONES_ASISTIDAS,
        ASISTENCIA_SESIONES: p.ASISTENCIA_SESIONES || '',
        SESIONES_TOTALES: p.SESIONES_TOTALES,
        CERTIFICADO: p.CERTIFICADO,
        OBSERVACIONES: p.OBSERVACIONES
      }));
    if (!registros.length) {
      return notificar('No hay cambios pendientes para guardar.', true);
    }

    // Actualización optimista local inmediata (0 ms)
    registros.forEach(reg => {
      const idxDb = DB.participaciones.findIndex(p => p.ID_PARTICIPACION === reg.ID_PARTICIPACION);
      if (idxDb >= 0) {
        DB.participaciones[idxDb] = Object.assign({}, DB.participaciones[idxDb], reg);
      }
    });
    sigcReconstruirIndices('participaciones');
    GESTION_MODIFICADOS.clear();
    actualizarKpisGestion();
    renderGestion(false);
    notificar('Cambios aplicados localmente. Sincronizando con Google Sheets…');
    actualizarEstadoSincronizacion('syncing', 'Guardando gestión y asistencia en segundo plano…');

    google.script.run
      .withSuccessHandler(r => {
        notificar(r.mensaje || 'Gestión guardada exitosamente.');
        actualizarEstadoSincronizacion('saved', '✓ Asistencia y gestión guardada en Google Sheets');
        SIGC_STORE.set('participaciones', DB.participaciones);
      })
      .withFailureHandler(error => {
        notificar('Error al guardar en Google Sheets: ' + (error.message || String(error)), true);
        actualizarEstadoSincronizacion('error', 'Error al guardar gestión');
      })
      .guardarGestionMasiva({
        idActividad: GESTION.actividad.ID_ACTIVIDAD,
        registros
      });
  }
  function cargarFormularios(forzar=false) {
    mostrarCarga(true, forzar ? 'Actualizando formularios…' : 'Cargando formularios…');
    google.script.run
      .withSuccessHandler(datos => {
        mostrarCarga(false);
        FORMULARIOS = Array.isArray(datos?.formularios) ? datos.formularios : [];
        CAPACIDAD_FORMULARIOS = datos?.capacidad || {};
        FORMULARIO_INTERESES = datos?.formularioIntereses || null;
        texto('estadoActualizacionFormularios',
          `${datos?.desdeCache ? 'Resumen rápido' : 'Conteos actualizados'}${datos?.fechaActualizacion ? ': ' + datos.fechaActualizacion : ''}`);
        renderFormularios();
        renderFormularioIntereses();
      })
      .withFailureHandler(error => {
        mostrarCarga(false);
        notificar(error.message || String(error), true);
      })
      .obtenerPanelFormularios(forzar === true);
  }
  function renderFormularios() {
    const activos = FORMULARIOS.filter(f => normalizar(f.estado) === 'activo').length;
    const procesadas = FORMULARIOS.reduce((s,f) => s + Number(f.resumen?.procesadas || 0) + Number(f.resumen?.duplicadas || 0), 0);
    const advertencias = FORMULARIOS.reduce((s,f) => s + Number(f.resumen?.advertencias || 0), 0);
    const revisiones = FORMULARIOS.reduce((s,f) => s + Number(f.resumen?.revision || 0), 0);
    texto('fActivos', activos);
    texto('fArchivosActivos', CAPACIDAD_FORMULARIOS.archivosRespuestaActivos || 0);
    texto('fTriggers', `${CAPACIDAD_FORMULARIOS.activadoresUtilizados || 0} / ${CAPACIDAD_FORMULARIOS.limiteTecnico || 20}`);
    texto('fDisponibles', CAPACIDAD_FORMULARIOS.activadoresDisponibles ?? 20);
    texto('fFormsPorTrigger', Number(CAPACIDAD_FORMULARIOS.formulariosPorActivador || 0).toFixed(1));
    texto('fProcesadas', procesadas);
    texto('fAdvertencias', advertencias);
    texto('fRevision', revisiones);
    const alerta = document.getElementById('alertaCapacidadFormularios');
    if (alerta) { alerta.hidden = !CAPACIDAD_FORMULARIOS.alerta; alerta.textContent = CAPACIDAD_FORMULARIOS.alerta || ''; }
    const tbody = document.getElementById('tablaFormularios');
    if (!tbody) return;
    if (!FORMULARIOS.length) {
      tbody.innerHTML = '<tr><td colspan="10" class="empty-state">Todavía no hay formularios vinculados.</td></tr>';
      return;
    }
    tbody.innerHTML = FORMULARIOS.map(f => {
      const r = f.resumen || {};
      const detalles = (r.detallesRevision || []).map(x => `Fila ${esc(x.fila || '—')}: ${esc(x.detalle)}`);
      if (Number(r.pendientes || 0)) detalles.unshift(`${esc(r.pendientes)} respuesta(s) pendiente(s) de recuperar.`);
      const detalle = detalles.join('<br>') || '—';
      const activo = normalizar(f.estado) === 'activo';
      const automatizacion = f.activador || {estado: activo ? 'Sin diagnóstico' : 'No requerido', operativo: !activo};
      return `<tr>
        <td><strong>${esc(f.actividad)}</strong><br><span class="muted">${esc(f.idActividad)}</span></td>
        <td>${esc(f.archivo)}<br><span class="muted">${esc(f.hoja)}</span></td>
        <td><span class="badge">${esc(f.estado)}</span></td>
        <td><span class="badge">${esc(automatizacion.estado)}</span></td>
        <td>${esc(r.total || 0)}</td>
        <td>${esc((r.procesadas || 0) + (r.duplicadas || 0))}</td>
        <td>${esc(r.advertencias || 0)}</td>
        <td>${esc(r.revision || 0)}</td>
        <td>${detalle}</td>
        <td>
          <button class="btn secondary compact" type="button" data-id="${esc(f.idConfig)}" onclick="cargarCasosRevision(this.dataset.id)" ${(r.revision || 0) ? '' : 'disabled'}>Ver casos (${esc(r.revision || 0)})</button>
          <button class="btn secondary compact" type="button" data-id="${esc(f.idConfig)}" onclick="repararYRecuperarFormularioWeb(this.dataset.id)" ${activo ? '' : 'disabled'}>Reparar y recuperar</button>
          <button class="btn secondary compact" type="button" data-id="${esc(f.idConfig)}" data-activo="${activo ? '0' : '1'}" onclick="cambiarEstadoFormularioWeb(this.dataset.id,this.dataset.activo)">${activo ? 'Desactivar' : 'Activar'}</button>
        </td>
      </tr>`;
    }).join('');
  }
  function renderFormularioIntereses() {
    const estado = document.getElementById('estadoFormularioIntereses');
    const crear = document.getElementById('btnCrearFormularioIntereses');
    const copiar = document.getElementById('btnCopiarFormularioIntereses');
    const abrir = document.getElementById('linkAbrirFormularioIntereses');
    const editar = document.getElementById('linkEditarFormularioIntereses');
    const respuestas = document.getElementById('linkRespuestasFormularioIntereses');
    if (!estado || !crear) return;
    const existe = Boolean(FORMULARIO_INTERESES?.formId && FORMULARIO_INTERESES?.urlPublica);
    const operativo = existe && normalizar(FORMULARIO_INTERESES.estado) === 'activo' &&
      FORMULARIO_INTERESES.activador?.operativo !== false;
    estado.textContent = operativo
      ? `Formulario operativo · ${FORMULARIO_INTERESES.resumen?.total || 0} respuesta(s) recibida(s).`
      : (existe
        ? 'El formulario existe, pero su vinculación o automatización no está activa. Use Reparar y recuperar o Activar en la tabla inferior.'
        : 'Aún no se ha creado el formulario institucional. Esta operación se realiza una sola vez.');
    crear.textContent = existe ? 'Verificar formulario y automatización' : 'Crear formulario institucional';
    [copiar, abrir, editar, respuestas].forEach(elemento => { if (elemento) elemento.hidden = !existe; });
    if (!existe) return;
    abrir.href = FORMULARIO_INTERESES.urlPublica;
    editar.href = FORMULARIO_INTERESES.urlEdicion;
    respuestas.href = FORMULARIO_INTERESES.urlRespuestas;
  }
  function crearFormularioInteresesWeb() {
    const mensaje = FORMULARIO_INTERESES
      ? 'Se verificará el formulario existente y su automatización.'

    const detalleCampos = ['ID_ACTIVIDAD','NOMBRE_ACTIVIDAD','ANO','ESCUELA_LINEA','AREA_TEMATICA','INSTITUCION_ASOCIADA','MODALIDAD','ESTADO_ACTIVIDAD','CUPOS','INSCRIPCIONES','SELECCIONADAS','ASISTENTES'];

    const hojaGenero = tabla('Demografia', ['Dimensión','Categoría','Cantidad'], [].concat((reporte.porGenero||[]).map(x=>['Género',x.nombre,x.valor]),(reporte.porTramoEdad||[]).map(x=>['Tramo de edad',x.nombre,x.valor]),(reporte.porComuna||[]).map(x=>['Comuna',x.nombre,x.valor]),(reporte.porPMJH||[]).map(x=>['PMJH',x.nombre,x.valor])));

  function leerTablaImportacion() {
    const textoPegado = document.getElementById('importTexto')?.value || '';
    if (!textoPegado.trim()) return notificar('Pegue primero una tabla con encabezados.', true);
    const matriz = parsearTablaPegada_(textoPegado);
    if (matriz.length < 2) return notificar('La tabla debe incluir encabezados y al menos una fila.', true);
    const ancho = Math.max(...matriz.map(fila => fila.length));
    IMPORTACION.encabezados = matriz[0].map((valor, indice) => String(valor || `Columna ${indice + 1}`).trim());
    while (IMPORTACION.encabezados.length < ancho) IMPORTACION.encabezados.push(`Columna ${IMPORTACION.encabezados.length + 1}`);
    IMPORTACION.filas = matriz.slice(1)
      .filter(fila => fila.some(valor => String(valor || '').trim()))
      .map(fila => IMPORTACION.encabezados.map((_, indice) => fila[indice] ?? ''));
    if (IMPORTACION.filas.length > 250) {
      IMPORTACION.filas = IMPORTACION.filas.slice(0, 250);
      notificar('Se cargaron las primeras 250 filas. El resto debe importarse en un segundo lote.', true);
    }
    renderMapeoImportacion_();
    const panel = document.getElementById('panelMapeoImportacion');
    panel.hidden = false;
    panel.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function parsearTablaPegada_(textoPegado) {
    const primeraLinea = String(textoPegado).split(/\r?\n/).find(linea => linea.trim()) || '';
    const candidatos = ['\t',';',','];
    const delimitador = candidatos.sort((a,b) => primeraLinea.split(b).length - primeraLinea.split(a).length)[0];
    const filas = [];
    let fila = [], celda = '', entreComillas = false;
    const texto = String(textoPegado).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for (let i = 0; i < texto.length; i++) {
      const caracter = texto[i];
      if (caracter === '"') {
        if (entreComillas && texto[i + 1] === '"') { celda += '"'; i++; }
        else entreComillas = !entreComillas;
      } else if (caracter === delimitador && !entreComillas) {
        fila.push(celda.trim()); celda = '';
      } else if (caracter === '\n' && !entreComillas) {
        fila.push(celda.trim()); filas.push(fila); fila = []; celda = '';
      } else {
        celda += caracter;
      }
    }
    fila.push(celda.trim());
    if (fila.some(valor => valor !== '')) filas.push(fila);
    return filas;
  }

  function sugerirCampoImportacion_(encabezado) {
    const h = normalizar(encabezado);
    if (/nombre completo|nombres y apellidos|nombre y apellido/.test(h)) return 'NOMBRE_COMPLETO';
    if (/^nombre$|^nombres$/.test(h)) return 'NOMBRES';
    if (/apellido/.test(h)) return 'APELLIDOS';
    if (/tipo.*document/.test(h)) return 'TIPO_DOCUMENTO';
    if (/pasaporte|dni|numero.*document/.test(h)) return 'NUMERO_DOCUMENTO';
    if (/(^|\s)(rut|run)(\s|$)/.test(h)) return 'RUT';
    if (/correo|email|mail/.test(h)) return 'CORREO';
    if (/telefono|celular|fono/.test(h)) return 'TELEFONO';
    if (/comuna/.test(h)) return 'COMUNA';
    if (/nacionalidad/.test(h)) return 'NACIONALIDAD';
    if (/pmjh|jefas de hogar/.test(h)) return 'PARTICIPA_PMJH';
    if (/fecha.*inscrip|marca temporal|timestamp/.test(h)) return 'FECHA_INSCRIPCION';
    if (/confirm/.test(h)) return 'CONFIRMA_PARTICIPACION';
    if (/sesiones.*asist|clases.*asist/.test(h)) return 'SESIONES_ASISTIDAS';
    if (/sesiones.*total|clases.*total/.test(h)) return 'SESIONES_TOTALES';
    if (/certific/.test(h)) return 'CERTIFICADO';
    if (/observ|coment/.test(h)) return 'OBSERVACIONES';
    return '';
  }

  function renderMapeoImportacion_() {
    const sugerencias = {};
    IMPORTACION.encabezados.forEach((encabezado, indice) => {
      const campo = sugerirCampoImportacion_(encabezado);
      if (campo && sugerencias[campo] === undefined) sugerencias[campo] = indice;
    });
    IMPORTACION.mapeo = sugerencias;
    texto('importColumnasDetectadas', `${IMPORTACION.encabezados.length} columna(s) y ${IMPORTACION.filas.length} fila(s) detectadas. Confirme las equivalencias.`);
    const opciones = '<option value="-1">No utilizar</option>' + IMPORTACION.encabezados
      .map((encabezado, indice) => `<option value="${indice}">${esc(encabezado)}</option>`).join('');
    document.getElementById('mapeoImportacion').innerHTML = CAMPOS_IMPORTACION.map(([campo, etiqueta]) => `<div class="field">
      <label>${esc(etiqueta)}</label>
      <select id="map_${campo}">${opciones}</select>
    </div>`).join('');
    CAMPOS_IMPORTACION.forEach(([campo]) => {
      const selector = document.getElementById(`map_${campo}`);
      selector.value = String(sugerencias[campo] ?? -1);
      selector.addEventListener('change', () => {
        IMPORTACION.analisis = null;
        document.getElementById('btnConfirmarImportacion').disabled = true;
      });
    });
    document.getElementById('resumenImportacion').hidden = true;
    document.getElementById('btnConfirmarImportacion').disabled = true;
    document.getElementById('tablaVistaPreviaImportacion').innerHTML = '<tr><td colspan="5" class="empty-state">Relacione las columnas y analice el listado.</td></tr>';
  }

  function construirPayloadImportacion_() {
    const mapeo = {};
    CAMPOS_IMPORTACION.forEach(([campo]) => {
      mapeo[campo] = Number(document.getElementById(`map_${campo}`)?.value ?? -1);
    });
    if (mapeo.NOMBRE_COMPLETO < 0 && (mapeo.NOMBRES < 0 || mapeo.APELLIDOS < 0)) {
      throw new Error('Debe relacionar Nombre completo o las columnas Nombres y Apellidos.');
    }
    if (mapeo.RUT < 0 && mapeo.NUMERO_DOCUMENTO < 0) throw new Error('Debe relacionar RUT u Otro documento.');
    return {
      idActividad: document.getElementById('importActividad')?.value || '',
      encabezados: IMPORTACION.encabezados,
      filas: IMPORTACION.filas,
      mapeo,
      valoresGenerales: {
        TIPO_DOCUMENTO: document.getElementById('importTipoDocumento')?.value || 'RUT',
        SESIONES_TOTALES: document.getElementById('importSesionesTotales')?.value || '1',
        SESIONES_ASISTIDAS: document.getElementById('importSesionesAsistidas')?.value || '0',
        CONFIRMA_PARTICIPACION: document.getElementById('importConfirma')?.value || 'No informado',
        CERTIFICADO: document.getElementById('importCertificado')?.value || 'No informado',
        finalizarResultado: document.getElementById('importFinalizar')?.value || 'false'
      }
    };
  }
