            const idx = DB.personas.findIndex(p => p.ID_PERSONA === tempId || p.ID_PERSONA === r.id);
            if (idx >= 0) DB.personas[idx] = Object.assign({}, DB.personas[idx], r.persona);
            else DB.personas.unshift(r.persona);
            SIGC_STORE.set('personas', DB.personas);
            sigcReconstruirIndices('personas');
            renderPersonas();
            llenarSelectores();
          }
        }
        if (form.id === 'formActividad') {
          if (r.actividad) {
            const targetId = String(r.id || '').trim();
            const idx = DB.actividades.findIndex(a => a.ID_ACTIVIDAD === tempId || String(a.ID_ACTIVIDAD || '').trim() === targetId);
            if (idx >= 0) DB.actividades[idx] = Object.assign({}, DB.actividades[idx], r.actividad);
            else DB.actividades.unshift(r.actividad);
            SIGC_STORE.set('actividades', DB.actividades);
            sigcReconstruirIndices('actividades');
            renderActividades();
            renderCalendario();
            llenarSelectores();
          }
        }
        if (form.id === 'formParticipacion') {
          if (r.participacion) {
            const idx = DB.participaciones.findIndex(p => p.ID_PARTICIPACION === tempId || p.ID_PARTICIPACION === r.id);
            if (idx >= 0) DB.participaciones[idx] = Object.assign({}, DB.participaciones[idx], r.participacion);
            else DB.participaciones.unshift(r.participacion);
            SIGC_STORE.set('participaciones', DB.participaciones);
            sigcReconstruirIndices('participaciones');
            renderParticipaciones();
          }
          if (typeof deseleccionarPersonaReg === 'function') {
            deseleccionarPersonaReg();
          }
          if (typeof deseleccionarActividadGen === 'function') {
            deseleccionarActividadGen('RegPart', false);
          }
          refrescarResumenDashboardSilencioso_();
        }
      })
      .withFailureHandler(error => {
        mostrarCarga(false);
        if (tempId) {
          if (form.id === 'formPersona') {
            DB.personas = DB.personas.filter(p => p.ID_PERSONA !== tempId);
            sigcReconstruirIndices('personas');
            renderPersonas();
          } else if (form.id === 'formActividad') {
            DB.actividades = DB.actividades.filter(a => a.ID_ACTIVIDAD !== tempId);
            sigcReconstruirIndices('actividades');
            renderActividades();
          } else if (form.id === 'formParticipacion') {
            DB.participaciones = DB.participaciones.filter(p => p.ID_PARTICIPACION !== tempId);
            sigcReconstruirIndices('participaciones');
            renderParticipaciones();
          }
        }
        notificar('Error al guardar en Google Sheets: ' + (error.message || String(error)), true);
        actualizarEstadoSincronizacion('error', 'Error al guardar');
      })[funcion](datos);
  }

  let GESTION_PETICION_TOKEN = 0;

  function alCambiarActividadGestion(idActividad) {
    actualizarActividadAsistenciaSeleccionada();
    if (typeof actualizarCardActividadGestionUI === 'function') {
      actualizarCardActividadGestionUI(idActividad);
    }
    if (!idActividad) {
      limpiarVistaGestionVacia();
      return;
    }
    cargarGestionActividad(false);
  }

  function limpiarVistaGestionVacia() {
    GESTION_PETICION_TOKEN = Date.now();
    GESTION = {actividad:null, participaciones:[], resumen:{}};
    GESTION_SELECCIONADOS.clear();
    GESTION_MODIFICADOS.clear();
    ['gInscritos','gCupos','gSeleccionados','gVacantes','gConfirmados','gAsistentes','gAprobados'].forEach(id => texto(id, 0));
    texto('gSatisfaccion', '—');
    actualizarBannerActividadGestion(null, 'vacio');
    if (typeof actualizarCardActividadGestionUI === 'function') {
      const selVal = document.getElementById('gestionActividad')?.value;
      if (!selVal) actualizarCardActividadGestionUI(null);
    }
    const tbody = document.getElementById('tablaGestion');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="15" class="empty-state">Seleccione una actividad en el selector superior para ver y gestionar sus participantes.</td></tr>';
    }
    const contadorEl = document.getElementById('contadorGestionFiltrados');
    if (contadorEl) contadorEl.textContent = '';
  }

  function actualizarBannerActividadGestion(actividad, estado, totalParticipantes = 0, mensajeError = '') {
    const banner = document.getElementById('bannerActividadEnGestion');
    const nombreEl = document.getElementById('gestionActividadNombreBanner');
    const idBadge = document.getElementById('gestionActividadIdBadge');
    const subBanner = document.getElementById('gestionActividadSubBanner');
    const syncText = document.getElementById('gestionSyncStatusText');
    if (!banner || !nombreEl) return;

    banner.className = 'gestion-active-card ' + (estado || 'vacio');

    if (estado === 'vacio' || !actividad || !actividad.ID_ACTIVIDAD) {
      nombreEl.textContent = 'Ninguna actividad seleccionada';
      if (idBadge) idBadge.style.display = 'none';
      if (subBanner) subBanner.textContent = 'Seleccione una actividad en el selector superior para ver y gestionar a sus participantes.';
      if (syncText) syncText.textContent = 'Sin actividad';
      return;
    }

    const nombre = actividad.NOMBRE_ACTIVIDAD || actividad.ID_ACTIVIDAD || 'Actividad';
    const id = actividad.ID_ACTIVIDAD || '';

    nombreEl.textContent = nombre;
    if (idBadge) {
      idBadge.textContent = id;
      idBadge.style.display = id ? 'inline-block' : 'none';
    }

    const ahora = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

    if (estado === 'cargando') {
      if (subBanner) subBanner.innerHTML = '<span style="color:#b45309">⏳ Descargando participantes actualizados desde Google Sheets... Por favor espere.</span>';
      if (syncText) syncText.textContent = 'Cargando datos...';
    } else if (estado === 'error') {
      if (subBanner) subBanner.innerHTML = `<span style="color:#b91c1c">❌ Error de carga: ${esc(mensajeError || 'No se pudieron obtener los datos')}</span>`;
      if (syncText) syncText.textContent = 'Error de carga';
    } else {
      const cupos = Number(actividad.CUPOS || actividad.CUPOS_TOTALES || GESTION.resumen?.cupos || 0);
      const cuposTexto = cupos > 0 ? `${cupos} cupos totales` : 'Cupos sin límite';
      const sesionesTexto = actividad.SESIONES_TOTALES ? ` · ${actividad.SESIONES_TOTALES} sesión(es)` : '';
      if (subBanner) {
        subBanner.innerHTML = `<strong>${totalParticipantes}</strong> participante(s) en nómina · ${cuposTexto}${sesionesTexto} · <span style="color:#047857;font-weight:600">✓ Sincronizado ${ahora}</span>`;
      }
      if (syncText) syncText.textContent = `Actualizado ${ahora}`;
    }
  }

  function cargarGestionActividad(forzarServidor = false) {
    const selector = document.getElementById('gestionActividad');
    const idActividad = selector?.value;
    if (!idActividad) {
      notificar('Debe seleccionar una actividad.', true);
      limpiarVistaGestionVacia();
      return;
    }

    const opcion = selector.selectedOptions?.[0];
    let nombreOpcion = opcion ? opcion.textContent.replace(/^CAP-\d{4}-\d+\s*[—–-]\s*/i, '').replace(/^ACT-\d+\s*[—–-]\s*/i, '').trim() : idActividad;
    nombreOpcion = formatearNombreCapacitacion(nombreOpcion);

    // Generar un token único para esta petición (evita condiciones de carrera / race conditions)
    GESTION_PETICION_TOKEN = Date.now();
    const currentToken = GESTION_PETICION_TOKEN;

    // 1. INMEDIATAMENTE LIMPIAR LA GESTIÓN ANTERIOR para que jamás se vean participantes de otra actividad
    GESTION = {
      actividad: { ID_ACTIVIDAD: idActividad, NOMBRE_ACTIVIDAD: nombreOpcion },
      participaciones: [],
      resumen: {}
    };
    GESTION_SELECCIONADOS.clear();
    GESTION_MODIFICADOS.clear();
    ['gInscritos','gCupos','gSeleccionados','gVacantes','gConfirmados','gAsistentes','gAprobados','gSatisfaccion'].forEach(id => texto(id, '—'));

    // 2. Mostrar estado de carga explícito en el banner y en la tabla
    actualizarBannerActividadGestion({ ID_ACTIVIDAD: idActividad, NOMBRE_ACTIVIDAD: nombreOpcion }, 'cargando');

    const tbody = document.getElementById('tablaGestion');
    if (tbody) {
      tbody.innerHTML = `
        <tr>
          <td colspan="15" class="empty-state" style="padding:42px 20px;">
            <div style="display:inline-flex;flex-direction:column;align-items:center;gap:10px;">
              <span class="spinner" style="width:30px;height:30px;border-width:3px;"></span>
              <strong style="font-size:15px;color:var(--azul);">Cargando participantes de "${esc(nombreOpcion)}"...</strong>
              <span style="font-size:12px;color:var(--gris);">Obteniendo la lista oficial más reciente desde Google Sheets (ID: ${esc(idActividad)}).</span>
            </div>
          </td>
        </tr>
      `;
    }

    actualizarEstadoSincronizacion('syncing', 'Cargando ' + idActividad + '…');

    google.script.run
      .withSuccessHandler(datos => {
        // Descartar si el usuario ya cambió a otra actividad mientras esta cargaba
        if (currentToken !== GESTION_PETICION_TOKEN || document.getElementById('gestionActividad')?.value !== idActividad) {
          console.warn('Respuesta de actividad descartada porque la selección cambió:', idActividad);
          return;
        }

        GESTION = datos || { actividad: { ID_ACTIVIDAD: idActividad, NOMBRE_ACTIVIDAD: nombreOpcion }, participaciones: [], resumen: {} };
        GESTION_SELECCIONADOS.clear();
        GESTION_MODIFICADOS.clear();

        // Actualizar caché de índice local para esta actividad específica
        if (typeof SIGC_INDEX !== 'undefined' && SIGC_INDEX.participacionesPorActividad) {
          SIGC_INDEX.participacionesPorActividad.set(idActividad, GESTION.participaciones || []);
        }

        actualizarKpisGestion();
        renderGestion(false);
        actualizarBannerActividadGestion(GESTION.actividad, 'listo', (GESTION.participaciones || []).length);
        actualizarEstadoSincronizacion('saved', 'Gestión al día');
      })
      .withFailureHandler(error => {
        if (currentToken !== GESTION_PETICION_TOKEN) return;
        actualizarBannerActividadGestion({ ID_ACTIVIDAD: idActividad, NOMBRE_ACTIVIDAD: nombreOpcion }, 'error', 0, error.message);
        notificar('Error al cargar participantes: ' + (error.message || String(error)), true);
        actualizarEstadoSincronizacion('error', 'Error al cargar gestión');
      })
      .obtenerGestionActividad(idActividad, forzarServidor === true);
  }
  let GESTION_MODO_VISTA = 'sesiones';
  let MODAL_ASIS_PARTICIPACION_ID = null;
  let MODAL_ASIS_SESIONES_TEMP = [];

  function fechaActividadCorta(fechaStr) {
    if (!fechaStr) return '';
    const partes = String(fechaStr).split('-');
    if (partes.length === 3) return `${partes[2]}/${partes[1]}`;
    return String(fechaStr);
  }

  function obtenerSesionesActividadGestion() {
    if (!GESTION || !GESTION.actividad) return [];
    const act = GESTION.actividad;
    let sesiones = [];
    if (act.DETALLE_SESIONES) {
      try {
        sesiones = typeof act.DETALLE_SESIONES === 'string' ? JSON.parse(act.DETALLE_SESIONES) : act.DETALLE_SESIONES;
      } catch (e) { sesiones = []; }
    }
    const maxPart = (GESTION.participaciones || []).reduce((m, p) => {
      return Math.max(m, Number(p.SESIONES_TOTALES || 0), Number(p.SESIONES_ASISTIDAS || 0));
    }, 0);
    const total = Math.max(1, Number(act.SESIONES_TOTALES || 1), maxPart);
    if (!Array.isArray(sesiones)) sesiones = [];
    const fInicio = act.FECHA_INICIO || '';
    for (let i = sesiones.length + 1; i <= total; i++) {
      sesiones.push({
        numero: i,
        fecha: i === 1 ? fInicio : '',
        horaInicio: '',
        horaFin: ''
      });
    }
    return sesiones;
  }

  function obtenerSesionesAsistidasParticipacion(p) {
    if (!p) return [];
    if (p.ASISTENCIA_SESIONES) {
      try {
        const parsed = typeof p.ASISTENCIA_SESIONES === 'string' ? JSON.parse(p.ASISTENCIA_SESIONES) : p.ASISTENCIA_SESIONES;
        if (Array.isArray(parsed)) {
          return parsed.map(Number);
        }
      } catch (e) {}
    }
    const num = Math.max(0, Number(p.SESIONES_ASISTIDAS || 0));
    const arr = [];
    for (let i = 1; i <= num; i++) arr.push(i);
    return arr;
  }

  function cambiarModoVistaGestion(modo) {
    GESTION_MODO_VISTA = modo;
    const btnCompacto = document.getElementById('btnAsisModoCompacto');
    const btnSesiones = document.getElementById('btnAsisModoSesiones');
    if (btnCompacto && btnSesiones) {
      if (modo === 'compacta') {
        btnCompacto.classList.add('active');
        btnSesiones.classList.remove('active');
      } else {
        btnCompacto.classList.remove('active');
        btnSesiones.classList.add('active');
      }
    }
    renderGestion(true);
  }

  function recalcularResultadoParticipante_(p) {
    if (p.ESTADO_SELECCION !== 'Seleccionado') {
      p.RESULTADO_FINAL = 'Pendiente';
      return;
    }
    const act = GESTION.actividad || {};
    const regla = act.REGLA_RESULTADO || 'Asistencia';
    const exigencia = Number(act.PORCENTAJE_APROBACION || 0.8);
    const total = Number(act.SESIONES_TOTALES || p.SESIONES_TOTALES || 1);
    p.SESIONES_TOTALES = total;
    const asistidas = Number(p.SESIONES_ASISTIDAS || 0);
    const pct = total > 0 ? asistidas / total : 0;
    p.PORCENTAJE_ASISTENCIA = pct;

    if (regla === 'Porcentaje') {
      p.RESULTADO_FINAL = pct >= exigencia ? 'Aprobado' : 'Desaprobado';
    } else {
      p.RESULTADO_FINAL = asistidas > 0 ? 'Participó' : 'No participó';
    }
  }

  function alternarAsistenciaSesion(idParticipacion, numSesion) {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(idParticipacion));
    if (!p) return;
    if (p.ESTADO_SELECCION !== 'Seleccionado') {
      notificar('Solo se puede registrar asistencia a participantes en estado "Seleccionado". Cambie su estado en la columna Selección.', true);
      return;
    }
    let asistidas = obtenerSesionesAsistidasParticipacion(p);
    numSesion = Number(numSesion);
    if (asistidas.includes(numSesion)) {
      asistidas = asistidas.filter(n => n !== numSesion);
    } else {
      asistidas.push(numSesion);
    }
    asistidas.sort((a, b) => a - b);
    p.ASISTENCIA_SESIONES = JSON.stringify(asistidas);
    p.SESIONES_ASISTIDAS = asistidas.length;

    recalcularResultadoParticipante_(p);

    GESTION_MODIFICADOS.add(String(idParticipacion));
    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    programarAutoGuardadoGestion();
  }

  function marcarSesionCompleta(numSesion) {
    const seleccionados = (GESTION.participaciones || []).filter(p => p.ESTADO_SELECCION === 'Seleccionado');
    if (!seleccionados.length) {
      return notificar('No hay personas en estado "Seleccionado". La asistencia por sesión solo aplica a participantes seleccionados.', true);
    }
    numSesion = Number(numSesion);

    const todosMarcados = seleccionados.every(p => {
      const arr = obtenerSesionesAsistidasParticipacion(p);
      return arr.includes(numSesion);
    });

    const nuevoEstado = !todosMarcados;
    seleccionados.forEach(p => {
      let arr = obtenerSesionesAsistidasParticipacion(p);
      if (nuevoEstado) {
        if (!arr.includes(numSesion)) arr.push(numSesion);
      } else {
        arr = arr.filter(n => n !== numSesion);
      }
      arr.sort((a, b) => a - b);
      p.ASISTENCIA_SESIONES = JSON.stringify(arr);
      p.SESIONES_ASISTIDAS = arr.length;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });

    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    programarAutoGuardadoGestion();
    notificar(nuevoEstado ? `Sesión ${numSesion} marcada para participantes seleccionados (${seleccionados.length} personas).` : `Sesión ${numSesion} desmarcada.`);
  }

  function renderHeaderGestion_(sesionesActividad) {
    const thead = document.getElementById('headTablaGestion');
    if (!thead) return;
    const esModoSesiones = GESTION_MODO_VISTA === 'sesiones' && sesionesActividad.length > 0;

    let columnasSesionesHtml = '';
    if (esModoSesiones) {
      columnasSesionesHtml = sesionesActividad.map(s => `
        <th class="col-sesion">
          <div class="sesion-header-cell">
            <span class="sesion-header-num">S${s.numero}</span>
            <span class="sesion-header-date">${s.fecha ? fechaActividadCorta(s.fecha) : ''}</span>
            <button type="button" class="btn-mark-sesion-col" onclick="marcarSesionCompleta(${s.numero})" title="Alternar asistencia para todos los seleccionados">☑ Todos</button>
          </div>
        </th>
      `).join('');
    }

    thead.innerHTML = `
      <tr>
        <th class="col-check">
          <input
            id="checkTodosGestion"
            type="checkbox"
            title="Marcar o desmarcar participantes visibles"
            onchange="alternarTodosGestion(this)"
          >
        </th>
        <th class="col-persona">Persona</th>
        <th class="col-doc">Documento</th>
        <th class="col-telefono th-center">Teléfono</th>
        <th class="col-pmjh th-center">PMJH</th>
        <th class="col-requisitos">Cumple requisitos</th>
        <th class="col-seleccion">Selección</th>
        <th class="col-confirma">Confirmación</th>
        ${columnasSesionesHtml}
        <th class="col-asistidas th-center">Asistidas</th>
        <th class="col-total th-center">Total</th>
        <th class="col-resultado th-center">Resultado</th>
        <th class="col-cert">Certificado</th>
        <th class="col-obs">Observaciones</th>
      </tr>
    `;
  }

  function abrirModalAsistenciaAlumno(idParticipacion) {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(idParticipacion));
    if (!p) return;
    if (p.ESTADO_SELECCION !== 'Seleccionado') {
      return notificar('Solo se puede gestionar la asistencia de participantes en estado "Seleccionado".', true);
    }
    MODAL_ASIS_PARTICIPACION_ID = idParticipacion;
    MODAL_ASIS_SESIONES_TEMP = [...obtenerSesionesAsistidasParticipacion(p)];

    texto('modalAsisNombreAlumno', p.NOMBRE_COMPLETO || 'Participante');
    renderModalAsistenciaContenido_();

    const modal = document.getElementById('modalDetalleAsistenciaAlumno');
    if (modal) {
      modal.hidden = false;
      modal.style.display = 'flex';
    }
  }

  function cerrarModalAsistenciaAlumno() {
    const modal = document.getElementById('modalDetalleAsistenciaAlumno');
    if (modal) {
      modal.hidden = true;
      modal.style.display = 'none';
    }
    MODAL_ASIS_PARTICIPACION_ID = null;
  }

  function renderModalAsistenciaContenido_() {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(MODAL_ASIS_PARTICIPACION_ID));
    if (!p) return;
    const sesionesActividad = obtenerSesionesActividadGestion();
    const total = Number(p.SESIONES_TOTALES || GESTION.actividad?.SESIONES_TOTALES || 1);
    const asistidasCount = MODAL_ASIS_SESIONES_TEMP.length;
    const pct = total > 0 ? (asistidasCount / total) * 100 : 0;

    const regla = GESTION.actividad?.REGLA_RESULTADO || 'Asistencia';
    const exigenciaPct = Math.round(Number(GESTION.actividad?.PORCENTAJE_APROBACION || 0.8) * 100);

    texto('modalAsisContador', `${asistidasCount} / ${total}`);
    texto('modalAsisPorcentaje', `${pct.toFixed(0)}%`);
    texto('modalAsisRegla', regla === 'Porcentaje' ? `${exigenciaPct}% min` : 'Asistencia');

    let resultado = 'Pendiente';
    let badgeClase = 'neutral';
    if (p.ESTADO_SELECCION === 'Seleccionado') {
      if (regla === 'Porcentaje') {
        resultado = (pct >= exigenciaPct) ? 'Aprobado' : 'Desaprobado';
        badgeClase = (pct >= exigenciaPct) ? 'success' : 'danger';
      } else {
        resultado = asistidasCount > 0 ? 'Participó' : 'No participó';
        badgeClase = asistidasCount > 0 ? 'success' : 'danger';
      }
    }
    const badge = document.getElementById('modalAsisBadgeResultado');
    if (badge) {
      badge.textContent = resultado;
      badge.className = `badge ${badgeClase}`;
    }

    const lista = document.getElementById('modalAsisListaSesiones');
    if (lista) {
      lista.innerHTML = sesionesActividad.map(s => {
        const presente = MODAL_ASIS_SESIONES_TEMP.includes(Number(s.numero));
        return `
          <div class="modal-asis-row ${presente ? 'is-present' : ''}" onclick="modalAlternarSesion(${s.numero})">
            <div class="modal-asis-info">
              <span class="modal-asis-title">Sesión ${s.numero}</span>
              <span class="modal-asis-subtitle">${s.fecha ? fechaActividadVisible(s.fecha) : 'Fecha por programar'}${s.horaInicio ? ' · ' + s.horaInicio + ' a ' + (s.horaFin || '--:--') : ''}</span>
            </div>
            <div class="modal-asis-switch">
              <span class="badge ${presente ? 'success' : 'neutral'}">${presente ? '✓ Presente' : 'Ausente'}</span>
            </div>
          </div>
        `;
      }).join('');
    }
  }

  function modalAlternarSesion(numSesion) {
    numSesion = Number(numSesion);
    if (MODAL_ASIS_SESIONES_TEMP.includes(numSesion)) {
      MODAL_ASIS_SESIONES_TEMP = MODAL_ASIS_SESIONES_TEMP.filter(n => n !== numSesion);
    } else {
      MODAL_ASIS_SESIONES_TEMP.push(numSesion);
    }
    MODAL_ASIS_SESIONES_TEMP.sort((a, b) => a - b);
    renderModalAsistenciaContenido_();
  }

  function modalMarcarTodasSesiones(estado) {
    const sesionesActividad = obtenerSesionesActividadGestion();
    if (estado) {
      MODAL_ASIS_SESIONES_TEMP = sesionesActividad.map(s => Number(s.numero));
    } else {
      MODAL_ASIS_SESIONES_TEMP = [];
    }
    renderModalAsistenciaContenido_();
  }

  function guardarModalAsistenciaAlumno() {
    const p = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === String(MODAL_ASIS_PARTICIPACION_ID));
    if (!p) return;
    p.ASISTENCIA_SESIONES = JSON.stringify(MODAL_ASIS_SESIONES_TEMP);
    p.SESIONES_ASISTIDAS = MODAL_ASIS_SESIONES_TEMP.length;
    recalcularResultadoParticipante_(p);
    GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    cerrarModalAsistenciaAlumno();
    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    programarAutoGuardadoGestion();
    notificar('Asistencia actualizada para ' + (p.NOMBRE_COMPLETO || 'el participante') + '.');
  }

  function actualizarKpisGestion() {
    if (!GESTION) return;
    const parts = GESTION.participaciones || [];
    const act = GESTION.actividad || {};
    const r = GESTION.resumen || {};
    const cupos = Number(act.CUPOS || r.cupos || 0);

    const seleccionados = parts.filter(p => normalizar(p.ESTADO_SELECCION || '') === 'seleccionado');
    const confirmados = parts.filter(p => {
      const c = (p.CONFIRMA_PARTICIPACION || '').toLowerCase().trim();
      return c === 'sí' || c === 'si' || c === 's' || c.indexOf('confirm') >= 0 || c.indexOf('asistir') >= 0;
    });
    const asistentes = parts.filter(p => {
      const res = normalizar(p.RESULTADO_FINAL || '');
      return Number(p.SESIONES_ASISTIDAS || 0) > 0 || res === 'aprobado' || res === 'participo';
    });
    const aprobados = parts.filter(p => {
      const res = normalizar(p.RESULTADO_FINAL || '');
      return res === 'aprobado' || res === 'participo';
    });
    const vacantes = cupos > 0 ? Math.max(0, cupos - seleccionados.length) : 'Sin límite';

    texto('gInscritos', parts.length);
    texto('gCupos', cupos > 0 ? cupos : 'Sin límite');
    texto('gSeleccionados', seleccionados.length);
    texto('gVacantes', vacantes);
    texto('gConfirmados', confirmados.length);
    texto('gAsistentes', asistentes.length);
    texto('gAprobados', aprobados.length);
    const satProm = Number(GESTION.satisfaccion?.promedioGeneral || r.satisfaccionPromedio || 0);
    const satCount = Number(GESTION.satisfaccion?.totalEncuestas || r.totalEncuestas || 0);
    texto('gSatisfaccion', satCount > 0 ? (satProm.toFixed(1) + ' ★ (' + satCount + ')') : 'Sin encuestas');

    // Actualizar sub-banner inferior
    const subBanner = document.getElementById('gestionActividadSubBanner');
    if (subBanner && act.ID_ACTIVIDAD) {
      const cuposTexto = cupos > 0 ? `${cupos} cupos totales` : 'Cupos sin límite';
      const sesionesTexto = act.SESIONES_TOTALES ? ` · ${act.SESIONES_TOTALES} sesión(es)` : '';
      const vacantesTexto = cupos > 0 ? ` · <span style="color:#059669;font-weight:600">${vacantes} vacantes libres</span>` : '';
      const ahora = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      subBanner.innerHTML = `<strong>${parts.length}</strong> participante(s) en nómina · ${cuposTexto}${vacantesTexto}${sesionesTexto} · <span style="color:#047857;font-weight:600">✓ Sincronizado ${ahora}</span>`;
    }

    if (typeof actualizarIndicadorCambiosGestion === 'function') {
      actualizarIndicadorCambiosGestion();
    }
  }

  function alCambiarOrigenTraspaso(desdeChip = false) {
    const selOrig = document.getElementById('traspasoActividadOrigen');
    const idSeleccionado = !desdeChip ? selOrig?.value : '';
    const idDestino = document.getElementById('gestionActividad')?.value;
    const box = document.getElementById('traspasoResumenBox');
    const textoResumen = document.getElementById('traspasoResumenTexto');
    const btn = document.getElementById('btnEjecutarTraspaso');
    const alerta = document.getElementById('traspasoAlerta');

    if (alerta) alerta.style.display = 'none';

    if (idSeleccionado && idSeleccionado !== idDestino) {
      if (!TRASPASO_ORIGENES.some(o => o.id === idSeleccionado)) {
        const actObj = (DB?.actividades || []).find(a => String(a.ID_ACTIVIDAD) === String(idSeleccionado));
        TRASPASO_ORIGENES.push({ id: idSeleccionado, nombre: actObj?.NOMBRE_ACTIVIDAD || idSeleccionado });
        renderTraspasoOrigenesChips_();
      }
      if (typeof deseleccionarActividadGen === 'function') {
        deseleccionarActividadGen('Traspaso', false);
      }
    }

    const idsOrigen = TRASPASO_ORIGENES.map(o => o.id);
    if (!idsOrigen.length) {
      if (box) box.style.display = 'none';
      if (btn) btn.disabled = true;
      TRASPASO_RESUMEN_ACTUAL = null;
      return;
    }

    const soloResiduos = document.getElementById('chkTraspasoSoloResiduos')?.checked !== false;

    if (box) {
      box.style.display = 'block';
      if (textoResumen) textoResumen.innerHTML = `<span class="loading-spinner"></span> Analizando trayectoria acumulada en ${idsOrigen.length} actividad(es)...`;
    }
    if (btn) btn.disabled = true;

    google.script.run
      .withSuccessHandler(resumen => {
        if (!resumen || !resumen.ok) {
          if (box) box.style.display = 'none';
          if (alerta) {
            alerta.textContent = (resumen && resumen.mensaje) || 'No se pudo analizar las actividades seleccionadas.';
            alerta.style.display = 'block';
          }
          return;
        }
        TRASPASO_RESUMEN_ACTUAL = resumen;
        actualizarVistaPreviaTraspaso();
      })
      .withFailureHandler(err => {
        if (box) box.style.display = 'none';
        if (alerta) {
          alerta.textContent = 'Error al analizar: ' + (err.message || String(err));
          alerta.style.display = 'block';
        }
      })
      .obtenerResumenTraspasoActividadWeb(idsOrigen, idDestino, soloResiduos);
  }

  function actualizarVistaPreviaTraspaso() {
    const box = document.getElementById('traspasoResumenBox');
    const textoResumen = document.getElementById('traspasoResumenTexto');
    const btn = document.getElementById('btnEjecutarTraspaso');
    if (!TRASPASO_RESUMEN_ACTUAL || !box || !textoResumen) return;

    const r = TRASPASO_RESUMEN_ACTUAL;
    const chkEspera = document.getElementById('chkTraspasoListaEspera')?.checked;
    const chkNoSel = document.getElementById('chkTraspasoNoSeleccionado')?.checked;
    const chkPend = document.getElementById('chkTraspasoPendiente')?.checked;
    const chkSel = document.getElementById('chkTraspasoSeleccionado')?.checked;
    const chkOtros = document.getElementById('chkTraspasoOtros')?.checked;

    let disponibles = 0;
    let yaInscritos = 0;
    let totalConsiderados = 0;

    const desglose = [];

    if (chkEspera && r.estados['Lista de espera']) {
      const e = r.estados['Lista de espera'];
      disponibles += e.disponibles;
      yaInscritos += e.yaInscritos;
      totalConsiderados += e.total;
      desglose.push(`<b>${e.total}</b> en lista de espera (${e.disponibles} disponibles, ${e.yaInscritos} ya inscritos)`);
    }
    if (chkNoSel && r.estados['No seleccionado']) {
      const e = r.estados['No seleccionado'];
      disponibles += e.disponibles;
      yaInscritos += e.yaInscritos;
      totalConsiderados += e.total;
      desglose.push(`<b>${e.total}</b> no seleccionados (${e.disponibles} disponibles, ${e.yaInscritos} ya inscritos)`);
    }
    if (chkPend && r.estados['Pendiente']) {
      const e = r.estados['Pendiente'];
      disponibles += e.disponibles;
      yaInscritos += e.yaInscritos;
      totalConsiderados += e.total;
      desglose.push(`<b>${e.total}</b> pendientes (${e.disponibles} disponibles, ${e.yaInscritos} ya inscritos)`);
    }
    if (chkSel && r.estados['Seleccionado']) {
      const e = r.estados['Seleccionado'];
      disponibles += e.disponibles;
      yaInscritos += e.yaInscritos;
      totalConsiderados += e.total;
      desglose.push(`<b>${e.total}</b> seleccionados (${e.disponibles} disponibles, ${e.yaInscritos} ya inscritos)`);
    }
    if (chkOtros && r.estados['Otros']) {
      const e = r.estados['Otros'];
      disponibles += e.disponibles;
      yaInscritos += e.yaInscritos;
      totalConsiderados += e.total;
      desglose.push(`<b>${e.total}</b> con otros estados / resto (${e.disponibles} disponibles, ${e.yaInscritos} ya inscritos)`);
    }

    box.style.display = 'block';

    if (!chkEspera && !chkNoSel && !chkPend && !chkSel && !chkOtros) {
      textoResumen.innerHTML = '<span style="color:#e11d48">⚠️ Debe marcar al menos un estado para traspasar.</span>';
      if (btn) btn.disabled = true;
      return;
    }

    if (totalConsiderados === 0) {
      textoResumen.innerHTML = '<span style="color:#d97706">ℹ️ No hay postulantes en la actividad origen que coincidan con los estados marcados.</span>';
      if (btn) btn.disabled = true;
      return;
    }

    let html = `<div style="margin-bottom:8px;">Origen: <b>${esc(r.origen.nombre)}</b></div>`;
    html += `<ul style="margin:0 0 10px 18px; padding:0;">${desglose.map(d => `<li>${d}</li>`).join('')}</ul>`;
    html += `<div style="padding-top:8px; border-top:1px dashed #cbd5e1; display:flex; justify-content:space-between; align-items:center;">
      <span>Listos para incorporarse a esta actividad:</span>
      <span class="badge" style="background:#059669; color:white; font-size:13px; font-weight:700; padding:2px 10px; border-radius:12px;">${disponibles} postulante(s)</span>
    </div>`;

    if (yaInscritos > 0) {
      html += `<div style="font-size:11.5px; color:#64748b; margin-top:4px;">* Se omitirán <b>${yaInscritos}</b> persona(s) que ya se encuentran inscritas en esta actividad destino para evitar duplicidades.</div>`;
    }
    if (Number(r.excluidosYaParticiparon || 0) > 0) {
      const listaEx = Array.isArray(r.excluidosLista) ? r.excluidosLista : [];
      const detalleHtml = listaEx.length
        ? `<details style="margin-top:4px;"><summary style="cursor:pointer; font-weight:600; color:#1e40af;">Ver las ${r.excluidosYaParticiparon} persona(s) excluidas</summary><ul style="margin:6px 0 0 18px; max-height:130px; overflow:auto; font-size:11.5px; color:#334155;">${listaEx.map(x => `<li><b>${esc(x.nombre)}</b>${x.doc ? ' (' + esc(x.doc) + ')' : ''} — participó en: ${esc(x.en)}</li>`).join('')}</ul></details>`
        : '';
      html += `<div style="font-size:11.5px; color:#1e40af; margin-top:4px;">🎯 Trayectoria acumulada: se excluyeron <b>${r.excluidosYaParticiparon}</b> persona(s) que ya asistieron o aprobaron en alguna de las actividades origen.${Number(r.excluidosEnDestino || 0) > 0 ? ` <b>${r.excluidosEnDestino}</b> de ellas ya están en este listado y quedarán marcadas automáticamente como <b>"No seleccionado"</b> al confirmar.` : ''}${detalleHtml}</div>`;
    }

    textoResumen.innerHTML = html;
    if (btn) btn.disabled = (disponibles === 0 && Number(r.excluidosEnDestino || 0) === 0);
  }

    const filtroResultado = document.getElementById('filtroGestionResultado')?.value || '';
    const filtroRequisitos = document.getElementById('filtroGestionRequisitos')?.value || '';
    const filtroPmjh = document.getElementById('filtroGestionPmjh')?.value || '';
    const filtroPenalizados = document.getElementById('filtroGestionPenalizados')?.value || '';

    enriquecerPenalizacionesParticipantesLocal_(GESTION.participaciones || [], GESTION.actividad?.ID_ACTIVIDAD);

    return (GESTION.participaciones || []).filter(p => {
      // 1. Buscador de texto general
      if (q) {
        const textoFila = normalizar([
          p.NOMBRE_COMPLETO,
          p.RUT,
          p.DOCUMENTO,
          p.TELEFONO,
          p.EDAD,
          p.CORREO,
          p.PARTICIPA_PMJH,
          p.OBSERVACIONES
        ].join(' '));
        if (!textoFila.includes(q)) return false;
      }

      // 2. Filtro Selección
      if (filtroSeleccion) {
        const sel = p.ESTADO_SELECCION || 'Pendiente';
        if (sel !== filtroSeleccion) return false;
      }

      // 3. Filtro Confirmación
      if (filtroConfirmacion) {
        const conf = p.CONFIRMA_PARTICIPACION || 'No informado';
        if (conf !== filtroConfirmacion) return false;
      }

      // 4. Filtro Certificado
      if (filtroCertificado) {
        const cert = p.CERTIFICADO || 'No informado';
        if (cert !== filtroCertificado) return false;
      }

      // 5. Filtro Resultado / Aprobación
      if (filtroResultado) {
        const res = p.RESULTADO_FINAL || 'Pendiente';
        if (filtroResultado === 'Aprobado') {
          if (res !== 'Aprobado' && res !== 'Participó') return false;
        } else if (filtroResultado === 'Desaprobado') {
          if (res !== 'Desaprobado' && res !== 'No participó') return false;
        } else if (res !== filtroResultado) {
          return false;
        }
      }

      // 6. Filtro Requisitos
      if (filtroRequisitos) {
        const req = p.CUMPLE_REQUISITOS || 'Pendiente';
        if (req !== filtroRequisitos) return false;
      }

      // 7. Filtro PMJH
      if (filtroPmjh) {
        const pmjh = p.PARTICIPA_PMJH || 'No informado';
        if (filtroPmjh === 'Sí' && pmjh !== 'Sí') return false;
        if (filtroPmjh === 'No' && pmjh !== 'No') return false;
      }

      // 8. Filtro de Penalización por Inasistencia con Confirmación
      if (filtroPenalizados) {
        const cantPen = Number(p.CANTIDAD_INASISTENCIAS_CONFIRMADAS || 0);
        if (filtroPenalizados === 'sin_penalizacion' && cantPen > 0) return false;
        if (filtroPenalizados === 'penalizados' && cantPen === 0) return false;
      }

      return true;
    }).sort(compararParticipantesConPenalizacion_);
  }

  function limpiarFiltrosGestion() {
    const ids = [
      'buscarGestion',
      'filtroGestionSeleccion',
      'filtroGestionConfirmacion',
      'filtroGestionCertificado',
      'filtroGestionResultado',
      'filtroGestionRequisitos',
      'filtroGestionPmjh',
      'filtroGestionPenalizados'
    ];
    ids.forEach(id => {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    actualizarEstadoBotonPorLlamar();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
  }

  function renderGestion(sincronizarAntes = true) {
    if (sincronizarAntes) {
      sincronizarGestionDesdeTabla();
    }
    const sesionesActividad = obtenerSesionesActividadGestion();
    renderHeaderGestion_(sesionesActividad);

    const tbody = document.getElementById('tablaGestion');
    const filas = obtenerParticipantesFiltradosGestion();
    const totalRegistrados = (GESTION.participaciones || []).length;

    // Actualizar indicador de contador de filtrados
    const contadorEl = document.getElementById('contadorGestionFiltrados');
    if (contadorEl) {
      if (totalRegistrados === 0) {
        contadorEl.textContent = '';
      } else if (filas.length === totalRegistrados) {
        contadorEl.textContent = `${totalRegistrados} participante(s)`;
      } else {
        contadorEl.textContent = `Mostrando ${filas.length} de ${totalRegistrados} participantes`;
      }
    }

    const colSpanTotal = 13 + (GESTION_MODO_VISTA === 'sesiones' ? sesionesActividad.length : 0);

    if (!filas.length) {
      const nombreAct = GESTION.actividad?.NOMBRE_ACTIVIDAD || '';
      const idAct = GESTION.actividad?.ID_ACTIVIDAD || '';
      const mensajeVacio = idAct
        ? ((GESTION.participaciones && GESTION.participaciones.length > 0)
          ? `No hay participantes de <strong>"${esc(nombreAct)}"</strong> (${esc(idAct)}) que coincidan con los filtros seleccionados.<br><button type="button" class="btn secondary compact" onclick="limpiarFiltrosGestion()" style="margin-top:8px">✕ Quitar filtros</button>`
          : `No hay participantes registrados para la capacitación <strong>"${esc(nombreAct)}"</strong> (${esc(idAct)}).<br><small style="color:var(--text-muted);margin-top:6px;display:inline-block">Si vinculaste un formulario de Google, ve a la sección <strong>Formularios</strong> y haz clic en <strong>⚡ Reprocesar</strong>.</small>`)
        : 'Seleccione una actividad en el selector superior para ver y gestionar sus participantes.';
      tbody.innerHTML = `<tr><td colspan="${colSpanTotal}" class="empty-state">${mensajeVacio}</td></tr>`;
      actualizarCheckPrincipalGestion();
      return;
    }

    const esModoSesiones = GESTION_MODO_VISTA === 'sesiones' && sesionesActividad.length > 0;
    let separadorPenalizadosInsertado = false;
    const hayNoPenalizados = filas.some(x => Number(x.CANTIDAD_INASISTENCIAS_CONFIRMADAS || 0) === 0);

    tbody.innerHTML = filas.map(p => {
      const idx = GESTION.participaciones.indexOf(p);
      const id = String(p.ID_PARTICIPACION || '');
      const marcado = GESTION_SELECCIONADOS.has(id) ? 'checked' : '';

      const resultado = p.RESULTADO_FINAL || 'Pendiente';
      let badgeClase = 'neutral';
      if (resultado === 'Aprobado' || resultado === 'Participó') badgeClase = 'success';
      else if (resultado === 'Desaprobado' || resultado === 'No participó') badgeClase = 'danger';
      else if (resultado === 'Pendiente') badgeClase = 'warning';

      const pmjh = p.PARTICIPA_PMJH || 'No informado';
      const pmjhBadge = pmjh === 'Sí' ? 'badge success' : (pmjh === 'No' ? 'badge neutral' : 'badge neutral');

      const asistidasNums = obtenerSesionesAsistidasParticipacion(p);
      const totalAsistidas = asistidasNums.length;
      const totalSes = Math.max(sesionesActividad.length, Number(GESTION.actividad?.SESIONES_TOTALES || 0), Number(p.SESIONES_TOTALES || 0), totalAsistidas, 1);
      p.SESIONES_TOTALES = totalSes;

      let celdasSesionesHtml = '';
      const noSeleccionado = p.ESTADO_SELECCION !== 'Seleccionado';
      if (esModoSesiones) {
        celdasSesionesHtml = sesionesActividad.map(s => {
          const presente = asistidasNums.includes(Number(s.numero));
          return `
            <td class="col-sesion td-center">
              <button
                type="button"
                class="sesion-toggle-pill ${presente ? 'presente' : ''} ${noSeleccionado ? 'disabled-toggle' : ''}"
                ${noSeleccionado ? 'disabled' : ''}
                onclick="alternarAsistenciaSesion('${esc(id)}', ${s.numero})"
                title="${noSeleccionado ? 'Participante no seleccionado (estado: ' + (p.ESTADO_SELECCION || 'Pendiente') + '). Seleccione a la persona para registrar asistencia.' : 'Sesión ' + s.numero + (s.fecha ? ' (' + fechaActividadCorta(s.fecha) + ')' : '') + ': ' + (presente ? 'Presente' : 'Ausente')}"
              >
                ${presente ? '✓' : '—'}
              </button>
            </td>
          `;
        }).join('');
      }

      const campoAsistidasHtml = esModoSesiones
        ? `<div style="display:flex;align-items:center;justify-content:center;gap:6px">
             <strong style="font-size:14px;color:${noSeleccionado ? 'var(--texto-mudo)' : 'var(--primario)'}">${totalAsistidas}</strong>
             <button type="button" class="btn-abrir-detalle-asis" onclick="abrirModalAsistenciaAlumno('${esc(id)}')" ${noSeleccionado ? 'disabled title="Participante no seleccionado"' : 'title="Ver detalle de sesiones"'}>📋</button>
           </div>`
        : `<div style="display:flex;align-items:center;justify-content:center;gap:4px">
             <input data-campo="SESIONES_ASISTIDAS" type="number" min="0" value="${esc(numeroPlano(p.SESIONES_ASISTIDAS,0))}" onchange="registrarCambioGestion(this)" ${noSeleccionado ? 'disabled title="Participante no seleccionado"' : ''} style="width:50px">
             <button type="button" class="btn-abrir-detalle-asis" onclick="abrirModalAsistenciaAlumno('${esc(id)}')" ${noSeleccionado ? 'disabled title="Participante no seleccionado"' : 'title="Ver desglose por sesión"'}>📋</button>
           </div>`;

      const tel = String(p.TELEFONO || '').trim();
      const telLimpio = tel.replace(/[^0-9+]/g, '');
      const telHtml = tel
        ? `<div style="display:inline-flex;align-items:center;justify-content:center"><a href="tel:${esc(telLimpio)}" class="tel-link" title="Llamar por teléfono a ${esc(p.NOMBRE_COMPLETO)}">📞 ${esc(tel)}</a></div>`
        : `<span class="muted">—</span>`;

      const cantPen = Number(p.CANTIDAD_INASISTENCIAS_CONFIRMADAS || 0);
      const detallePen = p.DETALLE_INASISTENCIAS_CONFIRMADAS || 'Capacitación anterior';
      const rectificada = Boolean(p.PENALIZACION_RECTIFICADA);
      const detalleRect = p.DETALLE_RECTIFICACION || 'Rectificó su asistencia en una capacitación posterior';
      let filaSeparadorHtml = '';
      if (cantPen > 0 && !separadorPenalizadosInsertado && hayNoPenalizados) {
        separadorPenalizadosInsertado = true;
        filaSeparadorHtml = `<tr class="fila-separador-penalizados"><td colspan="${colSpanTotal}" style="background:#fef2f2;color:#991b1b;font-weight:700;font-size:12px;padding:8px 14px;border-top:2px solid #f87171;border-bottom:1px solid #fecaca;">⚠️ PARTICIPANTES RELEGADOS AL FINAL POR PENALIZACIÓN — Confirmaron asistencia en capacitaciones anteriores y no asistieron (0 sesiones)</td></tr>`;
      }
      const badgePenalizadoHtml = cantPen > 0
        ? `<div><span class="badge-penalizado-inasistencia" title="Confirmó participación (Sí) pero tuvo 0 asistencias en: ${esc(detallePen)}">⚠️ Confirmó y no asistió (${cantPen} ${cantPen === 1 ? 'vez' : 'veces'})</span></div>`
        : (rectificada
          ? `<div><span class="badge success" style="font-size:10px;padding:2px 6px;margin-top:3px;display:inline-block" title="${esc(detalleRect)}">✓ Asistencia rectificada</span></div>`
          : '');
      const clasesFila = [marcado ? 'fila-marcada' : '', cantPen > 0 ? 'fila-penalizada' : ''].filter(Boolean).join(' ');

      return filaSeparadorHtml + `<tr data-idx="${idx}" data-id="${esc(id)}" class="${clasesFila}">
        <td class="col-check td-center"><input type="checkbox" class="gestion-check" data-id="${esc(id)}" ${marcado} onchange="cambiarSeleccionGestion(this)"></td>
        <td class="col-persona nombre"><strong>${esc(p.NOMBRE_COMPLETO)}</strong><small>${esc(p.CORREO || 'Sin correo')}</small>${badgePenalizadoHtml}</td>
        <td class="col-doc">${esc(p.DOCUMENTO || p.RUT || '—')}</td>
        <td class="col-telefono td-center">${telHtml}</td>
        <td class="col-pmjh td-center"><span class="${pmjhBadge}">${esc(pmjh)}</span></td>
        <td class="col-requisitos">${selectGestion('CUMPLE_REQUISITOS', p.CUMPLE_REQUISITOS, ['Pendiente','Sí','No','No informado'])}</td>
        <td class="col-seleccion">${selectGestion('ESTADO_SELECCION', p.ESTADO_SELECCION, ['Pendiente','Seleccionado','Lista de espera','No seleccionado','No informado'])}</td>
        <td class="col-confirma">${selectGestion('CONFIRMA_PARTICIPACION', p.CONFIRMA_PARTICIPACION, ['No informado','Sí','No'])}</td>
        ${celdasSesionesHtml}
        <td class="col-asistidas td-center">${campoAsistidasHtml}</td>
        <td class="col-total td-center"><span class="badge neutral" style="font-weight:700;font-size:12px;padding:3px 8px" title="Sesiones totales de la capacitación">${totalSes}</span></td>
        <td class="col-resultado td-center"><span class="badge ${badgeClase}">${esc(resultado)}</span></td>
        <td class="col-cert">${selectGestion('CERTIFICADO', p.CERTIFICADO, ['No informado','Sí','No','No aplica'])}</td>
        <td class="col-obs"><input class="obs" data-campo="OBSERVACIONES" placeholder="Observación..." value="${esc(p.OBSERVACIONES || '')}" onchange="registrarCambioGestion(this)"></td>
      </tr>`;
    }).join('');
    actualizarCheckPrincipalGestion();
  }

  function selectGestion(campo, actual, opciones) {
    return `<select data-campo="${campo}" onchange="registrarCambioGestion(this)">` + opciones.map(op =>
      `<option value="${esc(op)}" ${String(actual || '') === String(op) ? 'selected' : ''}>${esc(op || 'Automático')}</option>`
    ).join('') + `</select>`;
  }

  function cambiarSeleccionGestion(checkbox) {
    const id = String(checkbox.dataset.id || '').trim();
    if (!id) return;
    const tr = checkbox.closest('tr');
    if (checkbox.checked) {
      GESTION_SELECCIONADOS.add(id);
      if (tr) tr.classList.add('fila-marcada');
    } else {
      GESTION_SELECCIONADOS.delete(id);
      if (tr) tr.classList.remove('fila-marcada');
    }
    actualizarCheckPrincipalGestion();
  }

  function actualizarCheckPrincipalGestion() {
    const badgeContador = document.getElementById('bulkContadorSeleccionados');
    const totalMarcados = GESTION_SELECCIONADOS.size;
    if (badgeContador) {
      if (totalMarcados === 0) {
        badgeContador.textContent = '0 seleccionados';
        badgeContador.className = 'bulk-counter-pill empty';
        badgeContador.title = 'Marque las casillas (☑) en la tabla para aplicar cambios en lote';
      } else {
        badgeContador.textContent = `✓ ${totalMarcados} marcado${totalMarcados > 1 ? 's' : ''}`;
        badgeContador.className = 'bulk-counter-pill active';
        badgeContador.title = `${totalMarcados} participante(s) marcado(s) para aplicar cambios`;
      }
    }

    const principal = document.getElementById('checkTodosGestion');
    if (!principal) return;
    const checksVisibles = [
      ...document.querySelectorAll('#tablaGestion .gestion-check')
    ];
    if (!checksVisibles.length) {
      principal.checked = false;
      principal.indeterminate = false;
      return;
    }
    const cantidadMarcados = checksVisibles.filter(function(check) {
      return check.checked;
    }).length;
    principal.checked = cantidadMarcados === checksVisibles.length;
    principal.indeterminate =
      cantidadMarcados > 0 &&
      cantidadMarcados < checksVisibles.length;
  }

  function registrarCambioGestion(control) {
    const tr = control.closest('tr[data-idx]');
    if (!tr) return;
    const idx = Number(tr.dataset.idx);
    const registro = GESTION.participaciones[idx];
    if (!registro) return;
    const campo = control.dataset.campo;
    registro[campo] = control.value;

    // Si confirman participacion, auto-promover a Seleccionado si estaba Pendiente
    if (campo === 'CONFIRMA_PARTICIPACION' && normalizar(control.value) === 'si') {
      if (normalizar(registro.ESTADO_SELECCION || '') !== 'seleccionado') {
        registro.ESTADO_SELECCION = 'Seleccionado';
        const selectSel = tr.querySelector('[data-campo="ESTADO_SELECCION"]');
        if (selectSel) selectSel.value = 'Seleccionado';
      }
    }
    // Si un Seleccionado confirma "No", liberar vacante inmediatamente pasando a "No seleccionado"
    if (campo === 'CONFIRMA_PARTICIPACION' && normalizar(control.value) === 'no') {
      if (normalizar(registro.ESTADO_SELECCION || '') === 'seleccionado') {
        registro.ESTADO_SELECCION = 'No seleccionado';
        registro.SESIONES_ASISTIDAS = 0;
        registro.ASISTENCIA_SESIONES = '[]';
        const selectSel = tr.querySelector('[data-campo="ESTADO_SELECCION"]');
        if (selectSel) selectSel.value = 'No seleccionado';
        const inputAsis = tr.querySelector('[data-campo="SESIONES_ASISTIDAS"]');
        if (inputAsis) inputAsis.value = 0;
      }
    }

    // Si registran asistencia, auto-promover a Seleccionado si estaba Pendiente
    if (campo === 'SESIONES_ASISTIDAS' && Number(control.value) > 0) {
      if (normalizar(registro.ESTADO_SELECCION || '') !== 'seleccionado') {
        registro.ESTADO_SELECCION = 'Seleccionado';
        const selectSel = tr.querySelector('[data-campo="ESTADO_SELECCION"]');
        if (selectSel) selectSel.value = 'Seleccionado';
      }
    }
    if (campo === 'ESTADO_SELECCION' &&
        control.value !== 'Seleccionado') {
      registro.SESIONES_ASISTIDAS = 0;
      registro.ASISTENCIA_SESIONES = '[]';
      const asistencia = tr.querySelector(
        '[data-campo="SESIONES_ASISTIDAS"]'
      );
      if (asistencia) asistencia.value = 0;
    }
    recalcularResultadoParticipante_(registro);

    // Actualizar celda de resultado en la fila inmediatamente
    const celdaResultado = tr.querySelector('.col-resultado');
    if (celdaResultado) {
      const res = registro.RESULTADO_FINAL || 'Pendiente';
      let badgeClase = 'neutral';
      const normRes = normalizar(res);
      if (normRes === 'aprobado' || normRes === 'participo') badgeClase = 'success';
      else if (normRes === 'desaprobado' || normRes === 'no participo') badgeClase = 'danger';
      else if (normRes === 'pendiente') badgeClase = 'warning';
      celdaResultado.innerHTML = `<span class="badge ${badgeClase}">${esc(res)}</span>`;
    }
    GESTION_MODIFICADOS.add(String(registro.ID_PARTICIPACION));
    if (typeof actualizarKpisGestion === 'function') actualizarKpisGestion();
    if (typeof actualizarIndicadorCambiosGestion === 'function') actualizarIndicadorCambiosGestion();
    if (typeof programarAutoGuardadoGestion === 'function') programarAutoGuardadoGestion();
  }

  function sincronizarGestionDesdeTabla() {
    document.querySelectorAll('#tablaGestion tr[data-idx]').forEach(tr => {
      const idx = Number(tr.dataset.idx);
      const registro = GESTION.participaciones[idx];
      if (!registro) return;
      tr.querySelectorAll('[data-campo]').forEach(control => {
        registro[control.dataset.campo] = control.value;
      });
      const check = tr.querySelector('.gestion-check');
      if (check) cambiarSeleccionGestion(check);
    });
  }

  function indicesGestionMarcados() {
    sincronizarGestionDesdeTabla();
    return (GESTION.participaciones || [])
      .map((p, i) => GESTION_SELECCIONADOS.has(String(p.ID_PARTICIPACION)) ? i : -1)
      .filter(i => i >= 0);
  }

  function alternarTodosGestion(checkPrincipal) {
    marcarTodosGestion(checkPrincipal.checked);
  }

  function marcarTodosGestion(estado) {
    const checksVisibles = [
      ...document.querySelectorAll('#tablaGestion .gestion-check')
    ];
    checksVisibles.forEach(function(check) {
      const id = String(check.dataset.id || '').trim();
      if (!id) return;
      check.checked = estado;
      const tr = check.closest('tr');
      if (estado) {
        GESTION_SELECCIONADOS.add(id);
        if (tr) tr.classList.add('fila-marcada');
      } else {
        GESTION_SELECCIONADOS.delete(id);
        if (tr) tr.classList.remove('fila-marcada');
      }
    });
    actualizarCheckPrincipalGestion();
  }

  function alternarFijarColumnaNombre() {
    const contenedor = document.querySelector('.gestion-scroll');
    if (!contenedor) return;
    const estaFijada = contenedor.classList.toggle('columna-fijada');
    try {
      localStorage.setItem('sigc_gestion_columna_fija', estaFijada ? '1' : '0');
    } catch (e) {}
    actualizarBotonFijarColumna(estaFijada);
  }

  function actualizarBotonFijarColumna(estaFijada) {
    const btn = document.getElementById('btnToggleFijarColumna');
    if (!btn) return;
    if (estaFijada) {
      btn.innerHTML = '📌 Columna de nombres: <strong>Fijada</strong>';
      btn.className = 'btn-toggle-pin active';
      btn.title = 'Haga clic para liberar la columna de nombres y permitir que se desplace con la tabla';
    } else {
      btn.innerHTML = '📌 Columna de nombres: <strong>Móvil</strong>';
      btn.className = 'btn-toggle-pin inactive';
      btn.title = 'Haga clic para fijar la columna de nombres a la izquierda al desplazarse';
    }
  }

  function inicializarFijarColumnaNombre() {
    let preferencia = '1';
    try {
      const guardado = localStorage.getItem('sigc_gestion_columna_fija');
      if (guardado !== null) preferencia = guardado;
    } catch (e) {}
    const contenedor = document.querySelector('.gestion-scroll');
    const estaFijada = preferencia === '1';
    if (contenedor) {
      if (estaFijada) {
        contenedor.classList.add('columna-fijada');
      } else {
        contenedor.classList.remove('columna-fijada');
      }
    }
    actualizarBotonFijarColumna(estaFijada);
  }

  function aplicarMasivo(campo, idSelector) {
    const valor = document.getElementById(idSelector).value;
    if (!valor) return notificar('Seleccione un valor para aplicar.', true);
    const indices = indicesGestionMarcados();
    if (!indices.length) return notificar('Marque al menos una persona.', true);
    indices.forEach(i => {
      const p = GESTION.participaciones[i];
      p[campo] = valor;
      if (campo === 'CONFIRMA_PARTICIPACION' && normalizar(valor) === 'si') {
        if (normalizar(p.ESTADO_SELECCION || '') !== 'seleccionado') {
          p.ESTADO_SELECCION = 'Seleccionado';
        }
      }
      if (campo === 'CONFIRMA_PARTICIPACION' && normalizar(valor) === 'no') {
        if (normalizar(p.ESTADO_SELECCION || '') === 'seleccionado') {
          p.ESTADO_SELECCION = 'No seleccionado';
          p.SESIONES_ASISTIDAS = 0;
          p.ASISTENCIA_SESIONES = '[]';
        }
      }
      if (campo === 'ESTADO_SELECCION' &&
          valor !== 'Seleccionado') {
        p.SESIONES_ASISTIDAS = 0;
        p.ASISTENCIA_SESIONES = '[]';
      }
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });
    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    programarAutoGuardadoGestion();
    notificar('Cambio aplicado a ' + indices.length + ' registros.');
  }

  function marcarAsistenciaCompleta() {
    const indices = indicesGestionMarcados();
    if (!indices.length) return notificar('Marque al menos una persona.', true);
    const sesionesActividad = obtenerSesionesActividadGestion();
    const todasLasSesiones = sesionesActividad.map(s => Number(s.numero));

    indices.forEach(i => {
      const p = GESTION.participaciones[i];
      if (normalizar(p.ESTADO_SELECCION || '') !== 'seleccionado') {
        p.ESTADO_SELECCION = 'Seleccionado';
      }
      p.ASISTENCIA_SESIONES = JSON.stringify(todasLasSesiones);
      p.SESIONES_ASISTIDAS = todasLasSesiones.length;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });
    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    programarAutoGuardadoGestion();
    notificar('Asistencia al 100% registrada para ' + indices.length + ' participantes.');
  }

  function marcarAsistenciaCero() {
    const indices = indicesGestionMarcados();
    if (!indices.length) {
      return notificar('Marque al menos una persona.', true);
    }
    indices.forEach(i => {
      const p = GESTION.participaciones[i];
      p.ASISTENCIA_SESIONES = '[]';
      p.SESIONES_ASISTIDAS = 0;
      recalcularResultadoParticipante_(p);
      GESTION_MODIFICADOS.add(String(p.ID_PARTICIPACION));
    });
    actualizarKpisGestion();
    renderGestion(false);
    actualizarIndicadorCambiosGestion();
    programarAutoGuardadoGestion();
    notificar('Asistencia establecida en 0 para ' + indices.length + ' registros.');
  }

  let GUARDANDO_GESTION_EN_CURSO = false;
  let GUARDADO_GESTION_ENCOLADO = false;
  let GUARDADO_GESTION_MANUAL_PENDIENTE = false;

  window.addEventListener('beforeunload', function(e) {
    if ((GESTION_MODIFICADOS && GESTION_MODIFICADOS.size > 0) || GUARDANDO_GESTION_EN_CURSO) {
      const msg = 'Hay cambios de asistencia o selección pendientes de guardar en Google Sheets.';
      e.preventDefault();
      e.returnValue = msg;
      return msg;
    }
  });

  function guardarGestion(silencioso = false, esReintento = false) {
    if (!GESTION.actividad) {
      if (!silencioso) notificar('Primero cargue una actividad.', true);
      return;
    }
    clearTimeout(TEMPORIZADOR_AUTOGUARDADO_GESTION);
    sincronizarGestionDesdeTabla();

    // Si ya hay un guardado ejecutándose en el servidor, encolar este lote para evitar choques de candado (LockService)
    if (GUARDANDO_GESTION_EN_CURSO) {
      GUARDADO_GESTION_ENCOLADO = true;
      if (!silencioso) {
        GUARDADO_GESTION_MANUAL_PENDIENTE = true;
        notificar('Guardando cambios en cola…');
      }
      return;
    }

    const registros = GESTION.participaciones
      .filter(p => GESTION_MODIFICADOS.has(String(p.ID_PARTICIPACION)))
      .map(p => ({
        ID_PARTICIPACION: p.ID_PARTICIPACION,
        CUMPLE_REQUISITOS: p.CUMPLE_REQUISITOS,
        ESTADO_SELECCION: p.ESTADO_SELECCION,
        CONFIRMA_PARTICIPACION: p.CONFIRMA_PARTICIPACION,
        SESIONES_ASISTIDAS: p.SESIONES_ASISTIDAS,
        ASISTENCIA_SESIONES: p.ASISTENCIA_SESIONES || '',
        SESIONES_TOTALES: p.SESIONES_TOTALES,
        RESULTADO_FINAL: p.RESULTADO_FINAL,
        PORCENTAJE_ASISTENCIA: p.PORCENTAJE_ASISTENCIA,
        CERTIFICADO: p.CERTIFICADO,
        OBSERVACIONES: p.OBSERVACIONES,
        _SNAPSHOT: JSON.stringify([
          p.CUMPLE_REQUISITOS, p.ESTADO_SELECCION, p.CONFIRMA_PARTICIPACION,
          p.SESIONES_ASISTIDAS, p.ASISTENCIA_SESIONES || '', p.CERTIFICADO, p.OBSERVACIONES
        ])
      }));
    if (!registros.length) {
      if (!silencioso) notificar('No hay cambios pendientes para guardar.', true);
      return;
    }

    const snapshotsEnviados = new Map();
    registros.forEach(r => {
      snapshotsEnviados.set(String(r.ID_PARTICIPACION), r._SNAPSHOT);
      delete r._SNAPSHOT;
    });
    const idsEnviados = Array.from(snapshotsEnviados.keys());

    GUARDANDO_GESTION_EN_CURSO = true;
    GUARDADO_GESTION_ENCOLADO = false;
    const mostrarAvisoManual = !silencioso || GUARDADO_GESTION_MANUAL_PENDIENTE;
    GUARDADO_GESTION_MANUAL_PENDIENTE = false;

    // Reflejar inmediatamente en caché local para vistas cruzadas
    registros.forEach(reg => {
      const idxDb = DB.participaciones.findIndex(p => p.ID_PARTICIPACION === reg.ID_PARTICIPACION);
      if (idxDb >= 0) {
        DB.participaciones[idxDb] = Object.assign({}, DB.participaciones[idxDb], reg);
      }
    });
    sigcReconstruirIndices('participaciones');
    actualizarKpisGestion();
    renderGestion(false);

    const ind = document.getElementById('indicadorAutoGuardadoGestion');
    if (ind) {
      ind.style.display = 'inline-flex';
      ind.innerHTML = `<span style="color:#0284c7;font-weight:600">⏳ Guardando ${idsEnviados.length} cambio(s) en Google Sheets…</span>`;
    }
    if (mostrarAvisoManual && !esReintento) {
      notificar('Guardando ' + idsEnviados.length + ' cambio(s) en Google Sheets…');
    }
    actualizarEstadoSincronizacion('syncing', 'Guardando gestión y asistencia en Google Sheets…');

    google.script.run
      .withSuccessHandler(r => {
        GUARDANDO_GESTION_EN_CURSO = false;
        // Solo quitar de GESTION_MODIFICADOS las filas que no volvieron a cambiar mientras se guardaba
        idsEnviados.forEach(id => {
          const pActual = (GESTION.participaciones || []).find(x => String(x.ID_PARTICIPACION) === id);
          if (!pActual) {
            GESTION_MODIFICADOS.delete(id);
            return;
          }
          const snapActual = JSON.stringify([
            pActual.CUMPLE_REQUISITOS, pActual.ESTADO_SELECCION, pActual.CONFIRMA_PARTICIPACION,
            pActual.SESIONES_ASISTIDAS, pActual.ASISTENCIA_SESIONES || '', pActual.CERTIFICADO, pActual.OBSERVACIONES
          ]);
          if (snapActual === snapshotsEnviados.get(id)) {
            GESTION_MODIFICADOS.delete(id);
          }
        });

        actualizarIndicadorCambiosGestion();

        // Si quedaron cambios nuevos realizados durante el guardado, despacharlos inmediatamente en orden
        if (GUARDADO_GESTION_ENCOLADO || GESTION_MODIFICADOS.size > 0) {
          setTimeout(() => guardarGestion(!GUARDADO_GESTION_MANUAL_PENDIENTE), 150);
          return;
        }

        if (ind) {
          ind.style.display = 'inline-flex';
          ind.innerHTML = '<span style="color:#059669;font-weight:600">✓ Todos los cambios respaldados en Google Sheets</span>';
        }
        if (mostrarAvisoManual) {
          notificar(r.mensaje || 'Gestión guardada exitosamente en Google Sheets.');
        }
        actualizarEstadoSincronizacion('saved', '✓ Asistencia y gestión guardada en Google Sheets');
        SIGC_STORE.set('participaciones', DB.participaciones);
        refrescarResumenDashboardSilencioso_();
      })
      .withFailureHandler(error => {
        GUARDANDO_GESTION_EN_CURSO = false;
        idsEnviados.forEach(id => GESTION_MODIFICADOS.add(id));
        const msgErr = error && error.message ? error.message : String(error);
        const esCandado = /candado|lock|tiempo de espera|timed out/i.test(msgErr);

        // Si fue una colisión temporal de candado, reintentar automáticamente 1 vez tras 1.8s
        if (esCandado && !esReintento) {
          if (ind) {
            ind.style.display = 'inline-flex';
            ind.innerHTML = '<span style="color:#d97706;font-weight:600">⏳ Planilla ocupada, reintentando guardado automáticamente…</span>';
          }
          setTimeout(() => guardarGestion(silencioso, true), 1800);
          return;
        }

        actualizarIndicadorCambiosGestion();
        if (ind) {
          ind.style.display = 'inline-flex';
          ind.innerHTML = '<span style="color:#dc2626;font-weight:700">⚠️ Error al guardar. Sus cambios siguen en pantalla, presione "Guardar cambios" para reintentar.</span>';
        }
        notificar('No se pudo respaldar en Google Sheets (sus cambios siguen en pantalla): ' + msgErr, true);
        actualizarEstadoSincronizacion('error', 'Error al guardar — cambios pendientes');
      })
      .guardarGestionMasiva({
        idActividad: GESTION.actividad.ID_ACTIVIDAD,
        registros
      });
  }

  /* =========================================================================
   * HOJA DE ASISTENCIA Y FIRMAS IMPRIMIBLE (MODAL + IMPRESIÓN DIRECTA + WORD)
   * ========================================================================= */
  function esConfirmadoFirmaLocal_(v) {
    const c = normalizar(v || '');
    return c === 'si' || c === 's' || c.includes('confirm') || c.includes('asistir');
  }

  function obtenerParticipantesListaFirmas_() {
    sincronizarGestionDesdeTabla();
    let todos = (GESTION && Array.isArray(GESTION.participaciones)) ? GESTION.participaciones.slice() : [];
    const idAct = (GESTION && GESTION.actividad && GESTION.actividad.ID_ACTIVIDAD) || document.getElementById('gestionActividad')?.value || '';
    if (!todos.length && idAct && typeof SIGC_INDEX !== 'undefined' && SIGC_INDEX.participacionesPorActividad) {
      const desdeIdx = SIGC_INDEX.participacionesPorActividad.get(String(idAct).trim());
      if (Array.isArray(desdeIdx) && desdeIdx.length) {
        todos = desdeIdx.map(p => {
          const per = (SIGC_INDEX.personasPorId && SIGC_INDEX.personasPorId.get(String(p.ID_PERSONA || '').trim())) || {};
          return Object.assign({}, per, p);
        });
      }
    }
    return todos;
  }

  function construirFilasListaFirmasHtml_(filtroModo, filasExtraCount) {
    const todos = obtenerParticipantesListaFirmas_();
    const lista = todos.filter(p => {
      const est = normalizar(p.ESTADO_SELECCION);
      const conf = esConfirmadoFirmaLocal_(p.CONFIRMA_PARTICIPACION);
      const asis = Number(p.SESIONES_ASISTIDAS || 0) > 0;
      if (filtroModo === 'solo_confirmados') return conf;
      if (filtroModo === 'seleccionados_confirmados') return est === 'seleccionado' || conf || asis;
      if (filtroModo === 'todos') return est !== 'no seleccionado';
      return true;
    });

    lista.sort((x, y) => String(x.NOMBRE_COMPLETO || '').localeCompare(String(y.NOMBRE_COMPLETO || ''), 'es'));

    let html = lista.map((p, i) =>
      '<tr>' +
        '<td class="f-col-num">' + (i + 1) + '</td>' +
        '<td class="f-col-nombre">' + esc(p.NOMBRE_COMPLETO || '—') + '</td>' +
        '<td class="f-col-rut">' + esc(p.DOCUMENTO || p.RUT || '—') + '</td>' +
        '<td class="f-col-tel">' + esc(p.TELEFONO || '—') + '</td>' +
        '<td class="f-col-correo">' + esc(p.CORREO || '—') + '</td>' +
        '<td class="f-col-firma"><div class="firma-linea-imp"></div></td>' +
      '</tr>'
    ).join('');

    for (let k = 1; k <= filasExtraCount; k++) {
      html +=
        '<tr>' +
          '<td class="f-col-num">' + (lista.length + k) + '</td>' +
          '<td class="f-col-nombre"></td>' +
          '<td class="f-col-rut"></td>' +
          '<td class="f-col-tel"></td>' +
          '<td class="f-col-correo"></td>' +
          '<td class="f-col-firma"><div class="firma-linea-imp"></div></td>' +
        '</tr>';
    }

    if (!html) {
      html = '<tr><td colspan="6" style="text-align:center;padding:20px;color:#64748b;">No hay participantes para el filtro seleccionado. Cambie el selector superior a "Nómina completa (Todos)".</td></tr>';
    }

    return { html: html, cantidad: lista.length, lista: lista };
  }

  function imprimirListaFirmasGestion() {
    const idSelector = document.getElementById('gestionActividad')?.value || '';
    const idCargado = (GESTION && GESTION.actividad && GESTION.actividad.ID_ACTIVIDAD) ? String(GESTION.actividad.ID_ACTIVIDAD) : '';

    if (!idSelector && !idCargado) {
      notificar('Seleccione primero una actividad en Gestión de Participantes para generar la lista de firmas.', true);
      const inp = document.getElementById('inputBuscarActividadGestion');
      if (inp) inp.focus();
      return;
    }

    // Si hay una actividad seleccionada pero aún no se ha cargado su detalle en GESTION, cargarla primero y luego abrir el modal
    if (idSelector && idSelector !== idCargado) {
      mostrarCarga(true, 'Preparando nómina de firmas…');
      google.script.run
        .withSuccessHandler(datos => {
          mostrarCarga(false);
          GESTION = datos || { actividad: null, participaciones: [] };
          renderGestion();
          abrirModalListaFirmasInterno_();
        })
        .withFailureHandler(err => {
          mostrarCarga(false);
          notificar(err.message || String(err), true);
        })
        .obtenerGestionActividad(idSelector);
      return;
    }

    abrirModalListaFirmasInterno_();
  }

  function abrirModalListaFirmasInterno_() {
    const act = (GESTION && GESTION.actividad) ? GESTION.actividad : {};
    if (!act.ID_ACTIVIDAD) {
      return notificar('Seleccione primero una actividad en Gestión de Participantes.', true);
    }

    const todos = obtenerParticipantesListaFirmas_();
    const sesiones = obtenerSesionesActividadGestion();

    const haySelOConf = todos.some(p =>
      normalizar(p.ESTADO_SELECCION) === 'seleccionado' ||
      esConfirmadoFirmaLocal_(p.CONFIRMA_PARTICIPACION) ||
      Number(p.SESIONES_ASISTIDAS || 0) > 0
    );
    const filtroInicial = haySelOConf ? 'seleccionados_confirmados' : 'todos';

    const selFiltro = document.getElementById('filtroImpresionFirmas');
    if (selFiltro) selFiltro.value = filtroInicial;

    const selSesion = document.getElementById('sesionImpresionFirmas');
    if (selSesion) {
      let opcionesHtml = '';
      if (sesiones && sesiones.length > 0) {
        opcionesHtml = sesiones.map(s => {
          const f = s.fecha ? fechaActividadVisible(s.fecha) : 'Fecha por definir';
          const h = s.horaInicio ? (' (' + s.horaInicio + (s.horaFin ? ' a ' + s.horaFin : '') + ')') : '';
          const val = 'Sesión ' + s.numero + ' — ' + f + h;
          return '<option value="' + esc(val) + '">Sesión ' + esc(s.numero) + ' (' + esc(f) + ')</option>';
        }).join('') + '<option value="Registro General — Fecha: ____/____/______">Hoja general con fecha abierta</option>';
      } else {
        const fIni = act.FECHA_INICIO ? fechaActividadVisible(act.FECHA_INICIO) : '____/____/______';
        const val = 'Sesión 1 — Fecha: ' + fIni;
        opcionesHtml = '<option value="' + esc(val) + '">Sesión 1 (' + esc(fIni) + ')</option>' +
                       '<option value="Registro General — Fecha: ____/____/______">Hoja general con fecha abierta</option>';
      }
      selSesion.innerHTML = opcionesHtml;
    }

    const escuelaAreaTxt = [act.ESCUELA_LINEA, act.AREA_TEMATICA].filter(Boolean).join(' · ') || 'General';
    const modLugarTxt = [act.MODALIDAD || 'Presencial', act.INSTITUCION_ASOCIADA].filter(Boolean).join(' · ');
    const respTxt = act.RESPONSABLE || 'Equipo Capacitación DIDEL';
    const horarioTxt = act.HORARIO || 'Según programación';

    texto('lblFirmasCodigoAct', act.ID_ACTIVIDAD || '');
    texto('lblFirmasNombreAct', act.NOMBRE_ACTIVIDAD || '');
    texto('lblFirmasEscuelaAct', escuelaAreaTxt);
    texto('lblFirmasModalidadLugar', modLugarTxt);
    texto('lblFirmasResponsable', respTxt);
    texto('lblFirmasHorario', horarioTxt);

    actualizarVistaPreviaListaFirmas();

    const modal = document.getElementById('modalImprimirListaFirmas');
    if (modal) {
      modal.style.display = 'flex';
    }
  }

  function actualizarVistaPreviaListaFirmas() {
    const fModo = document.getElementById('filtroImpresionFirmas')?.value || 'todos';
    const sesTxt = document.getElementById('sesionImpresionFirmas')?.value || 'Sesión 1';
    const fExtra = Number(document.getElementById('filasExtraImpresionFirmas')?.value || 0);

    const res = construirFilasListaFirmasHtml_(fModo, fExtra);
    const tbody = document.getElementById('tbodyModalListaFirmas');
    if (tbody) tbody.innerHTML = res.html;
    texto('lblFirmasResumenConteo', res.cantidad + ' participante(s) en nómina');
    texto('lblFirmasSesionFecha', sesTxt);
  }

  function ejecutarImpresionDirectaListaFirmas() {
    const htmlDoc = generarHtmlStandaloneListaFirmas_(true);
    let win = null;
    try {
      win = window.open('', '_blank');
    } catch (e) {
      win = null;
    }

    if (win && win.document) {
      try {
        win.document.open();
        win.document.write(htmlDoc);
        win.document.close();
        setTimeout(() => {
          try {
            win.focus();
            win.print();
          } catch (errPrint) {
            console.warn('Error al invocar win.print():', errPrint);
          }
        }, 300);
        return;
      } catch (errWrite) {
        try { win.close(); } catch (e) {}
      }
    }

    // Fallback en la misma ventana si el navegador bloquea emergentes
    document.body.classList.add('imprimiendo-lista-firmas');
    const limpiarClase = () => {
      document.body.classList.remove('imprimiendo-lista-firmas');
      window.removeEventListener('afterprint', limpiarClase);
    };
    window.addEventListener('afterprint', limpiarClase);
    setTimeout(() => {
      try {
        window.focus();
        window.print();
      } catch (e) {
        console.warn('Error al invocar window.print():', e);
      }
      setTimeout(limpiarClase, 2500);
    }, 120);
  }

  function descargarListaFirmasWord() {
    const act = (GESTION && GESTION.actividad) ? GESTION.actividad : {};
    const htmlDoc = generarHtmlStandaloneListaFirmas_(false);
    const blob = new Blob(['\ufeff', htmlDoc], { type: 'application/msword;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const cod = String(act.ID_ACTIVIDAD || 'Actividad').replace(/[^a-zA-Z0-9_-]/g, '_');
    a.href = url;
    a.download = 'Lista_Firmas_' + cod + '.doc';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 500);
    notificar('Hoja de firmas descargada en formato Word (.doc) lista para imprimir.');

  function aplicarDatosPanelFormularios_(datos) {
    FORMULARIOS = Array.isArray(datos?.formularios) ? datos.formularios : [];

  async function cargarFormularios(forzar=false) {
    if (!forzar && _sigcFormulariosEnMemoria) {
      renderFormularios();
      renderFormularioIntereses();
      return;
    }

    let tieneCacheLocal = false;
    if (!forzar && typeof SIGC_STORE !== 'undefined') {
      try {
        const cacheLocal = await SIGC_STORE.get('panel_formularios');
        if (cacheLocal && Array.isArray(cacheLocal.formularios)) {
          tieneCacheLocal = true;
          aplicarDatosPanelFormularios_(cacheLocal);
          texto('estadoActualizacionFormularios',
            `Caché local${cacheLocal.fechaActualizacion ? ' (' + cacheLocal.fechaActualizacion + ')' : ''} · actualizando en segundo plano…`);
        }
      } catch (eCache) {}
    }

    if (_sigcCargandoFormularios && !forzar) return;
    _sigcCargandoFormularios = true;

    if (forzar || !tieneCacheLocal) {
      mostrarCarga(true, forzar ? 'Actualizando formularios…' : 'Cargando formularios…');
    }

    google.script.run
      .withSuccessHandler(datos => {
        _sigcCargandoFormularios = false;
        mostrarCarga(false);
        if (datos) {
          aplicarDatosPanelFormularios_(datos);
          if (typeof SIGC_STORE !== 'undefined') {
            SIGC_STORE.set('panel_formularios', datos).catch(() => {});
          }
        }
      })
      .withFailureHandler(error => {
        _sigcCargandoFormularios = false;
        mostrarCarga(false);
        notificar(error.message || String(error), true);
      })
      .obtenerPanelFormularios(forzar === true);
  }
