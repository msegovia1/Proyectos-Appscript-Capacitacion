<script>
let DB = {personas:[], actividades:[], participaciones:[], intereses:[], demanda:{resumen:{},filas:[],detalle:[]}, graficos:{}, resumen:{}};
  window.DB = DB;
  window.DATOS = DB;

  // Inyección instantánea desde el servidor si está disponible (0.0 ms)
  function aplicarDatosInicialesServidor_() {
    try {
      const init = window.DATOS_INICIALES_SERVIDOR;
      if (!init) return;
      if (init.error) {
        const banner = document.getElementById('bannerErrorDashboard');
        if (banner) {
          banner.style.display = 'block';
          banner.innerHTML = '⚠️ <strong>Aviso del servidor:</strong> ' + esc(init.mensaje || 'Error al conectar con la planilla de Google Sheets.');
        }
        actualizarEstadoSincronizacion('error', 'Error en Google Sheets');
        return;
      }
      if (init.resumen && (init.resumen.totalPersonas !== undefined || init.resumen.totalActividades !== undefined)) {
        DB.resumen = init.resumen || {};
        DB.graficos = init.graficos || {};
        DB.fechaActualizacion = init.fechaActualizacion || '';
        renderDashboard();
        actualizarEstadoSincronizacion('saved', 'Sincronizado: ' + (init.fechaActualizacion || 'Al día'));
      }
    } catch (eInit) {
      console.warn('Advertencia al aplicar datos iniciales:', eInit);
    }
  }
  const DB_INDEX = {
    actividadesPorId: new Map(),
    personasPorId: new Map(),
    personasPorRut: new Map(),
    participacionesPorActividad: new Map()
  };

  function reconstruirIndicesCliente() {
    sigcReconstruirIndices('todos');
    DB_INDEX.actividadesPorId = SIGC_INDEX.actividadesPorId;
    DB_INDEX.personasPorId = SIGC_INDEX.personasPorId;
    DB_INDEX.personasPorRut = SIGC_INDEX.personasPorDoc;
    DB_INDEX.participacionesPorActividad = SIGC_INDEX.participacionesPorActividad;
  }

  function enriquecerParticipacionesEnCliente_(partRaw) {
    if (!Array.isArray(partRaw)) return [];
    return partRaw.map(p => {
      if (p.NOMBRE_COMPLETO && p.NOMBRE_ACTIVIDAD) return p;
      const persona = SIGC_INDEX.personasPorId.get(String(p.ID_PERSONA || '').trim()) || {};
      const act = SIGC_INDEX.actividadesPorId.get(String(p.ID_ACTIVIDAD || '').trim()) || {};
      const doc = persona.NUMERO_DOCUMENTO || persona.RUT || '';
      return Object.assign({}, p, {
        NOMBRE_COMPLETO: p.NOMBRE_COMPLETO || persona.NOMBRE_COMPLETO || 'Persona no encontrada',
        TIPO_DOCUMENTO: p.TIPO_DOCUMENTO || persona.TIPO_DOCUMENTO || (persona.RUT ? 'RUT' : ''),
        NUMERO_DOCUMENTO: p.NUMERO_DOCUMENTO || doc,
        DOCUMENTO: p.DOCUMENTO || doc,
        RUT: p.RUT || persona.RUT || doc,
        FECHA_NACIMIENTO: p.FECHA_NACIMIENTO || persona.FECHA_NACIMIENTO || '',
        EDAD: p.EDAD !== undefined && p.EDAD !== '' ? p.EDAD : (persona.EDAD ?? ''),
        CORREO: p.CORREO || persona.CORREO || '',
        TELEFONO: p.TELEFONO || persona.TELEFONO || '',
        COMUNA: p.COMUNA || persona.COMUNA || '',
        BARRIO: p.BARRIO || persona.BARRIO || '',
        PARTICIPA_PMJH: p.PARTICIPA_PMJH || persona.PARTICIPA_PMJH || 'No informado',
        NOMBRE_ACTIVIDAD: p.NOMBRE_ACTIVIDAD || act.NOMBRE_ACTIVIDAD || 'Actividad no encontrada',
        ESCUELA_LINEA: p.ESCUELA_LINEA || act.ESCUELA_LINEA || '',
        AREA_TEMATICA: p.AREA_TEMATICA || act.AREA_TEMATICA || '',
        ANO: p.ANO || act.ANO || '',
        INSTITUCION_ASOCIADA: p.INSTITUCION_ASOCIADA || act.INSTITUCION_ASOCIADA || '',
        PORCENTAJE_ASISTENCIA: p.PORCENTAJE_ASISTENCIA !== undefined && p.PORCENTAJE_ASISTENCIA !== ''
          ? (typeof p.PORCENTAJE_ASISTENCIA === 'number' ? Math.round(p.PORCENTAJE_ASISTENCIA * 100) + '%' : p.PORCENTAJE_ASISTENCIA)
          : ''
      });
    });
  }

  let GESTION = {actividad:null, participaciones:[], resumen:{}};
  let COMUNICACIONES = {destinatarios:[], resumen:{}};
  let DEMANDA_DETALLE_ACTUAL = [];
  let FORMULARIOS = [];
  let CAPACIDAD_FORMULARIOS = {};
  let FORMULARIO_INTERESES = null;
  let REPORTE = null;
  let REPORTE_ASISTENCIAS = null;
  let PAGINA_ASISTENCIAS = 1;
  const TAMANO_PAGINA_ASISTENCIAS = 50;
  let TEMPORIZADOR_ASISTENCIAS = null;
  const DASHBOARD_LOCAL_KEY = 'SIGC_DASHBOARD_CLIENTE_V1';
  const MODULOS_CARGADOS = new Set();
  const PAGINACION = {
    personas:{pagina:1,tamano:50},
    actividades:{pagina:1,tamano:25},
    participaciones:{pagina:1,tamano:50}
  };
  const TEMPORIZADORES_RENDER = {};
  let CARGAS_ACTIVAS = 0;
  let CASOS_REVISION = [];
  let CONFIG_REVISION_ACTIVA = '';
  let CASO_REVISION_ACTIVO = null;
  let NUEVOS_INTERESES = [];
  let IMPORTACION = {encabezados:[], filas:[], mapeo:{}, analisis:null, historial:[], baseMadre:null};
  const COMUNICACION_SELECCIONADOS = new Set();
  const GESTION_SELECCIONADOS = new Set();
  const GESTION_MODIFICADOS = new Set();
  const charts = {};

  // ==========================================
  // MOTOR DE DATOS RELACIONAL Y CACHÉ LOCAL
  // ==========================================
  const SIGC_INDEX = {
    personasPorId: new Map(),
    personasPorDoc: new Map(),
    actividadesPorId: new Map(),
    participacionesPorId: new Map(),
    participacionesPorActividad: new Map(),
    participacionesPorPersona: new Map()
  };

  function normalizarClaveDoc(doc) {
    return String(doc || '').replace(/[^0-9kK]/g, '').toUpperCase();
  }

  function sigcReconstruirIndices(tipo = 'todos') {
    if (tipo === 'todos' || tipo === 'personas') {
      SIGC_INDEX.personasPorId.clear();
      SIGC_INDEX.personasPorDoc.clear();
      (DB.personas || []).forEach(p => {
        const id = String(p.ID_PERSONA || '').trim();
        if (id) SIGC_INDEX.personasPorId.set(id, p);
        const doc = normalizarClaveDoc(p.NUMERO_DOCUMENTO || p.DOCUMENTO || p.RUT);
        if (doc) SIGC_INDEX.personasPorDoc.set(doc, p);
      });
    }
    if (tipo === 'todos' || tipo === 'actividades') {
      SIGC_INDEX.actividadesPorId.clear();
      (DB.actividades || []).forEach(a => {
        const id = String(a.ID_ACTIVIDAD || '').trim();
        if (id) SIGC_INDEX.actividadesPorId.set(id, a);
      });
    }
    if (tipo === 'todos' || tipo === 'participaciones') {
      SIGC_INDEX.participacionesPorId.clear();
      SIGC_INDEX.participacionesPorActividad.clear();
      SIGC_INDEX.participacionesPorPersona.clear();
      (DB.participaciones || []).forEach(p => {
        const id = String(p.ID_PARTICIPACION || '').trim();
        if (id) SIGC_INDEX.participacionesPorId.set(id, p);
        const idAct = String(p.ID_ACTIVIDAD || '').trim();
        if (idAct) {
          if (!SIGC_INDEX.participacionesPorActividad.has(idAct)) {
            SIGC_INDEX.participacionesPorActividad.set(idAct, []);
          }
          SIGC_INDEX.participacionesPorActividad.get(idAct).push(p);
        }
        const idPer = String(p.ID_PERSONA || '').trim();
        if (idPer) {
          if (!SIGC_INDEX.participacionesPorPersona.has(idPer)) {
            SIGC_INDEX.participacionesPorPersona.set(idPer, []);
          }
          SIGC_INDEX.participacionesPorPersona.get(idPer).push(p);
        }
      });
    }
  }

  // Almacén IndexedDB con timeout estricto de seguridad y fallback inmediato a localStorage
  const SIGC_STORE = {
    dbName: 'SIGC_LOCAL_DB_V1',
    storeName: 'datos',
    _db: null,
    _indexedDbDisabled: false,
    async getDb() {
      if (this._indexedDbDisabled) return null;
      if (this._db) return this._db;
      if (!window.indexedDB) {
        this._indexedDbDisabled = true;
        return null;
      }
      return new Promise((resolve) => {
        let terminado = false;
        const timer = setTimeout(() => {
          if (!terminado) {
            terminado = true;
            this._indexedDbDisabled = true;
            resolve(null);
          }
        }, 120);

        try {
          const req = indexedDB.open(this.dbName, 1);
          req.onupgradeneeded = (e) => {
            try {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(this.storeName)) {
                db.createObjectStore(this.storeName);
              }
            } catch (errUp) {}
          };
          req.onsuccess = (e) => {
            if (!terminado) {
              terminado = true;
              clearTimeout(timer);
              this._db = e.target.result;
              resolve(this._db);
            }
          };
          req.onerror = () => {
            if (!terminado) {
              terminado = true;
              clearTimeout(timer);
              this._indexedDbDisabled = true;
              resolve(null);
            }
          };
        } catch (e) {
          if (!terminado) {
            terminado = true;
            clearTimeout(timer);
            this._indexedDbDisabled = true;
            resolve(null);
          }
        }
      });
    },
    async set(clave, valor) {
      try {
        const db = await this.getDb();
        if (db) {
          return new Promise((resolve) => {
            try {
              const tx = db.transaction(this.storeName, 'readwrite');
              tx.objectStore(this.storeName).put(valor, clave);
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch (eTx) {
              resolve(false);
            }
          });
        }
        try {
          localStorage.setItem('SIGC_' + clave, JSON.stringify(valor));
          return true;
        } catch (eLs) {
          return false;
        }
      } catch (e) {
        return false;
      }
    },
    async get(clave) {
      try {
        const db = await this.getDb();
        if (db) {
          return new Promise((resolve) => {
            let terminado = false;
            const timer = setTimeout(() => {
              if (!terminado) {
                terminado = true;
                resolve(null);
              }
            }, 100);
            try {
              const tx = db.transaction(this.storeName, 'readonly');
              const req = tx.objectStore(this.storeName).get(clave);
              req.onsuccess = () => {
                if (!terminado) {
                  terminado = true;
                  clearTimeout(timer);
                  resolve(req.result || null);
                }
              };
              req.onerror = () => {
                if (!terminado) {
                  terminado = true;
                  clearTimeout(timer);
                  resolve(null);
                }
              };
            } catch (eTx) {
              if (!terminado) {
                terminado = true;
                clearTimeout(timer);
                resolve(null);
              }
            }
          });
        }
        try {
          const val = localStorage.getItem('SIGC_' + clave);
          return val ? JSON.parse(val) : null;
        } catch (eLs) {
          return null;
        }
      } catch (e) {
        return null;
      }
    },
    async clear() {
      try {
        const db = await this.getDb();
        if (db) {
          await new Promise((resolve) => {
            try {
              const tx = db.transaction(this.storeName, 'readwrite');
              tx.objectStore(this.storeName).clear();
              tx.oncomplete = () => resolve(true);
              tx.onerror = () => resolve(false);
            } catch (eTx) {
              resolve(false);
            }
          });
        }
        try {
          Object.keys(localStorage).forEach(key => {
            if (key.startsWith('SIGC_')) localStorage.removeItem(key);
          });
        } catch (eLs) {}
        return true;
      } catch (e) {
        return false;
      }
    }
  };

  function actualizarEstadoSincronizacion(estado, textoCustom) {
    const dot = document.querySelector('.status-dot');
    const elAct = document.getElementById('ultimaActualizacion');
    if (dot) {
      dot.className = 'status-dot ' + (estado || 'saved');
    }
    if (elAct && textoCustom) {
      elAct.textContent = textoCustom;
    }
  }

  function irAVista(nombreVista) {
    const btn = document.querySelector(`.menu button[data-view="${nombreVista}"]`);
    document.querySelectorAll('.menu button').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
    if (btn) btn.classList.add('active');
    const targetView = document.getElementById(nombreVista);
    if (targetView) targetView.classList.add('active');
    const titulo = document.getElementById('tituloVista');
    if (titulo) {
      if (btn) titulo.textContent = btn.textContent.replace(/^[^A-Za-zÁÉÍÓÚÑ]+/, '').trim();
      else if (nombreVista === 'calendario') titulo.textContent = 'Calendario de capacitaciones';
      else if (nombreVista === 'registro-personas') titulo.textContent = 'Registrar persona';
      else if (nombreVista === 'registro-actividades') titulo.textContent = 'Registrar actividad';
      else if (nombreVista === 'registro-participaciones') titulo.textContent = 'Registrar participación';
    }
    cargarVistaBajoDemanda(nombreVista);
  }

  document.querySelectorAll('.menu button').forEach(btn => {
    btn.addEventListener('click', () => {
      irAVista(btn.dataset.view);
    });
  });

  let _cargandoDatosEnCurso = false;

  async function cargarDatos(forzar=false) {
    if (_cargandoDatosEnCurso && !forzar) return;
    _cargandoDatosEnCurso = true;
    const inicioCarga = performance.now();
    let localDataLoaded = false;

    // 0. Feedback visual INMEDIATO: nunca dejar la pantalla en 0 sin aviso
    window.sigcLogDiagnostico?.('3. cargarDatos() iniciado en cliente. Verificando caché y conectividad...');
    actualizarEstadoSincronizacion('syncing', 'Sincronizando con Google Sheets…');
    mostrarCarga(true, 'Cargando datos del sistema…');

    if (forzar) {
      try { await SIGC_STORE.clear(); } catch (eClear) {}
    } else {
      try {
        // 1. Carga ultra-rápida desde almacenamiento local (con timeout seguro)
        const [resumenLocal, personasLocal, actividadesLocal, partLocal] = await Promise.all([
          SIGC_STORE.get('dashboard'),
          SIGC_STORE.get('personas'),
          SIGC_STORE.get('actividades'),
          SIGC_STORE.get('participaciones')
        ]);

        if (resumenLocal && resumenLocal.resumen && (resumenLocal.resumen.totalPersonas !== undefined || resumenLocal.resumen.totalActividades !== undefined)) {
          DB.resumen = resumenLocal.resumen || {};
          DB.graficos = resumenLocal.graficos || {};
          DB.fechaActualizacion = resumenLocal.fechaActualizacion || '';
          if (personasLocal && Array.isArray(personasLocal)) {
            DB.personas = personasLocal;
            MODULOS_CARGADOS.add('personas');
          }
          if (actividadesLocal && Array.isArray(actividadesLocal)) {
            DB.actividades = actividadesLocal;
            MODULOS_CARGADOS.add('actividades');
          }
          if (partLocal && Array.isArray(partLocal)) {
            DB.participaciones = partLocal;
            MODULOS_CARGADOS.add('participaciones');
          }
          try { sigcReconstruirIndices('todos'); } catch (eIdx) {}
          try { renderDashboard(); } catch (eDash) {}
          try { llenarSelectores(); } catch (eSel) {}
          localDataLoaded = true;
          const ms = (performance.now() - inicioCarga).toFixed(1);
          actualizarEstadoSincronizacion('saved', `Listo (RAM) · ${ms} ms`);
        }
      } catch (eStorage) {
        console.warn('Advertencia al leer almacenamiento local: ' + eStorage.message);
      }
    }

    const tieneDatosReales = Boolean(DB.resumen && (DB.resumen.totalPersonas || DB.resumen.totalActividades));
    if (localDataLoaded && tieneDatosReales) {
      mostrarCarga(false);
      actualizarEstadoSincronizacion('syncing', 'Sincronizando en segundo plano…');
    }

    const clientTimestamp = (!forzar && DB.fechaActualizacion) ? DB.fechaActualizacion : null;

    function llamarServidorDashboard(intento = 0) {
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        window.sigcLogDiagnostico?.('4. Esperando API de Google Apps Script (intento ' + (intento + 1) + '/30)...');
        if (intento < 30) {
          setTimeout(() => llamarServidorDashboard(intento + 1), 200);
          return;
        }
        window.sigcLogDiagnostico?.('ERROR: google.script.run no está disponible en este navegador.', true);
      }
      try {
        window.sigcLogDiagnostico?.('5. Conectando con Google Sheets mediante obtenerDashboardLiviano...');
        google.script.run
          .withSuccessHandler(datos => {
            window.sigcLogDiagnostico?.('6. ¡Google Sheets respondió! Total Personas: ' + (datos?.resumen?.totalPersonas ?? 'sin datos'));
            _cargandoDatosEnCurso = false;
            mostrarCarga(false);
            if (!datos) return;

            if (datos.sinCambios) {
              actualizarEstadoSincronizacion('saved', `Sincronizado: ${datos.fechaActualizacion || 'Al día'}`);
              renderDashboard();
              precargarModulosSilencioso_();
              if (typeof VISTA_ACTIVA !== 'undefined' && VISTA_ACTIVA === 'gestion') {
                const actSel = document.getElementById('gestionActividad')?.value;
                if (actSel && typeof cargarGestionActividad === 'function') {
                  cargarGestionActividad(true);
                }
              }
              return;
            }

            DB.resumen = datos.resumen || {};
            DB.graficos = datos.graficos || {};
            DB.fechaActualizacion = datos.fechaActualizacion || '';
            renderDashboard();
            llenarSelectores();
            SIGC_STORE.set('dashboard', datos);
            const segundos = ((performance.now() - inicioCarga) / 1000).toFixed(1);
            actualizarEstadoSincronizacion('saved', `Sincronizado: ${datos.fechaActualizacion || 'Hoy'} · ${segundos}s`);
            precargarModulosSilencioso_();
            if (typeof VISTA_ACTIVA !== 'undefined' && VISTA_ACTIVA === 'gestion') {
              const actSel = document.getElementById('gestionActividad')?.value;
              if (actSel && typeof cargarGestionActividad === 'function') {
                cargarGestionActividad(true);
              }
            }
          })
          .withFailureHandler(error => {
            _cargandoDatosEnCurso = false;
            mostrarCarga(false);
            const msg = (error && error.message) ? error.message : String(error);
            window.sigcLogDiagnostico?.('ERROR SERVIDOR GOOGLE SHEETS: ' + msg, true);
            console.error('Error al sincronizar dashboard:', msg);
            if (!localDataLoaded) {
              notificar('Error al sincronizar con Google Sheets: ' + msg, true);
              actualizarEstadoSincronizacion('error', 'Error al sincronizar');
            } else {
              actualizarEstadoSincronizacion('saved', 'Operando con datos locales');
            }
          })
          .obtenerDashboardLiviano(forzar === true, (tieneDatosReales && !forzar) ? clientTimestamp : null);
      } catch (eRun) {
        _cargandoDatosEnCurso = false;
        mostrarCarga(false);
        console.error('Error al invocar obtenerDashboardLiviano:', eRun);
        if (!localDataLoaded) {
          notificar('Error al invocar servidor: ' + eRun.message, true);
          actualizarEstadoSincronizacion('error', 'Error de conexión');
        }
      }
    }

    llamarServidorDashboard();
  }

  function precargarModulosSilencioso_() {
    setTimeout(() => {
      google.script.run.withSuccessHandler(datos => {
        if (datos && datos.actividades) {
          DB.actividades = datos.actividades;
          MODULOS_CARGADOS.add('actividades');
          SIGC_STORE.set('actividades', datos.actividades);
          sigcReconstruirIndices('actividades');
          llenarSelectores();
          if (document.getElementById('actividades')?.classList.contains('active')) renderActividades();
          if (document.getElementById('calendario')?.classList.contains('active')) renderCalendario();

          // Solo precargar personas en segundo plano si aún no están en memoria local (IndexedDB)
          // para no saturar la cola de google.script.run cuando el usuario entra a Gestión
          if (!MODULOS_CARGADOS.has('personas') || !DB.personas || DB.personas.length === 0) {
            setTimeout(() => {
              google.script.run.withSuccessHandler(dPersonas => {
                if (dPersonas && dPersonas.personas) {
                  DB.personas = dPersonas.personas;
                  MODULOS_CARGADOS.add('personas');
                  SIGC_STORE.set('personas', dPersonas.personas);
                  sigcReconstruirIndices('personas');
                  llenarSelectores();
                  if (document.getElementById('personas')?.classList.contains('active')) renderPersonas();
                }
              }).obtenerDatosModulo('personas');
            }, 3500);
          }
        }
      }).obtenerDatosModulo('actividades');
    }, 300);
  }

  function cargarDashboardLocal_() {
    return false;
  }
  function guardarDashboardLocal_(datos) {
    if (datos) SIGC_STORE.set('dashboard', datos);
  }
  let _timerRefrescoDashboard_ = null;
  function refrescarResumenDashboardSilencioso_() {
    if (_timerRefrescoDashboard_) clearTimeout(_timerRefrescoDashboard_);
    _timerRefrescoDashboard_ = setTimeout(() => {
      google.script.run
        .withSuccessHandler(datos => {
          if (!datos || datos.sinCambios) return;
          DB.resumen = datos.resumen || DB.resumen;
          DB.graficos = datos.graficos || DB.graficos;
          DB.fechaActualizacion = datos.fechaActualizacion || DB.fechaActualizacion;
          SIGC_STORE.set('dashboard', datos);
          if (document.getElementById('dashboard')?.classList.contains('active')) {
            renderDashboard();
          }
        })
        .obtenerDashboardLiviano(false, DB.fechaActualizacion || null);
    }, 4000);
  }
  function renderDashboard() {
    const r = DB.resumen || {};
    texto('kpiPersonas', r.totalPersonas ?? 0);
    texto('kpiActividades', r.totalActividades ?? 0);
    texto('kpiActivas', r.actividadesActivas ?? 0);
    texto('kpiParticipaciones', r.totalParticipaciones ?? 0);
    texto('kpiEfectiva', r.participacionEfectiva || 0);
    texto('kpiAprobacion', formatoPorcentaje(r.tasaAprobacion));
    texto('kpiTasaParticipacion', formatoPorcentaje(r.tasaParticipacion));
    texto('kpiCupos', r.cuposOfrecidos || 0);
    texto('kpiSeleccion', formatoPorcentaje(r.tasaSeleccion));
    texto('kpiAsistencia', formatoPorcentaje(r.tasaAsistencia));
    texto('kpiCertificacion', formatoPorcentaje(r.tasaCertificacion));
    texto('kpiBrecha', r.brechaDemanda || 0);
    try {
      renderGraficos();
    } catch (eG) {
      console.warn('Advertencia al renderizar gráficos del Dashboard: ' + eG.message);
    }
  }
  function cargarVistaBajoDemanda(vista) {
    if (vista === 'dashboard') {
      renderDashboard();
      return;
    }
    if (vista === 'personas') {
      asegurarModulo('personas', () => {
        renderPersonas();
      });
      return;
    }
    if (vista === 'actividades') {
      asegurarModulo('actividades', () => {
        renderActividades();
        llenarSelectores();
      });
      return;
    }
    if (vista === 'participaciones') {
      asegurarModulo('participaciones', () => {
        renderParticipaciones();
        llenarSelectores();
      });
      return;
    }
    if (vista === 'calendario') {
      asegurarModulo('actividades', () => {
        renderCalendario();
      });
      return;
    }
    if (vista === 'gestion') {

      });

      asegurarModulo('actividades', () => {

      });
      return;
    }
    if (vista === 'demanda') {
      asegurarModulo('demanda', () => {
        renderDemanda();
      });
      return;
    }
    if (vista === 'formularios') {
      cargarFormularios(false);
      asegurarModulo('actividades', () => {
        llenarSelectores();
      });
      return;
    }
    if (vista === 'importaciones') {
      asegurarModulo('actividades', cargarImportaciones);
      return;
    }
    if (vista === 'reportes') {
      asegurarModulo('actividades', () => {
        actualizarAreasReporte();
        llenarSelectores();
      });
      return;
    }
    if (vista === 'registro-personas') {
      asegurarModulo('personas', () => {

      });
      return;
    }
    if (vista === 'registro-actividades') {
      asegurarModulo('actividades', () => {
        llenarSelectores();
      });
      return;
    }
    if (vista === 'registro-participaciones') {

  function asegurarModulo(modulo, alTerminar) {
    if (MODULOS_CARGADOS.has(modulo)) {
      if (modulo === 'personas' && (!DB.personas || !DB.personas.length)) {
        // Permitir recargar del servidor si el array local está vacío
      } else if (modulo === 'actividades' && (!DB.actividades || !DB.actividades.length)) {
        // Permitir recargar del servidor si el array local está vacío
      } else {
        if (modulo === 'personas') renderPersonas();
        if (modulo === 'actividades') {
          renderActividades();
          llenarSelectores();
        }
        if (modulo === 'participaciones') renderParticipaciones();
        if (modulo === 'demanda') renderDemanda();
        if (alTerminar) alTerminar();
        return;
      }
    }

    mostrarCarga(true, 'Cargando datos del módulo…');
    google.script.run
      .withSuccessHandler(datos => {
        Object.assign(DB, datos || {});
        MODULOS_CARGADOS.add(modulo);
        reconstruirIndicesCliente();
        sigcReconstruirIndices(modulo);
        if (datos && datos.personas) SIGC_STORE.set('personas', datos.personas);
        if (datos && datos.actividades) SIGC_STORE.set('actividades', datos.actividades);
        if (datos && datos.participaciones) SIGC_STORE.set('participaciones', datos.participaciones);

        if (modulo === 'personas') renderPersonas();
        if (modulo === 'actividades') {
          renderActividades();
          renderCalendario();
          llenarSelectores();
        }
        if (modulo === 'participaciones') {
          renderPersonas();
          renderActividades();
          renderParticipaciones();
          llenarSelectores();
          MODULOS_CARGADOS.add('personas');
          MODULOS_CARGADOS.add('actividades');
        }
        if (modulo === 'demanda') renderDemanda();
        if (modulo === 'catalogos') {
          MODULOS_CARGADOS.add('personas');
          MODULOS_CARGADOS.add('actividades');
          llenarSelectores();
        }
        mostrarCarga(false);
        if (alTerminar) alTerminar();
      })
      .withFailureHandler(error => {
        mostrarCarga(false);
        notificar(error.message || String(error), true);
      })
      .obtenerDatosModulo(modulo);
  }
  function renderGraficos() {

    const g = DB.graficos;
    const specs = [
      ['chartEstados', 'doughnut', g.actividadesPorEstado, false],
      ['chartEscuelas', 'doughnut', g.actividadesPorEscuela, false],
      ['chartResultados', 'doughnut', g.resultados, false],

    ];
    specs.forEach(([id, tipo, datos, horizontal]) => {

  function crearGrafico(id, tipo, datos, horizontal=false) {
    if (!datos || !datos.length) return;
    const el = document.getElementById(id);
    if (!el) return;
    if (charts[id]) charts[id].destroy();
    const paletaModerna = [
      '#1e3a8a', '#10b981', '#f59e0b', '#ef4444',
      '#8b5cf6', '#0ea5e9', '#6366f1', '#ec4899',
      '#14b8a6', '#f97316'
    ];
    const etiquetasCompletas = datos.map(x => String(x.nombre || 'No informado'));
    const etiquetasCortas = tipo === 'bar'
      ? etiquetasCompletas.map(t => t.length > 32 ? t.slice(0, 30) + '…' : t)
      : etiquetasCompletas;
    const colores = datos.map((_, i) => paletaModerna[i % paletaModerna.length]);
    const total = datos.reduce((s, x) => s + Number(x.valor || 0), 0);
    charts[id] = new Chart(el, {
      type: tipo,
      data: {
        labels: etiquetasCortas,
        datasets: [{
          data: datos.map(x => x.valor),
          backgroundColor: colores,
          borderRadius: tipo === 'bar' ? 6 : 0,
          borderWidth: tipo === 'doughnut' ? 2 : 0,
          borderColor: '#ffffff'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        indexAxis: horizontal ? 'y' : 'x',
        plugins: {
          legend: {
            display: tipo === 'doughnut',
            position: 'bottom',
            labels: { boxWidth: 12, padding: 14, font: { size: 12, family: '-apple-system, BlinkMacSystemFont, Segoe UI, Roboto' } }
          },
          tooltip: {
            padding: 10,
            cornerRadius: 8,
            boxPadding: 4,
            callbacks: {
              title: items => {
                const idx = items?.[0]?.dataIndex ?? 0;
                return etiquetasCompletas[idx] || '';
              },
              label: ctx => {
                const val = Number(ctx.raw || 0);
                const pct = total > 0 ? ((val / total) * 100).toFixed(1) : '0.0';
                return ` ${val.toLocaleString('es-CL')} (${pct}%)`;
              }
            }
          }
        },
        scales: tipo === 'bar' ? {
          y: horizontal ? {} : { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { precision: 0 } },
          x: horizontal ? { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { precision: 0 } } : { grid: { display: false } }
        } : {}
      }
    });
  }

  function paginarFilas_(tipo, filas) {
    const estado = PAGINACION[tipo];
    const paginas = Math.max(1, Math.ceil(filas.length / estado.tamano));
    estado.pagina = Math.min(Math.max(1, estado.pagina), paginas);
    const inicio = (estado.pagina - 1) * estado.tamano;
    const info = document.getElementById(`pagina${tipo.charAt(0).toUpperCase() + tipo.slice(1)}Info`);
    if (info) {
      const desde = filas.length ? inicio + 1 : 0;
      const hasta = Math.min(inicio + estado.tamano, filas.length);
      info.textContent = `${desde}–${hasta} de ${filas.length}`;
    }
    return filas.slice(inicio, inicio + estado.tamano);
  }

      return nombreNorm.includes(query) || (queryLimpia.length >= 2 && rutNorm.includes(queryLimpia)) || correoNorm.includes(query);

  function buscarActividadesPredictivoGen(key, mostrarTodosSiVacio = false) {
    const cfg = CONFIG_BUSCADORES_ACT_GEN[key];
    if (!cfg) return;
    const input = document.getElementById('inputBuscarAct_' + key);
    const dropdown = document.getElementById('dropdownResultadosAct_' + key);
    const btnClear = document.getElementById('btnLimpiarBuscarAct_' + key);
    if (!input || !dropdown) return;

    const textoVal = input.value.trim();
    if (btnClear) {
      btnClear.style.display = textoVal ? 'block' : 'none';
    }

    const query = normalizar(textoVal);
    cfg.indiceTeclado = -1;

    const idDestinoGestion = cfg.excluirDestinoGestion ? String(document.getElementById('gestionActividad')?.value || '').trim() : '';

    let pool = (DB.actividades || []).filter(a => {
      if (esActividadArchivada_(a)) return false;
      if (idDestinoGestion && String(a.ID_ACTIVIDAD || '').trim() === idDestinoGestion) return false;
      return true;
    });

    if (cfg.filtro === 'activas') {
      pool = pool.filter(a => {
        const est = normalizar(a.ESTADO_ACTIVIDAD || '');
        return est === 'planificada' || est === 'difusion' || est === 'difusión' ||
               est === 'inscripcion abierta' || est === 'inscripción abierta' ||
               est === 'en ejecucion' || est === 'en ejecución' || !est;
      });
    } else if (cfg.filtro === 'finalizadas') {
      pool = pool.filter(a => {
        const est = normalizar(a.ESTADO_ACTIVIDAD || '');
        return est === 'ejecutada' || est === 'cerrada' || est === 'suspendida';
      });
    }

    pool.sort(compararActividadesRecientes);

    let coincidencias = [];
    if (query.length > 0) {
      coincidencias = pool.filter(a => {
        const idNorm = normalizar(a.ID_ACTIVIDAD || '');
        const nombreNorm = normalizar(a.NOMBRE_ACTIVIDAD || '');
        const relatorNorm = normalizar(a.RELATOR || a.DOCENTE || a.RESPONSABLE || '');
        const escuelaNorm = normalizar(a.ESCUELA_LINEA || a.PROGRAMA || '');
        const areaNorm = normalizar(a.AREA_TEMATICA || '');
        return idNorm.includes(query) || nombreNorm.includes(query) ||
               relatorNorm.includes(query) || escuelaNorm.includes(query) ||
               areaNorm.includes(query);
      }).slice(0, 15);
    } else if (mostrarTodosSiVacio || document.activeElement === input) {
      coincidencias = pool.slice(0, 15);
    } else {
      dropdown.style.display = 'none';
      return;
    }

    if (coincidencias.length === 0) {
      dropdown.innerHTML = `
        <div style="padding:14px; text-align:center; color:var(--gris,#64748b); font-size:13px;">
          No se encontraron actividades con ese criterio.
          <br><small style="color:#94a3b8;">Pruebe cambiando el filtro a "Todas" o ajustando el texto de búsqueda.</small>
        </div>
      `;
      dropdown.style.display = 'block';
      return;
    }

    dropdown.innerHTML = coincidencias.map((a, idx) => {
      const id = esc(a.ID_ACTIVIDAD);
      const nombre = esc(a.NOMBRE_ACTIVIDAD);
      const estado = a.ESTADO_ACTIVIDAD || 'Planificada';
      const badgeClase = obtenerBadgeClaseEstadoActividad(estado);
      const fecha = fechaActividadVisible(a.FECHA_INICIO);
      const fechaFin = a.FECHA_TERMINO ? fechaActividadVisible(a.FECHA_TERMINO) : '';
      const rangoFecha = fecha ? (fechaFin && fechaFin !== fecha ? `${fecha} al ${fechaFin}` : fecha) : 'Sin fecha';
      const escuela = esc(a.ESCUELA_LINEA || a.PROGRAMA || '');
      const modalidad = esc(a.MODALIDAD || 'Presencial');
      const cupos = a.CUPOS || a.CUPOS_TOTALES ? `${esc(a.CUPOS || a.CUPOS_TOTALES)} cupos` : '';

      return `
        <div class="predictivo-actividad-item" data-id="${id}" data-index="${idx}" onclick="seleccionarActividadGen('${key}', '${id}')">
          <div class="predictivo-act-info">
            <div class="predictivo-act-header">
              <span class="badge-actividad-id">${id}</span>
              <span class="badge ${badgeClase}" style="font-size:10.5px; padding:1px 6px;">${esc(estado)}</span>
              <span class="badge-subtle" style="font-size:10.5px;">${modalidad}</span>
            </div>
            <strong class="predictivo-act-nombre">${esc(formatearNombreCapacitacion(a.NOMBRE_ACTIVIDAD))}</strong>
            <div class="predictivo-act-meta">
              <span>📅 ${esc(rangoFecha)}</span>

              ${cupos ? `<span>👥 ${cupos}</span>` : ''}
            </div>

          <span class="btn secondary compact" style="padding:4px 10px; font-size:11px; white-space:nowrap;">Elegir</span>
        </div>
      `;
    }).join('');

    dropdown.style.display = 'block';
  }

  function manejarTecladoActividadGen(e, key) {
    const cfg = CONFIG_BUSCADORES_ACT_GEN[key];
    if (!cfg) return;
    const dropdown = document.getElementById('dropdownResultadosAct_' + key);
    if (!dropdown || dropdown.style.display === 'none') return;
    const items = dropdown.querySelectorAll('.predictivo-actividad-item');
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      cfg.indiceTeclado = Math.min(cfg.indiceTeclado + 1, items.length - 1);
      items.forEach((item, idx) => {
        const sel = idx === cfg.indiceTeclado;
        item.classList.toggle('keyboard-selected', sel);
        if (sel) item.scrollIntoView({ block: 'nearest' });
      });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      cfg.indiceTeclado = Math.max(cfg.indiceTeclado - 1, 0);
      items.forEach((item, idx) => {
        const sel = idx === cfg.indiceTeclado;
        item.classList.toggle('keyboard-selected', sel);
        if (sel) item.scrollIntoView({ block: 'nearest' });
      });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (cfg.indiceTeclado >= 0 && cfg.indiceTeclado < items.length) {
        const id = items[cfg.indiceTeclado].dataset.id;

  function buscarActividadesPredictivoCom(mostrarTodosSiVacio = false) {
    const input = document.getElementById('inputBuscarActividadCom');
    const dropdown = document.getElementById('dropdownResultadosActividadesCom');
    const btnClear = document.getElementById('btnLimpiarBuscarActCom');
    if (!input || !dropdown) return;

    const textoVal = input.value.trim();
    if (btnClear) {
      btnClear.style.display = textoVal ? 'block' : 'none';
    }

    const query = normalizar(textoVal);
    INDICE_TECLADO_ACTIVIDADES_COM = -1;

    let pool = (DB.actividades || []).filter(a => !esActividadArchivada_(a));

    if (FILTRO_ESTADO_ACTIVIDADES_COM === 'activas') {
      pool = pool.filter(a => {
        const est = normalizar(a.ESTADO_ACTIVIDAD || '');
        return est === 'planificada' || est === 'difusion' || est === 'difusión' ||
               est === 'inscripcion abierta' || est === 'inscripción abierta' ||
               est === 'en ejecucion' || est === 'en ejecución' || !est;
      });
    } else if (FILTRO_ESTADO_ACTIVIDADES_COM === 'finalizadas') {
      pool = pool.filter(a => {
        const est = normalizar(a.ESTADO_ACTIVIDAD || '');
        return est === 'ejecutada' || est === 'cerrada' || est === 'suspendida';
      });
    }

    pool.sort(compararActividadesRecientes);

    let coincidencias = [];
    if (query.length > 0) {
      coincidencias = pool.filter(a => {
        const idNorm = normalizar(a.ID_ACTIVIDAD || '');
        const nombreNorm = normalizar(a.NOMBRE_ACTIVIDAD || '');
        const relatorNorm = normalizar(a.RELATOR || a.DOCENTE || '');
        const escuelaNorm = normalizar(a.ESCUELA_LINEA || a.PROGRAMA || '');
        const areaNorm = normalizar(a.AREA_TEMATICA || '');
        return idNorm.includes(query) || nombreNorm.includes(query) ||
               relatorNorm.includes(query) || escuelaNorm.includes(query) ||
               areaNorm.includes(query);
      }).slice(0, 15);
    } else if (mostrarTodosSiVacio || document.activeElement === input) {
      coincidencias = pool.slice(0, 15);
    } else {
      dropdown.style.display = 'none';
      return;
    }

    if (coincidencias.length === 0) {
      dropdown.innerHTML = `
        <div style="padding:14px; text-align:center; color:var(--gris,#64748b); font-size:13px;">
          No se encontraron actividades con ese criterio.
          <br><small style="color:#94a3b8;">Pruebe cambiando el filtro a "Todas" o ajustando el texto de búsqueda.</small>
        </div>
      `;
      dropdown.style.display = 'block';
      return;
    }

    dropdown.innerHTML = coincidencias.map((a, idx) => {
      const id = esc(a.ID_ACTIVIDAD);
      const nombre = esc(a.NOMBRE_ACTIVIDAD);
      const estado = a.ESTADO_ACTIVIDAD || 'Planificada';
      const badgeClase = obtenerBadgeClaseEstadoActividad(estado);
      const fecha = fechaActividadVisible(a.FECHA_INICIO);
      const fechaFin = a.FECHA_TERMINO ? fechaActividadVisible(a.FECHA_TERMINO) : '';
      const rangoFecha = fecha ? (fechaFin && fechaFin !== fecha ? `${fecha} al ${fechaFin}` : fecha) : 'Sin fecha';
      const escuela = esc(a.ESCUELA_LINEA || a.PROGRAMA || '');
      const modalidad = esc(a.MODALIDAD || 'Presencial');
      const cupos = a.CUPOS || a.CUPOS_TOTALES ? `${esc(a.CUPOS || a.CUPOS_TOTALES)} cupos` : '';

      return `
        <div class="predictivo-actividad-item" data-id="${id}" data-index="${idx}" onclick="seleccionarActividadCom('${id}')">
          <div class="predictivo-act-info">
            <div class="predictivo-act-header">
              <span class="badge-actividad-id">${id}</span>
              <span class="badge ${badgeClase}" style="font-size:10.5px; padding:1px 6px;">${esc(estado)}</span>
              <span class="badge-subtle" style="font-size:10.5px;">${modalidad}</span>
            </div>
            <strong class="predictivo-act-nombre">${nombre}</strong>
            <div class="predictivo-act-meta">
              <span>📅 ${esc(rangoFecha)}</span>
              ${escuela ? `<span>🏫 ${escuela}</span>` : ''}
              ${cupos ? `<span>👥 ${cupos}</span>` : ''}
            </div>
          </div>
          <span class="btn secondary compact" style="padding:4px 10px; font-size:11px; white-space:nowrap;">Elegir</span>
        </div>
      `;
    }).join('');

    dropdown.style.display = 'block';
  }

  function manejarTecladoActividadCom(e) {
    const dropdown = document.getElementById('dropdownResultadosActividadesCom');
    if (!dropdown || dropdown.style.display === 'none') return;
    const items = dropdown.querySelectorAll('.predictivo-actividad-item');
    if (!items.length) return;

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      INDICE_TECLADO_ACTIVIDADES_COM = Math.min(INDICE_TECLADO_ACTIVIDADES_COM + 1, items.length - 1);
      actualizarSeleccionTecladoActividadCom_(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      INDICE_TECLADO_ACTIVIDADES_COM = Math.max(INDICE_TECLADO_ACTIVIDADES_COM - 1, 0);
      actualizarSeleccionTecladoActividadCom_(items);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (INDICE_TECLADO_ACTIVIDADES_COM >= 0 && INDICE_TECLADO_ACTIVIDADES_COM < items.length) {
        const id = items[INDICE_TECLADO_ACTIVIDADES_COM].dataset.id;
        if (id) seleccionarActividadCom(id);
      }
    } else if (e.key === 'Escape') {
      dropdown.style.display = 'none';
    }
  }

  function esActividadArchivada_(actividad) {
    return normalizar(actividad?.ESTADO_ACTIVIDAD) === 'archivada';
  }
  function compararActividadesRecientes(a, b) {
    const fechaA = fechaActividadNumero(a.FECHA_INICIO);
    const fechaB = fechaActividadNumero(b.FECHA_INICIO);
    if (fechaA && fechaB && fechaA !== fechaB) {
      return fechaB - fechaA;
    }
    if (fechaA && !fechaB) return -1;
    if (!fechaA && fechaB) return 1;

    const claveA = claveCorrelativaActividad(a.ID_ACTIVIDAD);
    const claveB = claveCorrelativaActividad(b.ID_ACTIVIDAD);
    const anioA = Number(a.ANO || claveA.anio || 0);
    const anioB = Number(b.ANO || claveB.anio || 0);
    if (anioA !== anioB) return anioB - anioA;
    if (claveA.numero !== claveB.numero) return claveB.numero - claveA.numero;
    return Number(b._ordenIngreso || 0) - Number(a._ordenIngreso || 0);
  }
  function claveCorrelativaActividad(idActividad) {
    const texto = String(idActividad || '').trim().toUpperCase();
    const coincidencia = texto.match(/(\d{4})\D+(\d+)\s*$/);
    if (coincidencia) {
      return {anio: Number(coincidencia[1]) || 0, numero: Number(coincidencia[2]) || 0};
    }
    const numeros = texto.match(/\d+/g) || [];
    return {
      anio: Number(numeros.length > 1 ? numeros[numeros.length - 2] : 0) || 0,
      numero: Number(numeros.length ? numeros[numeros.length - 1] : 0) || 0
    };
  }
  function fechaActividadNumero(valor) {
    const texto = String(valor || '').trim();
    if (!texto) return 0;
    let coincidencia = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (coincidencia) {
      return new Date(Number(coincidencia[1]), Number(coincidencia[2]) - 1, Number(coincidencia[3])).getTime();
    }
    coincidencia = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (coincidencia) {
      return new Date(Number(coincidencia[3]), Number(coincidencia[2]) - 1, Number(coincidencia[1])).getTime();
    }
    const fecha = new Date(texto);
    return Number.isNaN(fecha.getTime()) ? 0 : fecha.getTime();
  }
  function fechaActividadVisible(valor) {
    const texto = String(valor || '').trim();
    if (!texto) return '';
    let coincidencia = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (coincidencia) {
      return `${String(coincidencia[3]).padStart(2,'0')}-${String(coincidencia[2]).padStart(2,'0')}-${coincidencia[1]}`;
    }
    coincidencia = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (coincidencia) {
      return `${String(coincidencia[1]).padStart(2,'0')}-${String(coincidencia[2]).padStart(2,'0')}-${coincidencia[3]}`;
    }
    return texto;
  }

  function poblarAreas(selectorId, linea, incluirTodas=false) {
    const selector = document.getElementById(selectorId);
    if (!selector) return;
    const opciones = AREAS_POR_LINEA[linea] || [];

  function agregarInteresNuevaPersona() {
    const linea = document.getElementById('personaInteresEscuela')?.value || '';
    const area = document.getElementById('personaInteresArea')?.value || '';
    if (!linea || !area) return notificar('Seleccione una escuela / línea y un área temática.', true);
    const clave = normalizar(linea) + '|' + normalizar(area);
    if (NUEVOS_INTERESES.some(x => normalizar(x.ESCUELA_LINEA) + '|' + normalizar(x.AREA_TEMATICA) === clave)) {

  function seleccionarCantidadComunicacion() {
    const entrada = document.getElementById('comCantidad');
    const cantidad = Number(entrada?.value || 0);
    if (!Number.isInteger(cantidad) || cantidad < 1) {
      return notificar('Ingrese una cantidad válida de personas.', true);
    }
    const disponibles = [];
    const correosVistos = new Set();
    destinatariosVisibles().forEach(p => {
      const correo = String(p.CORREO || '').trim().toLowerCase();
      if (!correoEsValidoCliente_(correo) || correosVistos.has(correo)) return;
      correosVistos.add(correo);
      disponibles.push(p);
    });
    COMUNICACION_SELECCIONADOS.clear();
    disponibles.slice(0, cantidad).forEach(p => COMUNICACION_SELECCIONADOS.add(String(p.ID_PERSONA)));
    renderComunicaciones();
    const seleccionadas = Math.min(cantidad, disponibles.length);
    notificar(seleccionadas < cantidad
      ? `Se seleccionaron las ${seleccionadas} personas más recientes: no hay más correos únicos disponibles en el resultado visible.`
      : `Se seleccionaron las ${seleccionadas} personas más recientes con correo.`);
  }

    const seleccionadas = (COMUNICACIONES.destinatarios || []).filter(p =>
      COMUNICACION_SELECCIONADOS.has(String(p.ID_PERSONA))
    );
    const cantidad = correosUnicosValidos_(seleccionadas).length;

  async function copiarCorreosCCO() {
    const correos = correosUnicosValidos_((COMUNICACIONES.destinatarios || [])
      .filter(p => COMUNICACION_SELECCIONADOS.has(String(p.ID_PERSONA))));
    if (!correos.length) return notificar('No hay correos seleccionados para copiar.', true);
    await copiarTextoPortapapeles_(correos.join('; '));
    notificar('Se copiaron ' + correos.length + ' correos para CCO.');

  function correoEsValidoCliente_(correo) {
    return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(correo || '').trim());
  }
  function correosUnicosValidos_(personas) {
    return [...new Set((personas || [])
      .map(p => String(p.CORREO || '').trim().toLowerCase())
      .filter(correoEsValidoCliente_))];
  }
  async function copiarTextoPortapapeles_(contenido) {
    try {
      await navigator.clipboard.writeText(contenido);
    } catch (error) {
      const auxiliar = document.createElement('textarea');
      auxiliar.value = contenido;
      document.body.appendChild(auxiliar);
      auxiliar.select();
      document.execCommand('copy');
      auxiliar.remove();
    }
  }

  function seleccionarActividadesCartelera(modo) {
    CARTELERA.seleccionadas.clear();
    const actividades = (DB.actividades || []).filter(a => !esActividadArchivada_(a));

    if (modo === 'activas') {
      actividades.forEach(a => {
        const est = String(a.ESTADO_ACTIVIDAD || '').toLowerCase();
        if (est.includes('abierta') || est.includes('difusi') || est.includes('planific') || est.includes('ejecuci')) {
          CARTELERA.seleccionadas.add(String(a.ID_ACTIVIDAD));
        }
      });
      if (CARTELERA.seleccionadas.size === 0) {
        actividades.slice(0, 8).forEach(a => CARTELERA.seleccionadas.add(String(a.ID_ACTIVIDAD)));
      }
    } else if (modo === 'todas') {
      actividades.forEach(a => CARTELERA.seleccionadas.add(String(a.ID_ACTIVIDAD)));
    }

    renderListaSeleccionCartelera();
    actualizarVistaPreviaCartelera();

  function resolverUrlFormularioActividad_(actividad) {
    if (actividad.LINK_INSCRIPCION && String(actividad.LINK_INSCRIPCION).trim().startsWith('http')) {
      return String(actividad.LINK_INSCRIPCION).trim();
    }
    const idAct = String(actividad.ID_ACTIVIDAD || '').trim();
    const cfgForm = (FORMULARIOS || []).find(f => String(f.idActividad || '').trim() === idAct);
    if (cfgForm && cfgForm.formUrlPublica) {
      return String(cfgForm.formUrlPublica).trim();

    return '';

  function formatearFechaTextoCartelera_(fechaStr) {
    if (!fechaStr) return '';
    const visible = fechaActividadVisible(fechaStr);
    const partes = visible.split('-');
    if (partes.length === 3) {
      const meses = ['', 'enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const dia = parseInt(partes[0], 10);
      const mesNum = parseInt(partes[1], 10);
      const anio = partes[2];
      if (mesNum >= 1 && mesNum <= 12) {
        return `${dia} de ${meses[mesNum]} (${visible})`;
      }
    }
    return visible;
  }

  function actualizarVistaPreviaCartelera() {
    const html = generarHtmlCartelera();
    CARTELERA.htmlGenerado = html;

    const wrapper = document.getElementById('previewEmailIframeWrapper');
    if (!wrapper) return;
    wrapper.innerHTML = html;
  }

  async function copiarHtmlCartelera() {
    if (!CARTELERA.htmlGenerado) actualizarVistaPreviaCartelera();
    await copiarTextoPortapapeles_(CARTELERA.htmlGenerado);
    notificar('✓ Código HTML copiado al portapapeles. Listo para pegar en tu plataforma de correo.');
  }

  async function copiarDisenoCartelera() {
    if (!CARTELERA.htmlGenerado) actualizarVistaPreviaCartelera();
    try {
      const blobHtml = new Blob([CARTELERA.htmlGenerado], { type: 'text/html' });
      const blobText = new Blob([CARTELERA.htmlGenerado], { type: 'text/plain' });
      const data = [new ClipboardItem({ 'text/html': blobHtml, 'text/plain': blobText })];
      await navigator.clipboard.write(data);
      notificar('✓ Diseño formateado copiado. Puedes pegarlo directamente (Ctrl+V) en Gmail o Outlook.');
    } catch (e) {
      await copiarTextoPortapapeles_(CARTELERA.htmlGenerado);
      notificar('✓ Código copiado al portapapeles.');
    }
  }

  function enviarPruebaCartelera() {
    if (!CARTELERA.htmlGenerado) actualizarVistaPreviaCartelera();
    if (CARTELERA.seleccionadas.size === 0) {
      return notificar('Seleccione al menos una actividad para generar la cartelera.', true);
    }
    const titulo = document.getElementById('carteleraTitulo')?.value || 'Cartelera de Capacitaciones';
    mostrarCarga(true, 'Enviando correo de prueba...');
    google.script.run
      .withSuccessHandler(r => {
        mostrarCarga(false);
        notificar(r.mensaje || 'Correo de prueba enviado con éxito.');
      })
      .withFailureHandler(err => {
        mostrarCarga(false);
        notificar(err.message || String(err), true);
      })
      .enviarPruebaCarteleraCorreo({
        html: CARTELERA.htmlGenerado,
        asunto: 'Prueba: ' + titulo
      });
  }

  function actualizarAreasActividad() {
    const linea = document.getElementById('escuelaLineaActividad')?.value || '';
    const selectorArea = document.getElementById('areaTematicaActividad');
    if (!selectorArea) return;
    const opciones = AREAS_POR_LINEA[linea] || [];
    selectorArea.innerHTML = opciones.length
      ? '<option value="">Seleccione un área temática...</option>' +
        opciones.map(area => `<option value="${esc(area)}">${esc(area)}</option>`).join('')
      : '<option value="">Primero seleccione una escuela o línea...</option>';
    selectorArea.disabled = opciones.length === 0;
    selectorArea.value = '';
  }
  function actualizarAreasEdicionActividad(valorActual) {
    const linea = document.getElementById('editarEscuelaLinea')?.value || '';
    const selectorArea = document.getElementById('editarAreaTematica');
    if (!selectorArea) return;
    const actual = valorActual !== undefined ? String(valorActual || '').trim() : String(selectorArea.value || '').trim();
    const opciones = (AREAS_POR_LINEA[linea] || []).slice();
    if (actual && !opciones.includes(actual)) {
      opciones.unshift(actual);
    }
    selectorArea.innerHTML = opciones.length
      ? '<option value="">Seleccione un área temática...</option>' +
        opciones.map(area => `<option value="${esc(area)}">${esc(area)}</option>`).join('')
      : '<option value="">Primero seleccione una escuela o línea...</option>';
    selectorArea.disabled = opciones.length === 0;
    selectorArea.value = actual && opciones.includes(actual) ? actual : (opciones.length > 0 ? (opciones.includes(selectorArea.value) ? selectorArea.value : '') : '');
  }

  // --- GESTIÓN DE CRONOGRAMA Y SESIONES ---
  const SESIONES_CRONOGRAMA = {
    reg: [],
    edit: []
  };

  function alternarDiaSemana(prefijo, diaNum) {
    const contenedor = document.getElementById(`${prefijo}DiasSemana`);
    if (!contenedor) return;
    const btn = contenedor.querySelector(`[data-dia="${diaNum}"]`);
    if (!btn) return;
    btn.classList.toggle('active');
    sincronizarHorarioTexto(prefijo, true);
  }

  function obtenerDiasSeleccionados(prefijo) {
    const contenedor = document.getElementById(`${prefijo}DiasSemana`);
    if (!contenedor) return [];
    const btns = contenedor.querySelectorAll('.day-toggle-btn.active');
    return Array.from(btns).map(b => Number(b.dataset.dia)).sort((a, b) => a - b);
  }

  function sincronizarHorarioTexto(prefijo, forzar=false) {
    const inputHorario = document.getElementById(`${prefijo}HorarioTexto`);
    if (!inputHorario) return;
    if (!forzar && inputHorario.value && !inputHorario.dataset.auto) {
      return;
    }
    const dias = obtenerDiasSeleccionados(prefijo);
    const hInicio = document.getElementById(`${prefijo}HoraInicio`)?.value || '';
    const hFin = document.getElementById(`${prefijo}HoraFin`)?.value || '';

    if (!dias.length && !hInicio) return;

    const nombresDias = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 0: 'Domingo' };
    let textoDias = '';
    if (dias.length === 1) {
      textoDias = nombresDias[dias[0]];
    } else if (dias.length > 1) {
      const arr = dias.map(d => nombresDias[d]);
      const ultimo = arr.pop();
      textoDias = arr.join(', ') + ' y ' + ultimo;
    }

    let textoHoras = '';
    if (hInicio && hFin) textoHoras = `${hInicio} a ${hFin}`;
    else if (hInicio) textoHoras = `desde ${hInicio}`;

    const resumen = [textoDias, textoHoras].filter(Boolean).join(' ');
    if (resumen) {
      inputHorario.value = resumen;
      inputHorario.dataset.auto = '1';
    }
  }

  function sincronizarFechaInicioFormulario(prefijo) {
    const fiVal = document.getElementById(`${prefijo}FechaInicio`)?.value;
    if (!fiVal) return;
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (sesiones.length > 0) {
      sesiones[0].fecha = fiVal;
      if (sesiones.length === 1) {
        const ft = document.getElementById(`${prefijo}FechaTermino`);
        if (ft && !ft.value) ft.value = fiVal;
      }
      renderSesionesProgramadas(prefijo);
      sincronizarSesionesEnFormulario(prefijo);
    }
  }

  function sincronizarFechaTerminoFormulario(prefijo) {
    const ftVal = document.getElementById(`${prefijo}FechaTermino`)?.value;
    if (!ftVal) return;
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (sesiones.length > 0) {
      if (sesiones.length === 1) {
        const fi = document.getElementById(`${prefijo}FechaInicio`);
        if (!fi?.value) {
          if (fi) fi.value = ftVal;
          sesiones[0].fecha = ftVal;
        }
      } else {
        sesiones[sesiones.length - 1].fecha = ftVal;
      }
      renderSesionesProgramadas(prefijo);
      sincronizarSesionesEnFormulario(prefijo);
    }
  }

  function sincronizarContadorSesiones(prefijo) {
    const totalSes = parseInt(document.getElementById(`${prefijo}SesionesTotales`)?.value || '1', 10);
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (sesiones.length > 0 && totalSes >= 1) {
      if (totalSes < sesiones.length) {
        SESIONES_CRONOGRAMA[prefijo] = sesiones.slice(0, totalSes);
        renderSesionesProgramadas(prefijo);
        sincronizarSesionesEnFormulario(prefijo);
        const ft = document.getElementById(`${prefijo}FechaTermino`);
        if (ft && SESIONES_CRONOGRAMA[prefijo].length > 0) {
          ft.value = SESIONES_CRONOGRAMA[prefijo][SESIONES_CRONOGRAMA[prefijo].length - 1].fecha || '';
        }
      }
    }
  }

  function generarCronogramaAutomatico(prefijo) {
    const fInicioVal = document.getElementById(`${prefijo}FechaInicio`)?.value;
    if (!fInicioVal) {
      notificar('Por favor seleccione una Fecha de Inicio antes de generar el cronograma.', true);
      document.getElementById(`${prefijo}FechaInicio`)?.focus();
      return;
    }
    const totalSesiones = Math.max(1, parseInt(document.getElementById(`${prefijo}SesionesTotales`)?.value || '1', 10));
    let diasSeleccionados = obtenerDiasSeleccionados(prefijo);

    const partes = fInicioVal.split('-');
    let cursorFecha = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12, 0, 0);

    if (diasSeleccionados.length === 0) {
      const diaInicio = cursorFecha.getDay();
      diasSeleccionados = [diaInicio];
      const btn = document.getElementById(`${prefijo}DiasSemana`)?.querySelector(`[data-dia="${diaInicio}"]`);
      if (btn) btn.classList.add('active');
    }

    const hInicio = document.getElementById(`${prefijo}HoraInicio`)?.value || '10:00';
    const hFin = document.getElementById(`${prefijo}HoraFin`)?.value || '12:00';

    const sesiones = [];
    let intentos = 0;
    while (sesiones.length < totalSesiones && intentos < 500) {
      const diaSemana = cursorFecha.getDay();
      if (diasSeleccionados.includes(diaSemana)) {
        sesiones.push({
          numero: sesiones.length + 1,
          fecha: formatoClaveFecha(cursorFecha),
          horaInicio: hInicio,
          horaFin: hFin
        });
      }
      cursorFecha.setDate(cursorFecha.getDate() + 1);
      intentos++;
    }

    SESIONES_CRONOGRAMA[prefijo] = sesiones;

    if (sesiones.length > 0) {
      const inputTermino = document.getElementById(`${prefijo}FechaTermino`);
      if (inputTermino) {
        inputTermino.value = sesiones[sesiones.length - 1].fecha;
      }
    }

    renderSesionesProgramadas(prefijo);
    sincronizarHorarioTexto(prefijo, true);
    sincronizarSesionesEnFormulario(prefijo);
    notificar(`Se programaron ${sesiones.length} sesiones.`);
  }

  function agregarSesionFila(prefijo) {
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    let fechaSugerida = '';
    const hInicio = document.getElementById(`${prefijo}HoraInicio`)?.value || '10:00';
    const hFin = document.getElementById(`${prefijo}HoraFin`)?.value || '12:00';

    if (sesiones.length > 0) {
      const ult = sesiones[sesiones.length - 1];
      const partes = (ult.fecha || '').split('-');
      if (partes.length === 3) {
        const d = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]), 12, 0, 0);
        d.setDate(d.getDate() + 7);
        fechaSugerida = formatoClaveFecha(d);
      }
    } else {
      fechaSugerida = document.getElementById(`${prefijo}FechaInicio`)?.value || formatoClaveFecha(new Date());
    }

    sesiones.push({
      numero: sesiones.length + 1,
      fecha: fechaSugerida,
      horaInicio: hInicio,
      horaFin: hFin
    });

    SESIONES_CRONOGRAMA[prefijo] = sesiones;

    const inputTotales = document.getElementById(`${prefijo}SesionesTotales`);
    if (inputTotales) inputTotales.value = sesiones.length;

    const inputTermino = document.getElementById(`${prefijo}FechaTermino`);
    if (inputTermino && fechaSugerida) inputTermino.value = fechaSugerida;

    renderSesionesProgramadas(prefijo);
    sincronizarSesionesEnFormulario(prefijo);
  }

  function quitarSesionFila(prefijo, index) {
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (index >= 0 && index < sesiones.length) {
      sesiones.splice(index, 1);
      sesiones.forEach((s, i) => { s.numero = i + 1; });
      SESIONES_CRONOGRAMA[prefijo] = sesiones;

      const inputTotales = document.getElementById(`${prefijo}SesionesTotales`);
      if (inputTotales && sesiones.length > 0) inputTotales.value = sesiones.length;

      if (sesiones.length > 0) {
        const fi = document.getElementById(`${prefijo}FechaInicio`);
        if (fi && sesiones[0].fecha) fi.value = sesiones[0].fecha;
        const ft = document.getElementById(`${prefijo}FechaTermino`);
        if (ft && sesiones[sesiones.length - 1].fecha) ft.value = sesiones[sesiones.length - 1].fecha;
      }

      renderSesionesProgramadas(prefijo);
      sincronizarSesionesEnFormulario(prefijo);
    }
  }

  function cambiarFechaSesion(prefijo, index, nuevaFecha) {
    if (SESIONES_CRONOGRAMA[prefijo] && SESIONES_CRONOGRAMA[prefijo][index]) {
      SESIONES_CRONOGRAMA[prefijo][index].fecha = nuevaFecha;
      if (index === 0) {
        const fi = document.getElementById(`${prefijo}FechaInicio`);
        if (fi) fi.value = nuevaFecha;
      }
      if (index === SESIONES_CRONOGRAMA[prefijo].length - 1) {
        const ft = document.getElementById(`${prefijo}FechaTermino`);
        if (ft) ft.value = nuevaFecha;
      }
      sincronizarSesionesEnFormulario(prefijo);
    }
  }

  function cambiarHoraSesion(prefijo, index, campo, nuevoValor) {
    if (SESIONES_CRONOGRAMA[prefijo] && SESIONES_CRONOGRAMA[prefijo][index]) {
      SESIONES_CRONOGRAMA[prefijo][index][campo] = nuevoValor;
      sincronizarSesionesEnFormulario(prefijo);
    }
  }

  function sincronizarSesionesEnFormulario(prefijo) {
    const jsonInput = document.getElementById(`${prefijo}DetalleSesionesJson`);
    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (jsonInput) {
      jsonInput.value = sesiones.length > 0 ? JSON.stringify(sesiones) : '';
    }
  }

  function renderSesionesProgramadas(prefijo) {
    const contenedor = document.getElementById(`${prefijo}ContenedorSesiones`);
    const lista = document.getElementById(`${prefijo}ListaSesiones`);
    if (!contenedor || !lista) return;

    const sesiones = SESIONES_CRONOGRAMA[prefijo] || [];
    if (sesiones.length === 0) {
      contenedor.style.display = 'none';
      lista.innerHTML = '';
      return;
    }

    contenedor.style.display = 'block';
    lista.innerHTML = sesiones.map((s, idx) => `
      <div class="session-item-row">
        <div style="font-weight:600;color:var(--primario);font-size:12px">Sesión ${s.numero}</div>
        <div>
          <input type="date" value="${esc(s.fecha || '')}" onchange="cambiarFechaSesion('${prefijo}', ${idx}, this.value)" style="width:100%;font-size:12px;padding:4px 6px">

  function partesFechaPersona(valor) {
    const texto = String(valor || '').trim();
    if (!texto) return null;
    let m = texto.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);
    if (m) {
      return {
        anio: Number(m[1]),
        mes: Number(m[2]),
        dia: Number(m[3])
      };
    }
    m = texto.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})/);
    if (m) {
      return {
        anio: Number(m[3]),
        mes: Number(m[2]),
        dia: Number(m[1])
      };
    }
    return null;
  }
  function calcularEdadDesdeFecha(valor) {
    const partes = partesFechaPersona(valor);
    if (!partes) return '';
    const nacimiento = new Date(partes.anio, partes.mes - 1, partes.dia);
    if (
      nacimiento.getFullYear() !== partes.anio ||
      nacimiento.getMonth() !== partes.mes - 1 ||
      nacimiento.getDate() !== partes.dia
    ) return '';
    const hoy = new Date();
    if (nacimiento.getTime() > hoy.getTime()) return '';
    let edad = hoy.getFullYear() - nacimiento.getFullYear();
    const aunNoCumple =
      hoy.getMonth() < nacimiento.getMonth() ||
      (hoy.getMonth() === nacimiento.getMonth() &&
       hoy.getDate() < nacimiento.getDate());
    if (aunNoCumple) edad--;
    return edad >= 0 && edad <= 120 ? edad : '';
  }
