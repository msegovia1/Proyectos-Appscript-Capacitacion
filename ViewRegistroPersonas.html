<section id="registro-personas" class="view">
  <div class="section-head">
    <div>
      <h2>Registrar persona</h2>
      <p>Incorpore una nueva persona a la base institucional y registre sus intereses formativos.</p>
    </div>
    <button class="btn secondary" type="button" onclick="irAVista('personas')">Ver listado de personas</button>
  </div>
  <div class="card panel">
    <h3>Ficha de nueva persona</h3>
    <form id="formPersona" class="form-grid">
      <div class="field"><label>Tipo de documento *</label><select id="tipoDocumentoPersona" name="TIPO_DOCUMENTO" onchange="actualizarDocumentoPersona()" required><option>RUT</option><option>Pasaporte</option></select></div>
      <div class="field"><label>Número de documento *</label><input id="numeroDocumentoPersona" name="NUMERO_DOCUMENTO" required></div>
      <div class="field"><label>Nombre completo *</label><input name="NOMBRE_COMPLETO" required></div>
      <div class="field"><label>Correo</label><input name="CORREO" type="email"></div>
      <div class="field"><label>Teléfono</label><input name="TELEFONO"></div>
      <div class="field"><label>Comuna</label><input name="COMUNA" value="Santiago"></div>
      <div class="field"><label>Barrio</label><input name="BARRIO"></div>
      <div class="field">
        <label>Fecha de nacimiento</label>
        <input id="fechaNacimientoPersona" name="FECHA_NACIMIENTO" type="date" onchange="actualizarEdadPersona()">
      </div>
      <div class="field">
        <label>Edad actual</label>
        <input id="edadPersona" type="text" readonly placeholder="Se calcula automáticamente">
      </div>
      <div class="field"><label>Género</label><input name="GENERO"></div>
      <div class="field"><label>Nacionalidad</label><input id="nacionalidadPersona" name="NACIONALIDAD"></div>
      <div class="field"><label>Autoriza contacto</label><select name="AUTORIZA_CONTACTO"><option>No informado</option><option>Sí</option><option>No</option></select></div>
      <div class="field"><label>Participa o participó en PMJH</label><select name="PARTICIPA_PMJH"><option>No informado</option><option>Sí</option><option>No</option></select></div>
      <div class="field"><label>Escuela / línea de interés</label><select id="personaInteresEscuela" onchange="actualizarAreasPersonaInteres()"><option value="">Seleccione...</option><option>Empleo</option><option>Emprendimiento</option><option>Transversal</option></select></div>
      <div class="field"><label>Área temática de interés</label><select id="personaInteresArea" disabled><option value="">Primero seleccione una línea...</option></select></div>
      <div class="field"><label>Agregar demanda</label><button class="btn secondary" type="button" onclick="agregarInteresNuevaPersona()">Agregar interés</button></div>
      <div class="field full"><label>Intereses de capacitación declarados</label><div id="personaInteresesSeleccionados" class="notice">Sin intereses agregados. Este dato es opcional.</div></div>
      <div class="field full"><label>Observaciones</label><textarea name="OBSERVACIONES"></textarea></div>
      <div class="form-actions"><button class="btn" type="submit">Guardar persona</button></div>
    </form>
  </div>
</section>
