<style>
  :root {
    --azul: #0b1f3a;
    --azul-2: #1e3a8a;
    --azul-hover: #1d4ed8;
    --celeste: #eff6ff;
    --rojo: #ef4444;
    --rojo-light: #fef2f2;
    --amarillo: #f59e0b;
    --amarillo-light: #fffbeb;
    --verde: #10b981;
    --verde-light: #ecfdf5;
    --fondo: #f8fafc;
    --texto: #0f172a;
    --gris: #64748b;
    --gris-claro: #94a3b8;
    --borde: #e2e8f0;
    --borde-subtle: #f1f5f9;
    --blanco: #ffffff;
    --sombra-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
    --sombra: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
    --sombra-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.08);
    --radius-sm: 6px;
    --radius: 10px;
    --radius-lg: 14px;
    --radius-xl: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--fondo);
    color: var(--texto);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  button, input, select, textarea { font: inherit; }

  .app {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 260px 1fr;
  }

  /* BARRA LATERAL (SIDEBAR) */
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    padding: 24px 16px;
    color: #ffffff;
    background: linear-gradient(180deg, #0b1f3a 0%, #112d52 100%);
    box-shadow: 2px 0 12px rgba(0, 0, 0, 0.08);
    display: flex;
    flex-direction: column;
    z-index: 20;
  }

  .brand {
    padding: 8px 10px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo {
    width: 38px;
    height: 38px;
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .brand-text small {
    display: block;
    font-size: 11px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    opacity: 0.75;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .brand-text strong {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1.2;
    display: block;
  }

  .menu {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-top: 18px;
    overflow-y: auto;
    flex: 1;
    padding-right: 2px;
  }

  .nav-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255, 255, 255, 0.45);
    padding: 12px 12px 6px;
    font-weight: 700;
  }

  .menu button {
    display: flex;
    align-items: center;
    gap: 12px;
    border: 0;
    background: transparent;
    color: rgba(255, 255, 255, 0.75);
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s ease;
    text-align: left;
    width: 100%;
  }

  .menu button .nav-icon {
    font-size: 16px;
    width: 20px;
    text-align: center;
    opacity: 0.85;
  }

  .menu button:hover {
    background: rgba(255, 255, 255, 0.08);
    color: #ffffff;
  }

  .menu button.active {
    background: rgba(255, 255, 255, 0.16);
    color: #ffffff;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
  }

  .sidebar-footer {
    padding: 16px 12px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .badge-version {
    background: rgba(255, 255, 255, 0.15);
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 11px;
    color: #ffffff;
    font-weight: 600;
  }

  /* CONTENIDO PRINCIPAL */
  main {
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* TOPBAR */
  .topbar {
    height: 68px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borde);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .topbar-title-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .topbar h1 {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--texto);
    margin: 0;
  }

  .top-actions {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    color: var(--gris);
    background: var(--fondo);
    border: 1px solid var(--borde);
    padding: 6px 12px;
    border-radius: 20px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    background: var(--verde);
    border-radius: 50%;
    box-shadow: 0 0 0 2px var(--verde-light);
  }

  /* BOTONES */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 1px solid transparent;
    border-radius: var(--radius);
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    background: var(--azul-2);
    color: #ffffff;
    box-shadow: var(--sombra-sm);
  }

  .btn:hover {
    background: var(--azul-hover);
    box-shadow: var(--sombra);
  }

  .btn.secondary {
    background: var(--blanco);
    color: var(--texto);
    border-color: var(--borde);
    box-shadow: var(--sombra-sm);
  }

  .btn.secondary:hover {
    background: var(--fondo);
    border-color: var(--gris-claro);
  }

  .btn.danger {
    background: var(--rojo);
    color: white;
    box-shadow: var(--sombra-sm);
  }

  .btn.danger:hover {
    background: #dc2626;
  }

  .btn.compact {
    padding: 6px 12px;
    font-size: 12.5px;
    border-radius: var(--radius-sm);
  }

  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  /* CONTENEDOR DE CONTENIDO */
  .content {
    padding: 32px;
    max-width: 1600px;
    width: 100%;
    margin: 0 auto;
  }

  .view { display: none; }
  .view.active {
    display: block;
    animation: fadeInView 0.2s ease-out;
  }

  @keyframes fadeInView {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-start;
    margin-bottom: 24px;
  }

  .section-head h2 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.4px;
    color: var(--texto);
  }

  .section-head p {
    margin: 0;
    font-size: 14px;
    color: var(--gris);
  }

  /* TARJETAS & PANELES */
  .card {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    box-shadow: var(--sombra-sm);
    transition: all 0.2s ease;
  }

  .panel {
    padding: 24px;
    margin-bottom: 24px;
  }

  /* KPIS DEL DASHBOARD */
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .kpi {
    padding: 20px;
    border-radius: var(--radius-lg);
    background: var(--blanco);
    border: 1px solid var(--borde);
    box-shadow: var(--sombra-sm);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .kpi:hover {
    transform: translateY(-2px);
    box-shadow: var(--sombra);
    border-color: #bfdbfe;
  }

  .kpi::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--azul-2);
  }

  .kpi:nth-child(2)::before { background: var(--verde); }
  .kpi:nth-child(3)::before { background: var(--amarillo); }
  .kpi:nth-child(4)::before { background: #8b5cf6; }
  .kpi:nth-child(5)::before { background: #0ea5e9; }
  .kpi:nth-child(6)::before { background: var(--verde); }
  .kpi:nth-child(7)::before { background: var(--azul-2); }
  .kpi:nth-child(8)::before { background: var(--amarillo); }
  .kpi:nth-child(9)::before { background: #6366f1; }
  .kpi:nth-child(10)::before { background: #14b8a6; }
  .kpi:nth-child(11)::before { background: #ec4899; }
  .kpi:nth-child(12)::before { background: #f97316; }

  .kpi span {
    color: var(--gris);
    font-size: 11.5px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .kpi strong {
    display: block;
    margin-top: 10px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--texto);
    line-height: 1.1;
  }

  /* GUIA DE KPIS */
  .kpi-guide {
    margin: 0 0 24px;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    background: var(--blanco);
    box-shadow: var(--sombra-sm);
  }

  .kpi-guide summary {
    cursor: pointer;
    list-style: none;
    padding: 14px 18px;
    color: var(--azul-2);
    font-weight: 600;
    font-size: 13.5px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    user-select: none;
    outline: none;
  }

  .kpi-guide summary::-webkit-details-marker { display: none; }
  .kpi-guide summary::after { content: "+"; font-size: 20px; color: var(--azul-2); }
  .kpi-guide[open] summary { border-bottom: 1px solid var(--borde); }
  .kpi-guide[open] summary::after { content: "−"; }

  .kpi-guide-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 16px;
    padding: 18px;
  }

  .kpi-guide-item strong {
    display: block;
    color: var(--texto);
    margin-bottom: 4px;
    font-size: 13px;
  }

  .kpi-guide-item p {
    margin: 0;
    color: var(--gris);
    font-size: 12.5px;
    line-height: 1.45;
  }

  .kpi-formula {
    display: block;
    margin-top: 6px;
    padding: 5px 8px;
    border-radius: var(--radius-sm);
    background: var(--fondo);
    color: var(--texto);
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 11px;
    border: 1px solid var(--borde-subtle);
  }

  /* GRAFICOS */
  .charts {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
  }

  .chart-card {
    padding: 22px;
    min-height: 330px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    box-shadow: var(--sombra-sm);
  }

  .chart-card.wide { grid-column: 1 / -1; }

  .chart-card h3 {
    margin: 0 0 16px;
    font-size: 15px;
    font-weight: 700;
    color: var(--texto);
  }

  .chart-wrap { height: 270px; position: relative; }

  /* TABLAS & HERRAMIENTAS */
  .table-tools {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    align-items: center;
  }

  .table-tools input, .table-tools select {
    max-width: 280px;
    padding: 9px 12px;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    background: var(--blanco);
    font-size: 13.5px;
  }

  .table-container {
    overflow: auto;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    background: var(--blanco);
    box-shadow: var(--sombra-sm);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--blanco);
    font-size: 13.5px;
    min-width: 900px;
  }

  th {
    position: sticky;
    top: 0;
    background: #f8fafc;
    color: var(--gris);
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    text-align: left;
    padding: 12px 16px;
    border-bottom: 1px solid var(--borde);
    white-space: nowrap;
    z-index: 2;
  }

  td {
    border-bottom: 1px solid var(--borde-subtle);
    padding: 12px 16px;
    font-size: 13px;
    color: var(--texto);
  }

  tr:hover td { background: #f8fafc; }

  .badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 9px;
    border-radius: 12px;
    font-size: 11.5px;
    font-weight: 600;
    text-transform: none;
  }

  .badge.success { background: var(--verde-light); color: #065f46; }
  .badge.warning { background: var(--amarillo-light); color: #92400e; }
  .badge.danger { background: var(--rojo-light); color: #991b1b; }
  .badge.info { background: var(--celeste); color: var(--azul-2); }
  .badge.neutral { background: #f1f5f9; color: #475569; }

  /* FORMULARIOS */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 12.5px;
    color: var(--texto);
    font-weight: 600;
  }

  input, select, textarea {
    width: 100%;
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    padding: 10px 12px;
    background: var(--blanco);
    color: var(--texto);
    outline: none;
    font-size: 13.5px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--azul-2);
    box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.12);
  }

  input[readonly] { background: #f1f5f9; color: var(--gris); cursor: not-allowed; }
  textarea { min-height: 85px; resize: vertical; }

  .notice {
    grid-column: 1 / -1;
    padding: 12px 16px;
    border-radius: var(--radius);
    background: #fffbeb;
    border: 1px solid #fde68a;
    color: #92400e;
    font-size: 13px;
  }

  .form-actions {
    grid-column: 1 / -1;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding-top: 10px;
  }

  /* PAGER */
  .pager {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    color: var(--gris);
    font-size: 13px;
  }

  /* GESTION PARTICIPANTES */
  /* KPIS MODULARES (REPORTES, DEMANDA, FORMULARIOS) */
  .module-kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }

  .module-kpi {
    padding: 16px 18px;
    border-radius: var(--radius-lg);
    background: var(--blanco);
    border: 1px solid var(--borde);
    box-shadow: var(--sombra-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }

  .module-kpi:hover {
    transform: translateY(-2px);
    box-shadow: var(--sombra);
    border-color: #bfdbfe;
  }

  .module-kpi::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    background: var(--azul-2);
  }

  .module-kpi.accent-blue::before { background: var(--azul-2); }
  .module-kpi.accent-emerald::before { background: var(--verde); }
  .module-kpi.accent-teal::before { background: #14b8a6; }
  .module-kpi.accent-amber::before { background: var(--amarillo); }
  .module-kpi.accent-purple::before { background: #8b5cf6; }
  .module-kpi.accent-indigo::before { background: #6366f1; }
  .module-kpi.accent-cyan::before { background: #0ea5e9; }
  .module-kpi.accent-rose::before { background: var(--rojo); }
  .module-kpi.accent-orange::before { background: #f97316; }
  .module-kpi.accent-slate::before { background: #64748b; }

  .module-kpi span {
    color: var(--gris);
    font-size: 11.5px;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 6px;
  }

  .module-kpi strong {
    display: block;
    font-size: 24px;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--texto);
    line-height: 1.1;
  }

  /* PASOS DE IMPORTACION */
  .import-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }

  .import-step {
    padding: 16px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    box-shadow: var(--sombra-sm);
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all 0.2s ease;
  }

  .import-step:hover {
    border-color: #bfdbfe;
    box-shadow: var(--sombra);
    transform: translateY(-2px);
  }

  .step-badge {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--celeste);
    color: var(--azul-2);
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .import-step strong {
    display: block;
    color: var(--texto);
    font-size: 13.5px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .import-step p {
    margin: 0;
    color: var(--gris);
    font-size: 12px;
    line-height: 1.4;
  }

  .import-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
  }

  .mapping-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
    margin: 16px 0;
  }

  .import-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
    margin: 16px 0;
  }

  .import-summary .card {
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--fondo);
    border: 1px solid var(--borde);
    box-shadow: none;
  }

  .import-summary span {
    display: block;
    color: var(--gris);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
  }

  .import-summary strong {
    display: block;
    margin-top: 6px;
    font-size: 22px;
    font-weight: 800;
    color: var(--texto);
  }

  /* GESTION DE PARTICIPANTES */
  .gestion-selector {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-bottom: 20px;
    background: #f8fafc;
    padding: 16px 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--borde);
  }

  .gestion-selector .field {
    flex: 1;
    min-width: 260px;
  }

  .gestion-selector .btn {
    height: 42px;
    white-space: nowrap;
    padding: 0 20px;
  }

  /* PANEL DE ACCIONES MASIVAS */
  .bulk-panel {
    background: #f8fafc;
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bulk-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--borde);
  }

  .bulk-title {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--azul-1);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bulk-selection-tools {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .bulk-controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    align-items: end;
  }

  .bulk-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .bulk-group label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    color: var(--gris);
  }

  .input-action-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .input-action-group select {
    flex: 1;
    padding: 7px 10px;
    font-size: 13px;
    height: 38px;
  }

  .input-action-group .btn {
    height: 38px;
    padding: 0 12px;
    font-size: 12.5px;
    white-space: nowrap;
  }

  .bulk-buttons-group {
    display: flex;
    gap: 6px;
  }

  .bulk-buttons-group .btn {
    flex: 1;
    height: 38px;
    padding: 0 10px;
    font-size: 12px;
    white-space: nowrap;
  }

  .gestion-scroll-hint {
    font-size: 12px;
    color: var(--gris);
    margin: 12px 0 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .gestion-scroll {
    width: 100%;
    max-height: clamp(340px, 55vh, 650px);
    overflow-y: auto;
    overflow-x: scroll;
    overscroll-behavior: contain;
    scrollbar-gutter: stable both-edges;
    position: relative;
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    background: var(--blanco);
    box-shadow: var(--sombra-sm);
  }

  .gestion-scroll .gestion-table {
    width: 100%;
    min-width: 1750px;
    border-collapse: separate;
    border-spacing: 0;
  }

  .gestion-table th {
    padding: 12px 14px;
    font-size: 11.5px;
    font-weight: 700;
    color: var(--gris);
    background: #f8fafc;
    border-bottom: 2px solid var(--borde);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .gestion-table th.th-center,
  .gestion-table td.td-center {
    text-align: center;
  }

  .gestion-table td {
    padding: 10px 12px;
    font-size: 13px;
    vertical-align: middle;
    border-bottom: 1px solid var(--borde-subtle);
  }

  .gestion-table tr:hover td {
    background: #f1f5f9;
  }

  .gestion-table .col-check { width: 44px; text-align: center; }
  .gestion-table .col-persona { min-width: 230px; max-width: 280px; }
  .gestion-table .col-doc { min-width: 120px; white-space: nowrap; }
  .gestion-table .col-edad { min-width: 80px; text-align: center; white-space: nowrap; }
  .gestion-table .col-pmjh { min-width: 110px; text-align: center; }
  .gestion-table .col-requisitos { min-width: 145px; }
  .gestion-table .col-seleccion { min-width: 160px; }
  .gestion-table .col-confirma { min-width: 145px; }
  .gestion-table .col-asistidas { min-width: 85px; text-align: center; }
  .gestion-table .col-total { min-width: 85px; text-align: center; }
  .gestion-table .col-resultado { min-width: 135px; text-align: center; }
  .gestion-table .col-cert { min-width: 145px; }
  .gestion-table .col-obs { min-width: 220px; }

  .gestion-table td.nombre strong {
    display: block;
    color: var(--texto);
    font-size: 13.5px;
    font-weight: 700;
    line-height: 1.25;
  }

  .gestion-table td.nombre small {
    display: block;
    color: var(--gris);
    font-size: 11.5px;
    margin-top: 2px;
    word-break: break-all;
  }

  .gestion-table select {
    width: 100%;
    min-width: 130px;
    padding: 7px 24px 7px 10px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    border: 1px solid var(--borde);
    background-color: var(--blanco);
    cursor: pointer;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .gestion-table select:focus {
    border-color: var(--azul-2);
    box-shadow: 0 0 0 2px rgba(30, 58, 138, 0.15);
  }

  .gestion-table input[type="number"] {
    width: 60px;
    text-align: center;
    padding: 7px 6px;
    font-size: 13px;
    font-weight: 700;
    border-radius: var(--radius-sm);
    border: 1px solid var(--borde);
    margin: 0 auto;
    display: block;
  }

  .gestion-table input.obs {
    width: 100%;
    min-width: 200px;
    padding: 7px 10px;
    font-size: 12.5px;
    border-radius: var(--radius-sm);
  }

  .gestion-table .badge {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2px;
    display: inline-block;
  }

  .empty-state { text-align: center; padding: 36px; color: var(--gris); }

  /* MODALES Y TOASTS */
  [hidden],
  .modal-overlay[hidden] {
    display: none !important;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(11, 31, 58, 0.45);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeInModal 0.2s ease-out;
  }

  .modal-box {
    background: var(--blanco);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 550px;
    max-height: 90vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--borde);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-header h3 { margin: 0; font-size: 17px; font-weight: 700; color: var(--texto); }
  .modal-close { background: transparent; border: 0; font-size: 24px; cursor: pointer; color: var(--gris); }
  .modal-body { padding: 22px; }
  .modal-footer {
    padding: 16px 22px;
    border-top: 1px solid var(--borde);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    background: #f8fafc;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
  }

  @keyframes fadeInModal {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }

  /* TOASTS FLOTANTES */
  .toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 9999;
    pointer-events: none;
  }

  .toast {
    pointer-events: auto;
    min-width: 280px;
    max-width: 420px;
    padding: 14px 18px;
    border-radius: var(--radius);
    background: var(--blanco);
    color: var(--texto);
    box-shadow: var(--sombra-lg);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 13.5px;
    border-left: 4px solid var(--azul-2);
    animation: slideInToast 0.25s ease-out forwards;
  }

  .toast.success { border-left-color: var(--verde); }
  .toast.error { border-left-color: var(--rojo); }
  .toast.warning { border-left-color: var(--amarillo); }

  .toast-close {
    background: transparent;
    border: 0;
    color: var(--gris);
    cursor: pointer;
    font-size: 16px;
  }

  @keyframes slideInToast {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* LOADING */
  .loading {
    position: fixed;
    top: 76px;
    right: 24px;
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(8px);
    border: 1px solid var(--borde);
    border-radius: 20px;
    box-shadow: var(--sombra);
    z-index: 99;
    pointer-events: none;
  }

  .loading.show { display: flex; }
  .loading span { color: var(--azul-2); font-size: 12.5px; font-weight: 700; }
  .spinner {
    width: 18px;
    height: 18px;
    border: 2.5px solid #dbeafe;
    border-top-color: var(--azul-2);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* OVERLAY MENU MOVIL */
  .menu-toggle {
    display: none;
    background: transparent;
    border: 0;
    font-size: 22px;
    cursor: pointer;
    color: var(--texto);
    padding: 4px;
  }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(2px);
    z-index: 99;
  }

  /* ==========================================================================
     CALENDARIO DE CAPACITACIONES
     ========================================================================== */
  .calendar-panel {
    padding: 24px;
    margin-bottom: 24px;
  }

  .calendar-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--borde);
  }

  .calendar-nav-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .calendar-month-title {
    margin: 0 0 0 12px;
    font-size: 19px;
    font-weight: 800;
    color: var(--azul-1);
    text-transform: capitalize;
  }

  .calendar-view-toggle {
    display: flex;
    gap: 6px;
    background: #f1f5f9;
    padding: 4px;
    border-radius: var(--radius);
  }

  .calendar-view-toggle .btn {
    border-radius: var(--radius-sm);
  }

  .calendar-filters {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
    padding: 16px;
    background: #f8fafc;
    border-radius: var(--radius-lg);
    border: 1px solid var(--borde);
  }

  .calendar-filters .field {
    margin: 0;
  }

  .calendar-filters .field label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--gris);
    margin-bottom: 4px;
    display: block;
  }

  .calendar-filters select,
  .calendar-filters input {
    width: 100%;
    padding: 8px 10px;
    font-size: 12.5px;
    height: 38px;
    border-radius: var(--radius-sm);
  }

  .calendar-legend {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--gris);
  }

  .calendar-legend .legend-title {
    color: var(--texto);
    font-weight: 700;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .dot-empleo { background: #2563eb; }
  .dot-emprendimiento { background: #059669; }
  .dot-transversal { background: #7c3aed; }

  /* Cuadrícula Mensual */
  .calendar-grid-container {
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: var(--blanco);
    box-shadow: var(--sombra-sm);
  }

  .calendar-weekdays-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: #f8fafc;
    border-bottom: 2px solid var(--borde);
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--gris);
    padding: 10px 0;
    letter-spacing: 0.5px;
  }

  .calendar-days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    background: var(--borde-subtle);
    gap: 1px;
  }

  .cal-day-cell {
    min-height: 125px;
    background: var(--blanco);
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    transition: background 0.15s ease;
    cursor: pointer;
  }

  .cal-day-cell:hover {
    background: #f8fafc;
  }

  .cal-day-other-month {
    background: #fbfcfe;
    opacity: 0.45;
  }

  .cal-day-today {
    background: #f0f7ff;
  }

  .cal-day-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }

  .cal-day-num {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--texto);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .cal-day-today .cal-day-num {
    background: var(--azul-2);
    color: #ffffff;
  }

  .cal-events-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
  }

  .cal-event-chip {
    display: flex;
    flex-direction: column;
    padding: 4px 6px;
    border-radius: 6px;
    font-size: 11px;
    line-height: 1.25;
    cursor: pointer;
    border-left: 3px solid var(--azul-2);
    background: #f1f5f9;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    text-align: left;
  }

  .cal-event-chip:hover {
    transform: translateX(2px);
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .cal-event-chip.chip-empleo {
    background: #eff6ff;
    border-left-color: #2563eb;
    color: #1e40af;
  }

  .cal-event-chip.chip-emprendimiento {
    background: #ecfdf5;
    border-left-color: #059669;
    color: #065f46;
  }

  .cal-event-chip.chip-transversal {
    background: #f5f3ff;
    border-left-color: #7c3aed;
    color: #5b21b6;
  }

  .cal-event-chip strong {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  .cal-event-chip small {
    font-size: 9.5px;
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: block;
  }

  .cal-more-btn {
    border: none;
    background: rgba(0,0,0,0.05);
    font-size: 10px;
    font-weight: 700;
    color: var(--azul-2);
    padding: 2px 6px;
    border-radius: 4px;
    cursor: pointer;
    text-align: center;
    margin-top: 2px;
  }

  /* Vista de Lista Cronológica */
  .calendar-list-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }

  .cal-list-card {
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    padding: 18px;
    box-shadow: var(--sombra-sm);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 14px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    border-top: 4px solid var(--azul-2);
  }

  .cal-list-card.border-empleo { border-top-color: #2563eb; }
  .cal-list-card.border-emprendimiento { border-top-color: #059669; }
  .cal-list-card.border-transversal { border-top-color: #7c3aed; }

  .cal-list-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--sombra);
  }

  .cal-list-card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .cal-list-card-head h4 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--texto);
    line-height: 1.35;
  }

  .cal-list-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 12.5px;
    color: var(--gris);
  }

  .cal-list-meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .cal-list-meta-row strong {
    color: var(--texto);
  }

  .cal-countdown-badge {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
  }

  .countdown-hoy { background: #fee2e2; color: #991b1b; }
  .countdown-pronto { background: #fef3c7; color: #92400e; }
  .countdown-curso { background: #dbeafe; color: #1e40af; }
  .countdown-futuro { background: #f1f5f9; color: #475569; }

  /* Modal de Detalle de Actividad */
  .modal-detalle-actividad {
    max-width: 620px;
  }

  .detalle-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .detalle-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 13px;
  }

  .detalle-item.full {
    grid-column: 1 / -1;
  }

  .detalle-item label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--gris);
  }

  .detalle-item strong {
    font-size: 13.5px;
    color: var(--texto);
  }

  /* ==========================================================================
     PLANIFICADOR DE SESIONES Y HORARIOS (CRONOGRAMA)
     ========================================================================== */
  .schedule-builder-card {
    grid-column: 1 / -1;
    background: #f8fafc;
    border: 1px solid var(--borde);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    margin: 8px 0 16px;
  }

  .schedule-builder-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .schedule-builder-head h4 {
    margin: 0;
    font-size: 14.5px;
    font-weight: 700;
    color: var(--azul-1);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .schedule-builder-head p {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--gris);
  }

  .days-picker-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 12px;
  }

  .days-picker-group label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--gris);
  }

  .days-toggles-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .day-toggle-btn {
    width: 42px;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--borde);
    background: var(--blanco);
    color: var(--texto);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }

  .day-toggle-btn:hover {
    border-color: var(--azul-2);
  }

  .day-toggle-btn.active {
    background: var(--azul-2);
    color: #ffffff;
    border-color: var(--azul-2);
    box-shadow: 0 2px 4px rgba(30, 58, 138, 0.2);
  }

  .schedule-inputs-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    align-items: flex-end;
    margin-bottom: 12px;
  }

  .schedule-inputs-row .field {
    margin: 0;
  }

  .sessions-container {
    margin-top: 14px;
    background: var(--blanco);
    border: 1px solid var(--borde);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .sessions-table-header {
    display: grid;
    grid-template-columns: 80px 1.4fr 1fr 1fr 44px;
    background: #f1f5f9;
    border-bottom: 1px solid var(--borde);
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 700;
    color: var(--gris);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .sessions-list-body {
    max-height: 220px;
    overflow-y: auto;
  }

  .session-item-row {
    display: grid;
    grid-template-columns: 80px 1.4fr 1fr 1fr 44px;
    gap: 8px;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid var(--borde-subtle);
  }

  .session-item-row:last-child {
    border-bottom: none;
  }

  .session-badge {
    font-size: 11px;
    font-weight: 700;
    background: #e2e8f0;
    color: #334155;
    padding: 3px 6px;
    border-radius: 4px;
    text-align: center;
    display: inline-block;
  }

  .session-item-row input[type="date"],
  .session-item-row input[type="time"] {
    width: 100%;
    padding: 6px 8px;
    font-size: 12px;
    height: 32px;
    border-radius: 4px;
  }

  .btn-remove-session {
    background: transparent;
    border: 1px solid transparent;
    color: #ef4444;
    cursor: pointer;
    font-size: 15px;
    width: 28px;
    height: 28px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-remove-session:hover {
    background: #fee2e2;
  }

  /* Detalle de Sesiones en Modal Calendario */
  .detalle-sesiones-box {
    max-height: 180px;
    overflow-y: auto;
