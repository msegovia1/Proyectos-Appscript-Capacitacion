<section id="registro-actividades" class="view">
  <div class="section-head">
    <div>
      <h2>Registrar actividad</h2>
      <p>Cree una nueva actividad de capacitación (curso, taller, programa o charla).</p>
    </div>
    <button class="btn secondary" type="button" onclick="irAVista('actividades')">Ver listado de actividades</button>
  </div>
  <div class="card panel">
    <h3>Nueva actividad de capacitación</h3>
    <form id="formActividad" class="form-grid">
      <div class="field full"><label>Nombre actividad *</label><input name="NOMBRE_ACTIVIDAD" required></div>
      <div class="field"><label>Tipo *</label><select name="TIPO_ACTIVIDAD" required><option>Curso</option><option>Programa</option><option>Taller</option><option>Charla</option><option>Jornada</option></select></div>
      <div class="field"><label>Programa *</label><input name="PROGRAMA" value="Capacitación" required></div>
      <div class="field">
        <label>Escuela / línea</label>
        <select id="escuelaLineaActividad" name="ESCUELA_LINEA" onchange="actualizarAreasActividad()">
          <option value="">Seleccione una escuela o línea...</option>
          <option value="Empleo">Empleo</option>
          <option value="Emprendimiento">Emprendimiento</option>
          <option value="Transversal">Transversal</option>
        </select>
      </div>
      <div class="field">
        <label>Área temática</label>
        <select id="areaTematicaActividad" name="AREA_TEMATICA" disabled>
          <option value="">Primero seleccione una escuela o línea...</option>
        </select>
      </div>
      <div class="field"><label>Año</label><input name="ANO" type="number" value="2026"></div>
      <div class="field"><label>Sesiones totales</label><input id="regSesionesTotales" name="SESIONES_TOTALES" type="number" min="1" value="1" onchange="sincronizarContadorSesiones('reg')"></div>
      <div class="field"><label>Regla de resultado</label><select name="REGLA_RESULTADO"><option>Asistencia</option><option>Porcentaje</option></select></div>
      <div class="field"><label>Porcentaje de aprobación</label><input name="PORCENTAJE_APROBACION" type="number" min="0" max="100" step="0.1" placeholder="Ej.: 80"></div>
      <div class="field"><label>Requiere selección</label><select name="REQUIERE_SELECCION"><option>Sí</option><option>No</option></select></div>
      <div class="field"><label>Cupos</label><input name="CUPOS" type="number" min="0" placeholder="Ej.: 25"></div>
      <div class="field"><label>Fecha inicio</label><input id="regFechaInicio" name="FECHA_INICIO" type="date"></div>
      <div class="field"><label>Fecha término</label><input id="regFechaTermino" name="FECHA_TERMINO" type="date"></div>
      <div class="field"><label>Modalidad</label><select name="MODALIDAD"><option>Presencial</option><option>Online</option><option>Híbrida</option></select></div>

      <!-- PLANIFICADOR DE CRONOGRAMA Y SESIONES -->
      <div class="schedule-builder-card">
        <div class="schedule-builder-head">
          <div>
            <h4>🗓️ Cronograma y horario de sesiones</h4>
            <p>Especifique los días y el horario para programar cada sesión individual en el calendario.</p>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn secondary compact" type="button" onclick="generarCronogramaAutomatico('reg')">🪄 Generar sesiones</button>
            <button class="btn secondary compact" type="button" onclick="agregarSesionFila('reg')">＋ Sesión manual</button>
          </div>
        </div>

        <div class="days-picker-group">
          <label>Días de clase en la semana:</label>
          <div class="days-toggles-row" id="regDiasSemana">
            <button type="button" class="day-toggle-btn active" data-dia="1" onclick="alternarDiaSemana('reg', 1)">Lun</button>
            <button type="button" class="day-toggle-btn" data-dia="2" onclick="alternarDiaSemana('reg', 2)">Mar</button>
            <button type="button" class="day-toggle-btn" data-dia="3" onclick="alternarDiaSemana('reg', 3)">Mié</button>
            <button type="button" class="day-toggle-btn" data-dia="4" onclick="alternarDiaSemana('reg', 4)">Jue</button>
            <button type="button" class="day-toggle-btn" data-dia="5" onclick="alternarDiaSemana('reg', 5)">Vie</button>
            <button type="button" class="day-toggle-btn" data-dia="6" onclick="alternarDiaSemana('reg', 6)">Sáb</button>
          </div>
        </div>

        <div class="schedule-inputs-row">
          <div class="field">
            <label>Hora inicio</label>
            <input id="regHoraInicio" type="time" value="10:00" onchange="sincronizarHorarioTexto('reg')">
          </div>
          <div class="field">
            <label>Hora término</label>
            <input id="regHoraFin" type="time" value="12:00" onchange="sincronizarHorarioTexto('reg')">
          </div>
          <div class="field" style="flex:2">
            <label>Resumen de horario</label>
            <input id="regHorarioTexto" name="HORARIO" placeholder="Ej.: Lunes 10:00 a 12:00">
          </div>
        </div>

        <div class="sessions-container" id="regContenedorSesiones" style="display:none">
          <div class="sessions-table-header">
            <div>Sesión</div>
            <div>Fecha</div>
            <div>Inicio</div>
            <div>Término</div>
            <div></div>
          </div>
          <div class="sessions-list-body" id="regListaSesiones">
            <!-- Filas generadas dinámicamente -->
          </div>
        </div>
        <input type="hidden" id="regDetalleSesionesJson" name="DETALLE_SESIONES" value="">
      </div>

      <div class="field"><label>Estado</label><select name="ESTADO_ACTIVIDAD"><option>Planificada</option><option>Difusión</option><option>Inscripción abierta</option><option>En ejecución</option><option>Ejecutada</option><option>Suspendida</option><option>Cerrada</option></select></div>
      <div class="field"><label>Institución asociada</label><input name="INSTITUCION_ASOCIADA"></div>
      <div class="field"><label>Responsable</label><input name="RESPONSABLE" placeholder="Ej.: Nombre encargado"></div>
      <div class="field full"><label>Carpeta Drive</label><input name="CARPETA_DRIVE" placeholder="https://drive.google.com/..."></div>
      <div class="field full"><label>Observaciones</label><textarea name="OBSERVACIONES"></textarea></div>
      <div class="form-actions"><button class="btn" type="submit">Guardar actividad</button></div>
    </form>
  </div>
</section>
